<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>辛巴的後院</title>
<style>
:root{--ink:#3a2412;--cream:#fff6e0;--amber:#e9a23b;--card:rgba(255,246,224,.93)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#1c2a52;font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;color:var(--ink);touch-action:none;user-select:none}
#c{position:fixed;inset:0;width:100vw;height:100vh;image-rendering:pixelated;image-rendering:crisp-edges;display:block}
.hud{position:fixed;left:10px;top:10px;display:flex;flex-direction:column;gap:6px;pointer-events:none}
.bars{background:var(--card);border-radius:14px;padding:8px 10px;display:grid;grid-template-columns:auto 84px;gap:4px 8px;align-items:center;font-size:12px;box-shadow:0 2px 0 rgba(58,36,18,.25)}
.bar{height:8px;border-radius:5px;background:rgba(58,36,18,.15);overflow:hidden}
.bar i{display:block;height:100%;border-radius:5px;transition:width .3s}
.bar.low i{animation:blink .8s infinite}
@keyframes blink{50%{opacity:.35}}
#b-food{background:#c9823a}#b-water{background:#3a9bff}#b-energy{background:#8a6cf0}#b-fun{background:#ff6f91}
.lv{background:var(--card);border-radius:14px;padding:6px 10px;font-size:12px;box-shadow:0 2px 0 rgba(58,36,18,.25)}
.lv .bar{margin-top:4px;width:110px}#bondb{background:#ff4d6d}
.top-r{position:fixed;right:10px;top:10px;display:flex;gap:6px}
.top-r button,.top-r a{font:inherit;font-size:12px;border:0;background:rgba(30,20,10,.55);color:#fff;border-radius:10px;padding:6px 10px;cursor:pointer;text-decoration:none}
.dock{position:fixed;left:0;right:0;bottom:calc(10px + env(safe-area-inset-bottom));display:flex;justify-content:center;gap:8px;padding:0 8px;flex-wrap:wrap}
.dock button{font:inherit;font-weight:700;font-size:14px;border:0;border-bottom:4px solid #b9741f;background:var(--amber);color:var(--ink);border-radius:14px;padding:10px 14px;min-width:62px;cursor:pointer;touch-action:manipulation}
.dock button:active{transform:translateY(2px);border-bottom-width:2px}
#tricks{position:fixed;left:50%;flex-wrap:wrap;justify-content:center;width:max-content;max-width:calc(100vw - 20px);bottom:calc(72px + env(safe-area-inset-bottom));transform:translateX(-50%) scale(.9);opacity:0;pointer-events:none;display:flex;gap:8px;background:var(--card);padding:8px;border-radius:16px;transition:.15s}
#tricks.on{opacity:1;pointer-events:auto;transform:translateX(-50%) scale(1)}
#tricks button{font:inherit;font-weight:700;border:0;background:#fff;border-radius:10px;padding:8px 12px;border-bottom:3px solid #d9c9a8;color:var(--ink);cursor:pointer}
#toast{position:fixed;left:50%;top:18%;transform:translate(-50%,-10px);background:rgba(30,20,10,.78);color:#fff;padding:8px 16px;border-radius:20px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;white-space:nowrap}
#toast.on{opacity:1;transform:translate(-50%,0)}
button:focus-visible,a:focus-visible{outline:3px solid #fff;outline-offset:2px}
@media(max-width:560px){.dock{flex-wrap:nowrap;gap:5px}.dock button{flex:1;max-width:76px;min-width:0;padding:9px 2px;font-size:13px}.bars{grid-template-columns:auto 60px}.top-r{flex-direction:column;align-items:flex-end}}
@media(prefers-reduced-motion:reduce){.bar i,#toast,#tricks{transition:none}.bar.low i{animation:none}}
</style></head><body>
<canvas id="c" aria-label="辛巴的後院"></canvas>
<div class="hud">
 <div class="bars" role="group" aria-label="辛巴的狀態">
  <span>飽食</span><div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100"><i id="b-food"></i></div>
  <span>口渴</span><div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100"><i id="b-water"></i></div>
  <span>體力</span><div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100"><i id="b-energy"></i></div>
  <span>心情</span><div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100"><i id="b-fun"></i></div>
 </div>
 <div class="lv"><span id="lvl">默契 Lv 1</span><div class="bar"><i id="bondb" style="width:0"></i></div></div>
</div>
<div class="top-r"><button id="hatb" type="button" hidden>帽</button><button id="snd" type="button">音效 開</button><a href="https://claude.ai/artifact/Ed9P9CtSvjzm6tNa5JuPtm" target="_top">辛巴王的遊戲大廳</a></div>
<div id="toast" role="status"></div>
<div id="tricks"><button id="t-sit" type="button">坐下</button><button id="t-shake" type="button">握手</button><button id="t-roll" type="button">轉圈</button><button id="t-bow" type="button">鞠躬</button><button id="t-bark" type="button">汪汪</button><button id="t-hop" type="button">跳跳</button><button id="t-belly" type="button">翻肚</button></div>
<div class="dock">
 <button id="foodb" type="button">倒飼料</button><button id="waterb" type="button">加水</button><button id="ballb" type="button">丟球</button><button id="treatb" type="button">給點心</button><button id="trickb" type="button">指令</button><button id="sleepb" type="button"><span>睡覺</span></button>
</div>

<script>(function(){
"use strict";

var cv=document.getElementById('c'),g=cv.getContext('2d');
var Q=new URLSearchParams(location.search);
var S=1,DPR=1,K=1,W=0,H=0,WW=520,yh=0,yMin=0,yMax=0;
function clamp(v,a,b){return v<a?a:v>b?b:v}
function lerp(a,b,t){return a+(b-a)*t}
function rnd(a,b){return a+Math.random()*(b-a)}
function hex(c){return [parseInt(c.slice(1,3),16),parseInt(c.slice(3,5),16),parseInt(c.slice(5,7),16)]}
function mix(c1,c2,t){var a=hex(c1),b=hex(c2);return 'rgb('+Math.round(lerp(a[0],b[0],t))+','+Math.round(lerp(a[1],b[1],t))+','+Math.round(lerp(a[2],b[2],t))+')'}

/* ---------- 存檔 ---------- */
var KEY='simba-yard-v1';
var st={food:78,water:78,energy:90,fun:70,bond:0,lvl:1,sound:true,hat:null,t:Date.now(),foodBowl:0.0,waterBowl:0.0,days:0,seen:0};
try{var sv=JSON.parse(localStorage.getItem(KEY)||'null');if(sv){for(var k in sv)st[k]=sv[k];
  var away=clamp((Date.now()-(sv.t||Date.now()))/1000,0,6*3600);
  st.food=Math.max(30,st.food-away*0.008);st.water=Math.max(30,st.water-away*0.011);st.fun=Math.max(30,st.fun-away*0.006);st.energy=Math.min(100,st.energy+away*0.01);
}}catch(e){}
var now=new Date(),mon=now.getMonth()+1,dayN=now.getDate();
var xmasSeason=(mon===12)||(mon===11&&dayN>=15)||(mon===1&&dayN<=5);
if(Q.get('xmas')==='1')xmasSeason=true;if(Q.get('xmas')==='0')xmasSeason=false;
st.hat=false;
function save(){st.t=Date.now();try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}}
setInterval(save,5000);window.addEventListener('pagehide',save);

/* ---------- 精靈 ---------- */
function mk(rows,w,h){var c=document.createElement('canvas');c.width=w;c.height=h;var x=c.getContext('2d');
  for(var y=0;y<rows.length;y++){var r=rows[y],i=0;while(i<r.length){var ch=r[i];if(ch==='.'||!PAL[ch]){i++;continue}var j=i;while(j+1<r.length&&r[j+1]===ch)j++;x.fillStyle=PAL[ch];x.fillRect(i,y,j-i+1,1);i=j+1}}
  return c}

/* ---------- 時間 ---------- */
function hourNow(){if(Q.get('hour')!==null)return parseFloat(Q.get('hour'));var d=new Date();return d.getHours()+d.getMinutes()/60}
var SKY=[[0,'#0b1230','#1c2a52'],[5,'#2a2f5e','#e58a6b'],[7,'#5aa6e8','#bfe4f7'],[12,'#4aa0ef','#b8e6ff'],[17,'#5a8fd8','#f2c28b'],[19,'#3a3466','#e0714f'],[20.5,'#141a3f','#2b3a6b'],[24,'#0b1230','#1c2a52']];
function skyAt(h){for(var i=0;i<SKY.length-1;i++){var a=SKY[i],b=SKY[i+1];if(h>=a[0]&&h<=b[0]){var t=(h-a[0])/(b[0]-a[0]);return [mix(a[1],b[1],t),mix(a[2],b[2],t)]}}return [SKY[0][1],SKY[0][2]]}
function nightAmt(h){if(h>=20.5||h<5)return 1;if(h>=19)return (h-19)/1.5;if(h<6.5)return 1-(h-5)/1.5;return 0}
function duskAmt(h){if(h>=16.5&&h<19.5)return 1-Math.abs(h-18)/1.5;if(h>=5&&h<7.5)return 1-Math.abs(h-6.2)/1.3;return 0}

/* ---------- 版面 ---------- */
var worldC=null,hillC=null;
function layout(){
  var w=window.innerWidth,h=window.innerHeight;
  S=w<560?3:(w<1000?4:5);DPR=Math.min(2,window.devicePixelRatio||1);K=S*DPR;
  W=Math.ceil(w/S);H=Math.ceil(h/S);cv.width=Math.round(w*DPR);cv.height=Math.round(h*DPR);
  yh=Math.round(H*0.42);yMin=yh+16;yMax=H-38;if(yMax<yMin+30)yMax=yMin+30;
  WW=Math.max(520,W+200);
  buildWorld();
}
function px(c,x,y,w,h,col){c.fillStyle=col;c.fillRect(Math.round(x),Math.round(y),w,h)}
function circ(c,cx,cy,r,col){c.fillStyle=col;cx=Math.round(cx);cy=Math.round(cy);for(var dy=-r;dy<=r;dy++){var w=Math.floor(Math.sqrt(r*r-dy*dy+0.25));c.fillRect(cx-w,cy+dy,2*w+1,1)}}
function seeded(s){return function(){s=(s*16807)%2147483647;return s/2147483647}}

function buildWorld(){
  var R=seeded(7);
  // 遠山（視差）
  var hw=Math.ceil(WW*0.35)+W+20;
  hillC=document.createElement('canvas');hillC.width=hw;hillC.height=yh;var c=hillC.getContext('2d');
  for(var layer=0;layer<2;layer++){var col=layer?'#6faa7a':'#8cc4a0',base=yh-6-layer*0+(layer?0:-10);
    for(var x=0;x<hw;x++){var hgt=14+Math.sin(x*0.035+layer*2)*8+Math.sin(x*0.011+layer)*10+(layer?0:10);c.fillStyle=col;c.fillRect(x,Math.round(base-hgt),1,Math.round(hgt)+6)}}
  // 地面 + 圍籬 + 後方樹叢（世界座標）
  worldC=document.createElement('canvas');worldC.width=WW;worldC.height=H;c=worldC.getContext('2d');
  // 後方樹籬
  for(var x=-10;x<WW+20;x+=14){var hh=10+Math.floor(R()*8);circ(c,x,yh-14-hh/2,8,'#3f8f55');circ(c,x+3,yh-18-hh/2,5,'#52a866')}
  for(var x2=0;x2<WW;x2+=14){circ(c,x2+5,yh-8,6,'#3a8450')}
  // 地面
  for(var y=yh-2;y<H;y++){var t=(y-yh)/(H-yh);var col2=mix('#8fd16b','#5fae4c',t);c.fillStyle=col2;c.fillRect(0,y,WW,1)}
  // 草紋
  for(var i=0;i<900;i++){var gx=Math.floor(R()*WW),gy=yh+4+Math.floor(R()*(H-yh-6));var d=(gy-yh)/(H-yh);
    c.fillStyle=R()<0.5?mix('#a6e27f','#76c25d',d):mix('#4f9d43','#3f8a3a',d);c.fillRect(gx,gy,1,2);if(R()<.4)c.fillRect(gx+1,gy+1,1,1)}
  // 小徑
  for(var x3=60;x3<WW-60;x3++){var py=Math.round(yMax-14+Math.sin(x3*0.03)*4);for(var k=0;k<7;k++){c.fillStyle=(k<1||k>5)?'#c9a66b':'#dfc08a';c.fillRect(x3,py+k,1,1)}}
  for(var i2=0;i2<160;i2++){var sx=60+Math.floor(R()*(WW-120)),sy=Math.round(yMax-14+Math.sin(sx*0.03)*4)+1+Math.floor(R()*5);c.fillStyle='#b99358';c.fillRect(sx,sy,1,1)}
  // 花
  var fc=['#ff6f91','#ffd166','#ffffff','#b392f5','#ff9f68'];
  for(var f=0;f<46;f++){var fx=Math.floor(R()*WW),fy=yh+8+Math.floor(R()*(H-yh-14));var cl=fc[Math.floor(R()*fc.length)];
    c.fillStyle='#3f8a3a';c.fillRect(fx,fy+1,1,2);c.fillStyle=cl;c.fillRect(fx-1,fy,3,1);c.fillRect(fx,fy-1,1,3);c.fillStyle='#ffd166';c.fillRect(fx,fy,1,1)}
  // 圍籬
  var fy2=yh-3;
  for(var x4=0;x4<WW;x4+=7){px(c,x4,fy2-13,5,15,'#d9b27c');px(c,x4,fy2-13,5,2,'#ecc896');px(c,x4+4,fy2-12,1,14,'#b98f58');px(c,x4+1,fy2-14,3,1,'#d9b27c')}
  px(c,0,fy2-9,WW,2,'#c4996a');px(c,0,fy2-4,WW,2,'#c4996a');px(c,0,fy2-9,WW,1,'#e0bd8c');
  px(c,0,fy2+2,WW,1,'#6d9a4d');
}

/* ---------- 世界物件 ---------- */
var HOUSE={x:70,y:0},FOOD={x:190,y:0},WATER={x:222,y:0},TREE={x:350,y:0},XTREE={x:455,y:0},LAMP={x:150,y:0};
function placeObjs(){var mid=Math.round((yMin+yMax)/2);HOUSE.y=yMin+10;FOOD.y=mid+6;WATER.y=mid+6;TREE.y=yMin+6;XTREE.y=yMin+12;LAMP.y=yMin+4;
  FOOD.x=Math.round(WW*0.38);WATER.x=FOOD.x+34;HOUSE.x=70;TREE.x=Math.round(WW*0.66);XTREE.x=WW-60;LAMP.x=Math.round(WW*0.3)}

function drawHouse(c,ox,night){var x=HOUSE.x-ox,y=HOUSE.y;

  var o=a.createOscillator();o.type='sawtooth';o.frequency.setValueAtTime(pitch*1.25,t);o.frequency.exponentialRampToValueAtTime(pitch,t+.03);o.frequency.exponentialRampToValueAtTime(pitch*.6,t+.16);

function updateDog(dt){
  // 動作中
  if(dog.petT>0)dog.petT-=dt;
  if(dog.state==='act'){var a=dog.act;a.t+=dt;if(a.tick)a.tick(a,dt);if(dog.state==='act'&&a.t>=a.dur)endAct();return}
  if(dog.state==='sleep'){dog.sleepT+=dt;st.energy=clamp(st.energy+dt*2.2,0,100);if(Math.random()<dt*.5&&dog.headPt)zzz(dog.headPt[0]-dog.face*2,dog.headPt[1]-2);
    if(st.energy>=100&&nightAmt(hourNow())<.3){wake()}return}
  if(dog.state==='move'&&dog.goal){
    var gx=dog.goal.x,gy=dog.goal.y;
    if(dog.chase){gx=ball.x;gy=ball.y;if(ball.state==='carried'){}}
    var dx=gx-dog.x,dy=gy-dog.y,d=Math.hypot(dx,dy);
    var sp=dog.run?64:24;if(d<1.5||(d<sp*dt)){dog.x=gx;dog.y=gy;var th=dog.goal.then;dog.goal=null;dog.state='idle';dog.idleT=0;dog.chase=false;if(th)th();return}
    if(Math.abs(dx)>2)dog.face=dx>0?1:-1;
    dog.x+=dx/d*sp*dt;dog.y+=dy/d*sp*dt;dog.stride+=sp*dt;
    if(dog.run){st.energy=clamp(st.energy-dt*.35,0,100);if(Math.random()<dt*9)dust(dog.x-dog.face*12,dog.y)}
    else st.energy=clamp(st.energy-dt*.06,0,100);
    return}
  // idle
  dog.idleT+=dt;st.food=clamp(st.food-dt*0.022,0,100);
  if(dog.idleT>.6&&ballInterest()&&ball.state!=='carried'&&st.energy>8){dog.chase=true;chaseBall();return}
  if(dog.idleT>1.5){
    var h=hourNow(),night=nightAmt(h);
    if(st.food<32&&st.foodBowl>.05&&Math.random()<.5){eatAt();return}
    if(st.water<32&&st.waterBowl>.05&&Math.random()<.5){drinkAt();return}
    if(st.energy<18||(night>.8&&st.energy<70&&Math.random()<.3)){sleepNow();return}
  }
  // 需求提示
  if(!dog.emote&&Math.random()<dt*.15){if(st.food<28&&st.foodBowl<.05)dog.emote={k:'food',t:3};else if(st.water<28&&st.waterBowl<.05)dog.emote={k:'water',t:3};else if(st.energy<20)dog.emote={k:'sleep',t:3};else if(st.fun<25)dog.emote={k:'ball',t:3}}

    else if(r<.6){dog.sitT=1;doAct('sit',rnd(4,9),null,null)}
    else if(r<.8){doAct('eat',rnd(1.4,2.4),function(a,dt){a.n+=dt;if(a.n>.6){a.n=0}},null)}
    else if(r<.9&&st.fun<80){doAct('sit',rnd(3,6),null,null)}
    else{doAct('lie',rnd(5,10),null,null)}
    dog.idleT=0}
}

        doAct('bark',.9,function(a){if(!a.p){a.p=1;ball.state='ground';ball.x=dog.x+dog.face*26;ball.y=dog.y+3;ball.z=0;ball.vx=ball.vy=ball.vz=0;dog.carry=false;SFX.woof()}},function(){fun(8);st.energy=clamp(st.energy-4,0,100);bondGain(1.5);heart(dog.x,dog.y-30)})})}

function updateBall(dt){

    ball.x=clamp(ball.x,6,WW-6);ball.y=clamp(ball.y,yMin-4,yMax+6)
  }

}

var AT=window.ATLAS,ATI=new Image();ATI.src=AT.img;

var blinkT=3;
function animOf(){
  var t=timeS;
  if(dog.state==='sleep')return ['sleep',Math.floor(t*1.5)%4];
  if(dog.state==='move'){
    if(dog.carry)return ['carry',Math.floor(dog.stride/24*8)%8];
    if(dog.run)return ['run',Math.floor(dog.stride/36*6)%6];
    return ['walk',Math.floor(dog.stride/24*8)%8]}
  if(dog.state==='act'){var n=dog.act.name,at=dog.act.t;
    switch(n){case 'eat':return ['eat',Math.floor(t*5)%4];case 'drink':return ['drink',Math.floor(t*6)%4];
      case 'bark':return ['bark',[0,1,1,2][Math.floor(at*6)%4]];case 'sit':return ['sit',Math.floor(t*5)%4];
      case 'shake':return ['shake',[0,1,2,3,2,3][Math.min(5,Math.floor(at*3))]];
      case 'lie':return ['lie',Math.floor(t*3)%4];case 'bow':return ['bow',Math.min(3,Math.floor(at*4))%4];
      case 'hop':return ['hop',Math.floor(at*9)%6];case 'belly':var bi=Math.floor(at*6);return ['belly',bi<3?bi:3+Math.floor(at*5)%3];case 'spin':return ['hop2',Math.floor(at*9)%6]}}
  if(dog.carry)return ['carry',0];
  blinkT-=1/60;
  if(dog.petT>0)return ['idle',[0,1][Math.floor(t*8)%2]];
  var f=[0,1,3,1][Math.floor(t*3)%4];if(Math.floor(t*0.5)%6===5&&Math.floor(t*3)%3===0)f=2;
  return ['idle',f];
}

function drawSky(h,night){
  var s=skyAt(h);var bands=Math.ceil(yh/3);
  for(var i=0;i<bands;i++){g.fillStyle=mix2(s[0],s[1],i/bands);g.fillRect(0,i*3,W,3)}
  // 星
  if(night>0.05){g.globalAlpha=night;var R=seeded(3);for(var k=0;k<46;k++){var sx=Math.floor(R()*W),sy=Math.floor(R()*yh*.7),tw=(Math.floor(timeS*1.5+k)%5!==0);if(tw)g.fillStyle='#fff',g.fillRect(sx,sy,1,1)}g.globalAlpha=1}
  // 太陽/月亮
  var p=(h-6)/12;
  if(h>=5.5&&h<=19.5){var sx2=lerp(W*.08,W*.92,clamp(p,0,1)),sy2=yh*.78-Math.sin(clamp(p,0,1)*Math.PI)*yh*.62;circ(g,sx2,sy2,9,'#fff3b0');circ(g,sx2,sy2,6,'#ffe27a')}
  else{var q=((h+6)%24)/12;if(q>1)q=1;var mx=lerp(W*.1,W*.9,clamp(((h<5.5?h+24:h)-19.5)/10.5,0,1)),my=yh*.7-Math.sin(clamp(((h<5.5?h+24:h)-19.5)/10.5,0,1)*Math.PI)*yh*.5;circ(g,mx,my,7,'#f6f1d8');circ(g,mx+3,my-1,6,mix2(s[0],s[1],.2))}
  // 雲
  clouds.forEach(function(c){var X=((c.x-timeS*c.v-camX*.12)%(W+80)+W+80)%(W+80)-40;cloud(X,c.y,c.s)});
}
function mix2(a,b,t){if(a.charAt(0)==='r'){var A=a.match(/\d+/g).map(Number),B=b.match(/\d+/g).map(Number);return 'rgb('+Math.round(lerp(A[0],B[0],t))+','+Math.round(lerp(A[1],B[1],t))+','+Math.round(lerp(A[2],B[2],t))+')'}return mix(a,b,t)}
function cloud(x,y,s){g.fillStyle='rgba(255,255,255,.92)';x=Math.round(x);y=Math.round(y);g.fillRect(x,y,14*s,3*s);g.fillRect(x+3*s,y-2*s,8*s,3*s);g.fillRect(x+7*s,y-3*s,5*s,2*s);g.fillStyle='rgba(200,220,240,.7)';g.fillRect(x,y+3*s-1,14*s,1)}

function glow(x,y,r,rgb,a){var gr=g.createRadialGradient(x,y,0,x,y,r);gr.addColorStop(0,'rgba('+rgb+','+a+')');gr.addColorStop(1,'rgba('+rgb+',0)');g.fillStyle=gr;g.fillRect(x-r,y-r,r*2,r*2)}

/* ---------- 主迴圈 ---------- */
function update(dt){
  timeS+=dt;var h=hourNow();
  st.water=clamp(st.water-dt*0.03,0,100);st.fun=clamp(st.fun-dt*0.02,0,100);
  if(dog.state!=='sleep')st.energy=clamp(st.energy-dt*0.012,0,100);
  updateDog(dt);updTail(dt);updPose(dt);updateBall(dt);updateTreat(dt);
  if(dog.emote){dog.emote.t-=dt;if(dog.emote.t<=0)dog.emote=null}
  dog.x=clamp(dog.x,12,WW-12);dog.y=clamp(dog.y,yMin,yMax);
  // 粒子
  for(var i=parts.length-1;i>=0;i--){var p=parts[i];p.t+=dt;if(p.t>=p.life){parts.splice(i,1);continue}p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.kind==='heart')p.vy+=6*dt;if(p.kind==='dot')p.vy+=70*dt}
  // 蝴蝶
  bfs.forEach(function(b){b.a+=rnd(-1,1)*dt*3;b.x+=Math.cos(b.a)*14*dt;b.y+=Math.sin(b.a)*8*dt;if(b.x<10||b.x>WW-10)b.a=Math.PI-b.a;b.y=clamp(b.y,yh-6,yMax-14)});
  // 雪
  if(xmasSeason)flakes.forEach(function(f){f.y+=f.v*dt;f.x+=Math.sin(timeS+f.ph)*4*dt;if(f.y>H){f.y=-2;f.x=Math.random()*W}});
  // 鏡頭
  var tx=clamp(dog.x-W/2,0,Math.max(0,WW-W));camX+=(tx-camX)*Math.min(1,dt*3.2);
  if(Math.abs(camX-tx)<.2)camX=tx;
  // 提示更新
  hudTick+=dt;if(hudTick>.25){hudTick=0;updHud()}
  if(Math.floor(timeS)!==update.lastSec){update.lastSec=Math.floor(timeS)}
}
var hudTick=0,last=performance.now();
function frame(t){var dt=Math.min(.05,(t-last)/1000);last=t;update(dt);render();requestAnimationFrame(frame)}

function toWorld(e){var r=cv.getBoundingClientRect();return {x:(e.clientX-r.left)/r.width*W+camX,y:(e.clientY-r.top)/r.height*H}}
var down=null,lastTapT=0,lastTapX=0;
cv.addEventListener('pointerdown',function(e){
  e.preventDefault();ac();var p=toWorld(e);down={x:p.x,y:p.y,t:performance.now(),moved:false};
  // 球
  if(ball.state==='ground'&&Math.abs(p.x-ball.x)<9&&Math.abs(p.y-(ball.y-3))<9){throwBall(clamp(camX+rnd(W*.1,W*.9),20,WW-20),rnd(yMin,yMax));down=null;return}
  // 狗
  if(Math.abs(p.x-dog.x)<24&&p.y>dog.y-34&&p.y<dog.y+6){pet(p.x,p.y);down=null;return}
  // 屋
  if(Math.abs(p.x-HOUSE.x)<28&&p.y>HOUSE.y-34&&p.y<HOUSE.y+4){sleepNow();down=null;return}
  if(Math.abs(p.x-FOOD.x)<12&&Math.abs(p.y-FOOD.y)<12){eatAt();down=null;return}
  if(Math.abs(p.x-WATER.x)<12&&Math.abs(p.y-WATER.y)<12){drinkAt();down=null;return}
  moveTo(p,performance.now()-lastTapT<350&&Math.abs(p.x-lastTapX)<20);lastTapT=performance.now();lastTapX=p.x;
});
cv.addEventListener('pointermove',function(e){if(!down)return;var p=toWorld(e);if(Math.hypot(p.x-down.x,p.y-down.y)>3)down.moved=true;if(down.moved&&dog.state==='move'&&!dog.chase){dog.goal.x=clamp(p.x,16,WW-16);dog.goal.y=clamp(p.y,yMin,yMax);dog.goal.then=null;dog.run=Math.hypot(p.x-dog.x,p.y-dog.y)>90}});
window.addEventListener('pointerup',function(){down=null});
function moveTo(p,dbl){
  if(dog.state==='sleep'){wake()}
  if(dog.state==='act'&&dog.act&&dog.act.name!=='sit'&&dog.act.t<dog.act.dur-.3){/* 讓牠做完 */}
  var d=Math.hypot(p.x-dog.x,p.y-dog.y);
  dog.chase=false;goTo(p.x,p.y,dbl||d>100,null);
  spawn({x:p.x,y:p.y,vx:0,vy:0,life:.5,t:0,kind:'dot',col:'#ffffff'});
}
