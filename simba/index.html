<!doctype html>

<style>

.dock button:active{transform:translateY(2px);border-bottom-width:2px}

#tricks.on{opacity:1;pointer-events:auto;transform:translateX(-50%) scale(1)}
#tricks button{font:inherit;font-weight:700;border:0;background:#fff;border-radius:10px;padding:8px 12px;border-bottom:3px solid #d9c9a8;color:var(--ink);cursor:pointer}

<script>/* 辛巴骨架動畫：單位座標，面向右，地面 y=0，往上為負 */
(function(G){
var COL={fur:'#e2a24e',furD:'#c7843a',furL:'#f2c27f',cream:'#f8deaa',ear:'#c27a33',earD:'#a9652a',line:'#4b2a12',nose:'#24150c',tongue:'#f07f95',tongueD:'#d95f78',eye:'#1e120a'};

function ik(h,f,L1,L2,bend){var dx=f[0]-h[0],dy=f[1]-h[1],d=Math.hypot(dx,dy),m=L1+L2-0.01;

  if(d<1e-3)d=1e-3;var a=(L1*L1-L2*L2+d*d)/(2*d),hh=Math.sqrt(Math.max(0,L1*L1-a*a)),ux=dx/d,uy=dy/d,px=h[0]+ux*a,py=h[1]+uy*a;
  var j=[px-uy*hh*bend,py+ux*hh*bend];return [j,f]}
// 錐形肢段
function limb(c,a,b,w1,w2,col){var dx=b[0]-a[0],dy=b[1]-a[1],d=Math.hypot(dx,dy)||1,nx=-dy/d,ny=dx/d;
  c.fillStyle=col;c.beginPath();c.moveTo(a[0]+nx*w1/2,a[1]+ny*w1/2);c.lineTo(b[0]+nx*w2/2,b[1]+ny*w2/2);c.lineTo(b[0]-nx*w2/2,b[1]-ny*w2/2);c.lineTo(a[0]-nx*w1/2,a[1]-ny*w1/2);c.closePath();c.fill();
  c.beginPath();c.arc(a[0],a[1],w1/2,0,Math.PI*2);c.fill();c.beginPath();c.arc(b[0],b[1],w2/2,0,Math.PI*2);c.fill()}
function ell(c,x,y,rx,ry,col,r){c.fillStyle=col;c.beginPath();c.ellipse(x,y,rx,ry,r||0,0,Math.PI*2);c.fill()}
function paw(c,p,col,ang){c.save();c.translate(p[0],p[1]);c.rotate(ang||0);ell(c,2.2,-2.6,5.4,3.2,col);c.restore()}

/* 姿勢參數 */
var BASE={bx:0,by:0,br:0,hat:0,hatSw:0,wagHz:9,           // 身體平移/旋轉（繞 (-6,-44)）
  head:0,neck:0,                     // 頭部旋轉、脖子下壓 (0~1)
  ear:0,mouth:0,tongue:0,eyes:1,     // 張嘴 0~1、舌頭 0~1、眼睛 1 開 0 閉 0.5 笑眼
  tail:0.7,wag:0,tailCurl:0.15,     // 尾巴仰角(弧度)、擺動量
  fn:[30,-3],ff:[34,-3],hn:[-30,-3],hf:[-26,-3], // 腳掌世界座標（近前、遠前、近後、遠後）
  pawLift:0,shake:0};
var PIV=[-6,-44];
function legsAndBody(c,P,layer){
  var T=function(p){return rot([p[0]+P.bx,p[1]+P.by],[PIV[0]+P.bx,PIV[1]+P.by],P.br)};
  var shN=T([27,-38]),shF=T([31,-38]),hpN=T([-34,-42]),hpF=T([-30,-42]);
  function front(sh,foot,col,colL){var r=ik(sh,foot,27,26,1);var j=r[0],f=r[1];
    limb(c,sh,j,15,10,col);limb(c,j,f,9.5,8,col);paw(c,f,colL,0);if(col===COL.fur){c.fillStyle=COL.furL;c.beginPath();c.moveTo(sh[0]-6,sh[1]+4);c.quadraticCurveTo(j[0]-8,j[1]-4,j[0]-4,j[1]+4);c.lineTo(j[0]-2,j[1]);c.closePath();c.fill()}}
  function hind(hp,foot,col,colL){
    // 飛節固定在腳掌後上方，大腿→小腿用 IK（膝蓋朝前）
    var sw=(foot[0]-hp[0])*0.03;
    var hock=[foot[0]-7+sw*6,foot[1]-15];
    var r=ik(hp,hock,22,20,1);var knee=r[0];hock=r[1];
    ell(c,hp[0]+1,hp[1]+7,13,17,col,0.25+sw*0.4);
    limb(c,knee,hock,11,8,col);limb(c,hock,foot,8,7.5,col);paw(c,foot,colL,0)}

  // 身體
  c.save();c.translate(P.bx,P.by);c.translate(PIV[0],PIV[1]);c.rotate(P.br);c.translate(-PIV[0],-PIV[1]);
  c.fillStyle=COL.fur;c.beginPath();
  c.moveTo(-48,-50);c.bezierCurveTo(-36,-62,0,-62,22,-60);c.bezierCurveTo(40,-58,46,-46,40,-34);
  c.bezierCurveTo(36,-18,24,-16,12,-20);c.bezierCurveTo(2,-23,-14,-28,-26,-29);c.bezierCurveTo(-40,-28,-54,-36,-48,-50);c.fill();
  // 胸前飾毛、腹部飾毛
  c.fillStyle=COL.cream;c.beginPath();c.moveTo(43,-46);c.bezierCurveTo(48,-32,40,-16,26,-14);c.bezierCurveTo(30,-20,30,-28,35,-38);c.fill();
  c.fillStyle=COL.furL;c.beginPath();c.moveTo(16,-21);c.bezierCurveTo(10,-14,2,-16,-4,-21);c.bezierCurveTo(-8,-18,-14,-20,-18,-26);c.lineTo(-8,-26);c.bezierCurveTo(2,-22,10,-23,16,-24);c.fill();
  // 背部亮面
  c.fillStyle=COL.furL;c.beginPath();c.moveTo(-40,-55);c.bezierCurveTo(-28,-61,4,-61,20,-59);c.bezierCurveTo(4,-57,-24,-56,-40,-53);c.fill();
  c.restore();

}
function tail(c,P,t){
  var base=rot([-47+P.bx,-50+P.by],[PIV[0]+P.bx,PIV[1]+P.by],P.br);
  var n=10,seg=5.2,pts=[],x=base[0],y=base[1];
  for(var i=0;i<n;i++){var w=Math.sin((P.tph!==undefined?P.tph:t*P.wagHz)-i*0.45)*P.wag*(0.3+i/n);
    var a=P.tail+P.tailCurl*i*0.25+w+P.br;x-=Math.cos(a)*seg;y-=Math.sin(a)*seg;pts.push([x,y])}

  var all=[base].concat(pts),top=[],bot=[],N=all.length;
  for(var i=0;i<N;i++){var p=all[i],q=all[Math.min(N-1,i+1)],r=all[Math.max(0,i-1)];var dx=q[0]-r[0],dy=q[1]-r[1],d=Math.hypot(dx,dy)||1,nx=-dy/d,ny=dx/d;
    if(ny<0){nx=-nx;ny=-ny}
    var u=i/(N-1),core=lerp(5.5,2,u),fe=core+Math.sin(Math.min(1,u*1.15)*Math.PI)*8.5+1.5*Math.sin(t*9+i);
    top.push([p[0]-nx*core,p[1]-ny*core]);bot.push([p[0]+nx*fe,p[1]+ny*fe])}
  function smooth(arr){c.moveTo(arr[0][0],arr[0][1]);for(var i=1;i<arr.length-1;i++){var mx=(arr[i][0]+arr[i+1][0])/2,my=(arr[i][1]+arr[i+1][1])/2;c.quadraticCurveTo(arr[i][0],arr[i][1],mx,my)}c.lineTo(arr[arr.length-1][0],arr[arr.length-1][1])}
  c.fillStyle=COL.fur;c.beginPath();smooth(top);var tip=all[N-1];c.quadraticCurveTo(tip[0]-3,tip[1]+1,bot[N-1][0],bot[N-1][1]);
  var br=bot.slice().reverse();for(var i2=1;i2<br.length-1;i2++){var mx2=(br[i2][0]+br[i2+1][0])/2,my2=(br[i2][1]+br[i2+1][1])/2;c.quadraticCurveTo(br[i2][0],br[i2][1],mx2,my2)}c.lineTo(br[br.length-1][0],br[br.length-1][1]);c.closePath();c.fill();
  // 飾毛亮色
  c.fillStyle=COL.furL;c.beginPath();var mid=[];for(var i3=1;i3<N;i3++){mid.push([lerp(all[i3][0],bot[i3][0],.55),lerp(all[i3][1],bot[i3][1],.55)])}
  c.moveTo(all[1][0],all[1][1]);for(var i4=0;i4<mid.length;i4++)c.lineTo(mid[i4][0],mid[i4][1]);for(var i5=N-1;i5>=1;i5--)c.lineTo(lerp(all[i5][0],bot[i5][0],.85),lerp(all[i5][1],bot[i5][1],.85));c.closePath();c.globalAlpha=.6;c.fill();c.globalAlpha=1;
}
function headDraw(c,P,t){
  var nb=rot([24+P.bx,-56+P.by],[PIV[0]+P.bx,PIV[1]+P.by],P.br);
  // 頭的位置：抬頭 vs 低頭吃飯
  var hx=lerp(50,56,P.neck),hy=lerp(-84,-14-P.by-LIFT,P.neck);
  var hc=rot([hx+P.bx,hy+P.by],[PIV[0]+P.bx,PIV[1]+P.by],P.br*(1-P.neck));
  // 脖子
  limb(c,nb,[hc[0]-4,hc[1]+6],30,22,COL.fur);
  c.fillStyle=COL.cream;
  c.save();c.translate(hc[0],hc[1]);c.rotate(P.head+lerp(0,0.75,P.neck));c.scale(1.4,1.4);
  var mo=P.mouth;
  // 下顎（張嘴時往下轉）與口腔
  c.save();c.translate(7,4);c.rotate(mo*0.32);
  c.fillStyle='#6a2c25';c.beginPath();c.moveTo(0,-2);c.lineTo(15,-2);c.lineTo(14,2);c.lineTo(0,2);c.fill();
  ell(c,8,1.6,9,3,COL.cream);c.restore();
  if(P.tongue>0.01){var ty=5+mo*2.5;c.save();c.translate(15,ty);ell(c,0,P.tongue*3.5,3.4,2+P.tongue*3.6,COL.tongue);c.fillStyle=COL.tongueD;c.fillRect(-0.4,0,0.8,1+P.tongue*5);c.restore()}
  // 頭骨
  ell(c,0,0,13,12,COL.fur);
  // 口鼻（寬而深）
  c.fillStyle=COL.fur;c.beginPath();c.moveTo(5,-7);c.bezierCurveTo(12,-7.5,20,-7,23,-5);c.bezierCurveTo(26.5,-3,26,3,22,5);c.bezierCurveTo(16,6.5,8,7,3,6);c.closePath();c.fill();
  c.fillStyle=COL.cream;c.beginPath();c.moveTo(8,1);c.bezierCurveTo(14,0.5,22,0.5,25.5,-0.5);c.bezierCurveTo(25,3.5,20,5.5,14,6);c.bezierCurveTo(10,6.2,7,4,8,1);c.fill();
  ell(c,1,4,5,4,COL.furL);
  ell(c,23.6,-4.2,3.6,2.9,COL.nose);ell(c,22.8,-5.2,1.1,0.7,'#7a6050');
  c.strokeStyle=COL.line;c.lineWidth=1.1;c.lineCap='round';c.beginPath();c.moveTo(11,5.4);c.quadraticCurveTo(18,6.2,23,3);c.stroke();
  // 眼睛
  if(P.eyes>0.75){ell(c,6.5,-4.5,2.4,2.6,COL.eye);ell(c,7.3,-5.4,0.9,0.9,'#fff')}
  else if(P.eyes>0.25){c.strokeStyle=COL.eye;c.lineWidth=1.6;c.beginPath();c.arc(6,-4,2.4,Math.PI*1.1,Math.PI*1.9);c.stroke()}
  else{c.strokeStyle=COL.eye;c.lineWidth=1.4;c.beginPath();c.arc(6,-5.5,2.4,Math.PI*0.15,Math.PI*0.85);c.stroke()}

  ell(c,6,-8.6,3,1.1,COL.furD,-0.15);

  c.save();c.translate(-5,-7);c.rotate(P.ear);

  c.fillStyle=COL.earD;c.beginPath();c.moveTo(-6,4);c.bezierCurveTo(-8,10,-6,16,-4,18);c.bezierCurveTo(-6,12,-6,8,-4,4);c.fill();
  c.restore();
  if(P.hat){c.save();c.translate(-2,-11);c.rotate(-0.35);
    c.fillStyle='#d8333a';c.beginPath();c.moveTo(-10,0);c.quadraticCurveTo(-4,-16,-14+P.hatSw*2,-20);c.quadraticCurveTo(4,-14,10,0);c.closePath();c.fill();
    ell(c,-14+P.hatSw*2,-20,3.2,3.2,'#ffffff');
    c.fillStyle='#ffffff';c.beginPath();c.moveTo(-11.5,-2.5);c.quadraticCurveTo(0,-5,11.5,-2.5);c.lineTo(11.5,2.5);c.quadraticCurveTo(0,0,-11.5,2.5);c.closePath();c.fill();
    c.restore()}
  var m=c.getTransform();var mp=m.transformPoint(new DOMPoint(18,4));G.__mouth=[mp.x,mp.y];var hp=m.transformPoint(new DOMPoint(0,-14));G.__head=[hp.x,hp.y];
  c.restore();

}
/* 描邊包裝：outline 模式下每個填色形狀都以深色「加粗」畫一次，之後正常填色蓋上，形成統一外框（不用離屏畫布，速度快） */
function Wrap(ctx,ow){this.x=ctx;this.ow=ow;this.outline=false;this.fillStyle='#000';this.strokeStyle='#000';this.lineWidth=1;this.lineCap='round';this.globalAlpha=1}

WP.sc=function(){var m=this.x.getTransform();return Math.sqrt(m.a*m.a+m.b*m.b)};
WP.fill=function(){var x=this.x;if(this.outline){if(this.globalAlpha<1)return;x.fillStyle=COL.line;x.fill();x.strokeStyle=COL.line;x.lineJoin='round';x.lineWidth=this.ow*2/this.sc();x.stroke()}else{x.globalAlpha=this.globalAlpha;x.fillStyle=this.fillStyle;x.fill();x.globalAlpha=1}};

/* 畫整隻狗到 ctx：ox,oy 為腳底中心像素位置，s 縮放，face 1/-1；回傳嘴巴與頭頂位置（ctx 像素） */
var LIFT=20;
function drawDog(ctx,P0,t,ox,oy,s,face,outlineW){var P={};for(var q in P0)P[q]=P0[q];P.by=P0.by-LIFT;
  var w=new Wrap(ctx,outlineW);ctx.save();
  function T(){ctx.setTransform(s*face,0,0,s,ox,oy)}
  // 遠側腳：描邊→填色；近側（尾巴、身體、近腳、頭）：描邊→填色
  w.outline=true;T();legsAndBody(w,P,'far');w.outline=false;T();legsAndBody(w,P,'far');
  w.outline=true;T();tail(w,P,t);legsAndBody(w,P,'near');headDraw(w,P,t);
  w.outline=false;T();tail(w,P,t);legsAndBody(w,P,'near');headDraw(w,P,t);
  ctx.restore();
  return {mouth:G.__mouth.slice(),head:G.__head.slice()};
}
/* 步態：回傳四腳座標與身體起伏 */
function footAt(ph,s,beta,lift){ph=((ph%1)+1)%1;if(ph<beta){var u=ph/beta;return [s-2*s*u,0]}
  var u2=(ph-beta)/(1-beta),e=0.5-0.5*Math.cos(Math.PI*u2);return [-s+2*s*e,-lift*Math.sin(Math.PI*u2)]}

  else{var s=19,b=0.38,l=15,o={hn:0,hf:0.1,fn:0.45,ff:0.56};
    P.by=-5*Math.sin((ph-0.2)*2*Math.PI)-2;P.br=-0.09*Math.cos((ph-0.1)*2*Math.PI);P.ear=0.35+0.25*Math.sin(ph*2*Math.PI)}
  var bases={fn:29,ff:33,hn:-30,hf:-26};

}

  var br=Math.sin(t*2.2);
  P.bx=0;P.by=0.5*br;P.br=0;P.neck=0;P.head=0;P.ear=0.03*br;
  P.fn=[30,-3];P.ff=[34,-3];P.hn=[-30,-3];P.hf=[-26,-3];
  switch(name){
  case 'sit':P.br=-0.55;P.bx=-4;P.by=10;P.fn=[24,-3];P.ff=[28,-3];P.hn=[-16,-3];P.hf=[-12,-3];P.head=0.15;break;
  case 'shake':P.br=-0.55;P.bx=-4;P.by=10;P.fn=[46,-24+3*Math.sin(t*8)];P.ff=[28,-3];P.hn=[-16,-3];P.hf=[-12,-3];P.head=0.05;break;
  case 'lie':P.by=24+0.6*br;P.fn=[52,-3];P.ff=[56,-3];P.hn=[-10,-3];P.hf=[-6,-3];P.head=0.1;break;
  case 'sleep':P.by=25+1.2*Math.sin(t*1.3);P.fn=[52,-3];P.ff=[56,-3];P.hn=[-10,-3];P.hf=[-6,-3];P.neck=0.8;P.head=-0.2;P.ear=0.3;break;

/* ---------- 行為 ---------- */
function busy(){return dog.state==='act'||dog.state==='sleep'}
function goTo(x,y,run,then){dog.goal={x:clamp(x,16,WW-16),y:clamp(y,yMin,yMax),then:then||null};dog.state='move';dog.run=!!run;dog.sitT=0;dog.act=null;if(dog.sleeping){dog.sleeping=false}}
function doAct(name,dur,tick,end){dog.state='act';dog.act={name:name,t:0,dur:dur,tick:tick||null,end:end||null,n:0};dog.goal=null}
function endAct(){var a=dog.act;dog.act=null;dog.state='idle';dog.idleT=0;if(a&&a.end)a.end()}
function face(x){if(Math.abs(x-dog.x)>1)dog.face=x>dog.x?1:-1}

function eatAt(){
  if(st.foodBowl<=0.02){toast('飯碗是空的，先倒飼料吧');SFX.whine();dog.emote={k:'food',t:2.5};return}
  goTo(FOOD.x-EATD,FOOD.y,dog.run,function(){dog.face=1;
    doAct('eat',60,function(a,dt){a.n+=dt;if(a.n>.42){a.n=0;SFX.crunch();st.food=clamp(st.food+4.5,0,100);st.foodBowl=Math.max(0,st.foodBowl-0.085);fun(.4);spawn({x:dog.x+17,y:FOOD.y-6,vx:rnd(-6,6),vy:rnd(-14,-8),life:.5,t:0,kind:'dot',col:'#8a5628'});
      if(st.foodBowl<=0.02||st.food>=100){endAct();if(st.food>=100)toast('辛巴吃飽了');}}})});
}
function drinkAt(){
  if(st.waterBowl<=0.02){toast('水碗是空的，先加水吧');SFX.whine();dog.emote={k:'water',t:2.5};return}
  goTo(WATER.x-EATD,WATER.y,dog.run,function(){dog.face=1;
    doAct('drink',60,function(a,dt){a.n+=dt;if(a.n>.36){a.n=0;SFX.lap();st.water=clamp(st.water+4,0,100);st.waterBowl=Math.max(0,st.waterBowl-0.045);spawn({x:dog.x+17,y:WATER.y-7,vx:rnd(-8,8),vy:rnd(-16,-8),life:.5,t:0,kind:'dot',col:'#8fd3ff'});
      if(st.waterBowl<=0.02||st.water>=100){endAct();if(st.water>=100)toast('辛巴喝飽水了')}}})});
}
function sleepNow(){
  if(dog.state==='sleep'){wake();return}
  goTo(HOUSE.x+34,HOUSE.y+8,false,function(){dog.face=-1;doAct('lie',2,null,function(){dog.state='sleep';dog.sleeping=true;dog.sleepT=0;SFX.yawn()});});
}
function wake(){dog.sleeping=false;dog.state='idle';dog.idleT=0;toast('辛巴醒了');doAct('sit',1.4,null,null);SFX.yawn()}
function pet(wx,wy){
  var t=timeS;dog.petCount=(t-dog.petLast<1.4)?dog.petCount+1:1;dog.petLast=t;
  if(dog.state==='sleep'){wake();return}
  if(dog.state==='move'){dog.goal=null;dog.state='idle'}
  face(wx);heart(dog.x+dog.face*6,dog.y-30);SFX.heart();fun(2.5);bondGain(.6);dog.petT=1.2;
  if(dog.petCount>=4&&!busy()){dog.petCount=0;doAct('hop',2.2,function(a,dt){a.n+=dt;if(a.n>.3){a.n=0;heart(dog.x+rnd(-10,10),dog.y-34)}},function(){fun(5);bondGain(1)});toast('辛巴開心到跳起來')}
}
function trick(name){
  if(dog.state==='sleep')wake();
  if(dog.state==='move'){dog.goal=null;dog.state='idle'}
  if(name==='sit'){doAct('sit',4,function(a){if(a.t>.3&&!a.p){a.p=1;spark(dog.x+dog.face*10,dog.y-26)}},function(){fun(3);bondGain(1)})}
  if(name==='roll'){doAct('spin',2.4,function(a,dt){a.n+=dt;if(a.n>.3){a.n=0;dog.face=-dog.face}},function(){fun(5);bondGain(1.5)})}
  if(name==='shake'){doAct('shake',3,function(a){if(a.t>.5&&!a.p){a.p=1;heart(dog.x+dog.face*14,dog.y-28)}},function(){fun(4);bondGain(1.2)})}
  if(name==='bow'){doAct('bow',2.4,null,function(){fun(4);bondGain(1.2)})}
  if(name==='bark'){doAct('bark',1.4,function(a,dt){a.n+=dt;if(a.n>.45){a.n=0;SFX.bark();spawn({x:dog.x+dog.face*20,y:dog.y-28,vx:dog.face*14,vy:-3,life:.7,t:0,kind:'wave'})}},function(){fun(3);bondGain(.8)})}
}
function pourFood(){st.foodBowl=1;SFX.pour();for(var i=0;i<10;i++)spawn({x:FOOD.x+rnd(-3,3),y:FOOD.y-26-i*2,vx:0,vy:rnd(40,70),life:.4,t:0,kind:'dot',col:'#8a5628'});toast('飼料倒好了');if(st.food<70&&!busy())setTimeout(function(){if(!busy())eatAt()},500)}
function pourWater(){st.waterBowl=1;SFX.splash();for(var i=0;i<10;i++)spawn({x:WATER.x+rnd(-3,3),y:WATER.y-26-i*2,vx:0,vy:rnd(40,70),life:.4,t:0,kind:'dot',col:'#8fd3ff'});toast('水加滿了');if(st.water<70&&!busy())setTimeout(function(){if(!busy())drinkAt()},500)}
function throwBall(tx,ty){
  var sx=clamp(dog.x+(dog.face*30),20,WW-20);ball.x=sx;ball.y=clamp(dog.y+4,yMin,yMax);ball.z=14;
  tx=clamp(tx,20,WW-20);ty=clamp(ty,yMin,yMax);var T=.85,gr=120;
  ball.vx=(tx-ball.x)/T;ball.vy=(ty-ball.y)/T;ball.vz=(0.5*gr*T*T-ball.z)/T;ball.state='air';SFX.pop();
  if(dog.state==='sleep')wake();if(dog.state==='act'&&dog.act&&dog.act.name!=='bark'){}
}
function giveTreat(){
  if(dog.state==='sleep')wake();
  var tx=clamp(dog.x+dog.face*22,20,WW-20),ty=clamp(dog.y+2,yMin,yMax);
  treat={x:tx,y:ty,z:46,vz:0,landed:false};SFX.pop();
}

function ballInterest(){return ball.state==='air'||ball.state==='ground'}
function updateDog(dt){
  // 動作中
  if(dog.petT>0)dog.petT-=dt;
  if(dog.state==='act'){var a=dog.act;a.t+=dt;if(a.tick)a.tick(a,dt);if(dog.state==='act'&&a.t>=a.dur)endAct();return}
  if(dog.state==='sleep'){dog.sleepT+=dt;st.energy=clamp(st.energy+dt*2.2,0,100);if(Math.random()<dt*.5&&dog.headPt)zzz(dog.headPt[0]-dog.face*2,dog.headPt[1]-2);
    if(st.energy>=100&&nightAmt(hourNow())<.3){wake()}return}
  if(dog.state==='move'&&dog.goal){
    var gx=dog.goal.x,gy=dog.goal.y;
    if(dog.chase){gx=ball.x;gy=ball.y;if(ball.state==='carried'){}}
    var dx=gx-dog.x,dy=gy-dog.y,d=Math.hypot(dx,dy);
    var sp=dog.run?64:24;if(d<1.5||(d<sp*dt)){dog.x=gx;dog.y=gy;var th=dog.goal.then;dog.goal=null;dog.state='idle';dog.idleT=0;dog.chase=false;if(th)th();return}
    if(Math.abs(dx)>2)dog.face=dx>0?1:-1;
    dog.x+=dx/d*sp*dt;dog.y+=dy/d*sp*dt;dog.stride+=sp*dt;
    if(dog.run){st.energy=clamp(st.energy-dt*.35,0,100);if(Math.random()<dt*9)dust(dog.x-dog.face*12,dog.y)}
    else st.energy=clamp(st.energy-dt*.06,0,100);
    return}
  // idle
  dog.idleT+=dt;st.food=clamp(st.food-dt*0.022,0,100);
  if(dog.idleT>.6&&ballInterest()&&ball.state!=='carried'&&st.energy>8){dog.chase=true;chaseBall();return}
  if(dog.idleT>1.5){
    var h=hourNow(),night=nightAmt(h);
    if(st.food<32&&st.foodBowl>.05&&Math.random()<.5){eatAt();return}
    if(st.water<32&&st.waterBowl>.05&&Math.random()<.5){drinkAt();return}
    if(st.energy<18||(night>.8&&st.energy<70&&Math.random()<.3)){sleepNow();return}
  }
  // 需求提示
  if(!dog.emote&&Math.random()<dt*.15){if(st.food<28&&st.foodBowl<.05)dog.emote={k:'food',t:3};else if(st.water<28&&st.waterBowl<.05)dog.emote={k:'water',t:3};else if(st.energy<20)dog.emote={k:'sleep',t:3};else if(st.fun<25)dog.emote={k:'ball',t:3}}
  if(dog.idleT>rnd(6,12)){
    var r=Math.random();
    if(dog.pose==='sit'||dog.sitT>0){ }
    if(r<.38){dog.pose='stand';goTo(dog.x+rnd(-90,90),dog.y+rnd(-26,26),false)}
    else if(r<.6){dog.sitT=1;doAct('sit',rnd(4,9),null,null)}
    else if(r<.8){doAct('eat',rnd(1.4,2.4),function(a,dt){a.n+=dt;if(a.n>.6){a.n=0}},null)}
    else if(r<.9&&st.fun<80){doAct('bark',1,function(a,dt){a.n+=dt;if(a.n>.45){a.n=0;SFX.woof()}},null)}
    else{doAct('lie',rnd(5,10),null,null)}
    dog.idleT=0}
}
function chaseBall(){
  goTo(ball.x,ball.y,true,function(){
    if(ball.state==='ground'||ball.state==='air'&&ball.z<10){ball.state='carried';dog.carry=true;SFX.pop();
      var ox=clamp(camX+W/2,40,WW-40),oy=yMax-6;goTo(ox-26,oy,false,function(){dog.face=1;
        doAct('bark',.9,function(a){if(!a.p){a.p=1;ball.state='ground';ball.x=dog.x+dog.face*26;ball.y=dog.y+3;ball.z=0;ball.vx=ball.vy=ball.vz=0;dog.carry=false;SFX.woof()}},function(){fun(8);st.energy=clamp(st.energy-4,0,100);bondGain(1.5);heart(dog.x,dog.y-30)})})}
    else if(ball.state!=='none'){chaseBall()}
  });dog.chase=true;
}
function updateBall(dt){
  if(ball.state==='air'||(ball.state==='ground'&&(ball.vx||ball.vy||ball.z>0))){
    ball.x+=ball.vx*dt;ball.y+=ball.vy*dt;ball.vz-=120*dt;ball.z+=ball.vz*dt;
    if(ball.z<=0){ball.z=0;if(Math.abs(ball.vz)>14){ball.vz=-ball.vz*.45;ball.vx*=.7;ball.vy*=.7;SFX.bounce(clamp(Math.abs(ball.vz)/60,.3,1));ball.state='ground'}else{ball.vz=0;ball.vx*=Math.pow(.02,dt);ball.vy*=Math.pow(.02,dt);if(Math.abs(ball.vx)<2&&Math.abs(ball.vy)<2){ball.vx=ball.vy=0}ball.state='ground'}}
    ball.x=clamp(ball.x,6,WW-6);ball.y=clamp(ball.y,yMin-4,yMax+6)
  }
  if(ball.state==='carried'&&dog.mouth){ball.x=dog.mouth[0];ball.y=dog.y+1;ball.z=dog.y-dog.mouth[1]-2.5}
}
function updateTreat(dt){if(!treat)return;if(!treat.landed){treat.vz-=100*dt;treat.z+=treat.vz*dt;if(treat.z<=0){treat.z=0;treat.landed=true;SFX.bounce(.4);
  if(!busy()||dog.state==='act'){ }
  setTimeout(function(){if(!treat||dog.state==='sleep')return;goTo(treat.x-EATD,treat.y,false,function(){if(!treat)return;dog.face=1;var tt=treat;doAct('eat',1.5,function(a,dt2){a.n+=dt2;if(a.n>.4){a.n=0;SFX.crunch()}},function(){treat=null;st.food=clamp(st.food+10,0,100);fun(7);bondGain(1);heart(dog.x+8,dog.y-30);spark(dog.x+10,dog.y-14,'#e8c27a')})})},350)}}}

/* ---------- 骨架姿勢 ---------- */
var RS=0.3,EATD=24,D2R=Math.PI/180;
var DP=RIG.clone(RIG.BASE);DP.tph=0;
var TAIL={th:30,amp:16,hz:2.4,curl:-2,ph:0};
function tailTarget(){
  if(dog.state==='sleep')return [-10,2,.25,0];
  if(dog.state==='act'){var n=dog.act.name;
    if(n==='lie')return [-6,8,1.2,0];
    if(n==='sit'||n==='shake')return [-14,22,3,0];
    if(n==='spin'||n==='hop')return [45,36,7.5,-3];
    if(n==='bow')return [62,34,7,-4];
    if(n==='bark')return [48,22,6,-3];
    if(n==='eat'||n==='drink')return [30,20,4,-3]}
  if(dog.petT>0)return [44,34,7.5,-3];
  if(st.fun<22)return [-50,4,1,2];
  if(dog.state==='move')return dog.run?[10,8,5,1]:[26,14,dog.carry?3.5:2.6,-2];
  if(dog.carry)return [40,26,6,-3];
  return [30,16,2.2,-2];
}
function updTail(dt){var t=tailTarget(),k=Math.min(1,dt*6);TAIL.th+=(t[0]-TAIL.th)*k;TAIL.amp+=(t[1]-TAIL.amp)*k;TAIL.hz+=(t[2]-TAIL.hz)*k;TAIL.curl+=(t[3]-TAIL.curl)*k;TAIL.ph+=TAIL.hz*Math.PI*2*dt}
var blinkT=2,panting=0;
function poseName(){
  if(dog.state==='sleep')return 'sleep';
  if(dog.state==='move')return dog.run?'run':'walk';
  if(dog.state==='act')return dog.act.name;
  return 'stand';
}
function updPose(dt){
  var nm=poseName(),T=RIG.clone(DP),moving=(nm==='walk'||nm==='run');
  if(moving){RIG.pose('stand',timeS,T);RIG.gait(T,nm,dog.stride/(nm==='run'?100:29)/RS)}
  else{var pn=nm;if(nm==='spin')pn='hop';if(nm==='stand'&&dog.petT>0)pn='stand';RIG.pose(pn,timeS,T)}
  // 表情
  blinkT-=dt;var eyes=1;if(blinkT<0){eyes=0;if(blinkT<-.12)blinkT=rnd(2,5)}
  var pantT=(nm==='run'||st.energy<45||st.fun>75||dog.carry)?1:0;panting+=(pantT-panting)*Math.min(1,dt*2);
  var mouth=panting*0.5*(dog.carry?0.2:1),tongue=panting*(0.6+0.15*Math.sin(timeS*14))*(dog.carry?0:1);
  if(nm==='sleep'){eyes=0;mouth=0;tongue=0}
  if(nm==='eat'){mouth=0.25+0.25*Math.sin(timeS*12);tongue=0}
  if(nm==='drink'){mouth=0.3;tongue=0.35+0.4*Math.abs(Math.sin(timeS*11))}
  if(nm==='bark'){var bk=Math.abs(Math.sin(timeS*11));mouth=bk;tongue=0.2}
  if(dog.petT>0||nm==='hop'||nm==='spin'||nm==='bow'){eyes=0.5}
  if(nm==='lie'&&eyes===1&&Math.sin(timeS*.7)>.6)eyes=0.5;
  T.eyes=eyes;T.mouth=mouth;T.tongue=tongue;
  if(nm==='run')T.ear+=0.15*Math.sin(timeS*12);
  if(dog.petT>0){T.head=-0.12+0.05*Math.sin(timeS*6);T.ear=0.25}
  // 平滑
  var k=1-Math.exp(-dt*(moving?26:11));
  for(var q in T){if(q==='tph'||q==='hat')continue;var v=T[q];
    if(Array.isArray(v)){DP[q][0]+=(v[0]-DP[q][0])*k;DP[q][1]+=(v[1]-DP[q][1])*k}
    else if(typeof v==='number'){DP[q]+=(v-DP[q])*((q==='eyes')?1:k)}}
  DP.tail=TAIL.th*D2R;DP.wag=TAIL.amp*D2R*1.1;DP.tph=TAIL.ph;DP.tailCurl=TAIL.curl*0.05;
  DP.hat=st.hat?1:0;DP.hatSw=Math.sin(timeS*3)*0.5+(moving?Math.sin(timeS*10):0);
}

/* ---------- 繪製 ---------- */
var camX=0;
function drawDog(c){
  var X=dog.x-camX,Y=dog.y;
  // 影
  c.fillStyle='rgba(20,40,20,.25)';var sw=(dog.state==='move'&&dog.run)?17:15;c.beginPath();c.ellipse(X+dog.face*1,Y,sw,2.6,0,0,Math.PI*2);c.fill();
  c.save();c.setTransform(1,0,0,1,0,0);
  var night=nightAmt(hourNow());
  var r=RIG.drawDog(c,DP,timeS,X*K,Y*K,RS*K,dog.face,Math.max(1.2,RS*K*0.95));
  c.restore();
  dog.mouth=[r.mouth[0]/K+camX,r.mouth[1]/K];dog.headPt=[r.head[0]/K+camX,r.head[1]/K];
}
function drawBall(c){
  if(ball.state==='none')return;var X=Math.round(ball.x-camX),Y=Math.round(ball.y);

}
function drawTreat(c){if(!treat)return;var X=Math.round(treat.x-camX),Y=Math.round(treat.y)-Math.round(treat.z);c.fillStyle='rgba(20,40,20,.3)';c.fillRect(X-4,Math.round(treat.y),8,2);
  px(c,X-5,Y-5,10,3,'#f4e2b8');px(c,X-6,Y-6,3,3,'#f4e2b8');px(c,X-6,Y-3,3,3,'#f4e2b8');px(c,X+3,Y-6,3,3,'#f4e2b8');px(c,X+3,Y-3,3,3,'#f4e2b8');px(c,X-5,Y-5,10,1,'#fff7e0')}
function emoteIcon(c,k,x,y){

  if(k==='food'){px(c,x-4,y-9,8,2,'#b8884e');px(c,x-5,y-10,2,2,'#b8884e');px(c,x-5,y-8,2,2,'#b8884e');px(c,x+3,y-10,2,2,'#b8884e');px(c,x+3,y-8,2,2,'#b8884e')}

function drawParts(c){
  parts.forEach(function(p){var X=Math.round(p.x-camX),Y=Math.round(p.y),a=1-p.t/p.life;
    if(p.kind==='heart'){px(c,X-2,Y-1,2,2,'#ff4d6d');px(c,X+1,Y-1,2,2,'#ff4d6d');px(c,X-2,Y,5,2,'#ff4d6d');px(c,X-1,Y+2,3,1,'#ff4d6d');px(c,X,Y+3,1,1,'#ff4d6d')}
    else if(p.kind==='dot'){c.globalAlpha=Math.max(0,a);px(c,X,Y,2,2,p.col);c.globalAlpha=1}
    else if(p.kind==='dust'){c.globalAlpha=Math.max(0,a*.7);px(c,X,Y,3,2,'#e9dcc0');c.globalAlpha=1}
    else if(p.kind==='z'){c.globalAlpha=Math.max(0,Math.min(1,a*1.4));var s=1+Math.floor(p.t*1.6);px(c,X,Y,3+s,1,'#ffffff');px(c,X+1+s,Y+1,1,1,'#ffffff');px(c,X+s-1,Y+2,1,1,'#ffffff');px(c,X,Y+3,3+s,1,'#ffffff');c.globalAlpha=1}
    else if(p.kind==='wave'){c.globalAlpha=Math.max(0,a);for(var i=0;i<3;i++)px(c,X+dog.face*i*3,Y-2+i,1,5-i*2,'#ffffff');c.globalAlpha=1}
  })}
function drawBfs(c){bfs.forEach(function(b){var X=Math.round(b.x-camX),Y=Math.round(b.y+Math.sin(timeS*3+b.ph)*3),f=Math.floor(timeS*10+b.ph)%2;
  px(c,X,Y,1,2,'#5a4632');if(f){px(c,X-3,Y-2,3,3,b.col);px(c,X+1,Y-2,3,3,b.col)}else{px(c,X-2,Y-1,2,3,b.col);px(c,X+1,Y-1,2,3,b.col)}})}

function drawSky(h,night){
  var s=skyAt(h);var bands=Math.ceil(yh/3);
  for(var i=0;i<bands;i++){g.fillStyle=mix2(s[0],s[1],i/bands);g.fillRect(0,i*3,W,3)}
  // 星
  if(night>0.05){g.globalAlpha=night;var R=seeded(3);for(var k=0;k<46;k++){var sx=Math.floor(R()*W),sy=Math.floor(R()*yh*.7),tw=(Math.floor(timeS*1.5+k)%5!==0);if(tw)g.fillStyle='#fff',g.fillRect(sx,sy,1,1)}g.globalAlpha=1}
  // 太陽/月亮
  var p=(h-6)/12;
  if(h>=5.5&&h<=19.5){var sx2=lerp(W*.08,W*.92,clamp(p,0,1)),sy2=yh*.78-Math.sin(clamp(p,0,1)*Math.PI)*yh*.62;circ(g,sx2,sy2,9,'#fff3b0');circ(g,sx2,sy2,6,'#ffe27a')}
  else{var q=((h+6)%24)/12;if(q>1)q=1;var mx=lerp(W*.1,W*.9,clamp(((h<5.5?h+24:h)-19.5)/10.5,0,1)),my=yh*.7-Math.sin(clamp(((h<5.5?h+24:h)-19.5)/10.5,0,1)*Math.PI)*yh*.5;circ(g,mx,my,7,'#f6f1d8');circ(g,mx+3,my-1,6,mix2(s[0],s[1],.2))}
  // 雲
  clouds.forEach(function(c){var X=((c.x-timeS*c.v-camX*.12)%(W+80)+W+80)%(W+80)-40;cloud(X,c.y,c.s)});
}
function mix2(a,b,t){if(a.charAt(0)==='r'){var A=a.match(/\d+/g).map(Number),B=b.match(/\d+/g).map(Number);return 'rgb('+Math.round(lerp(A[0],B[0],t))+','+Math.round(lerp(A[1],B[1],t))+','+Math.round(lerp(A[2],B[2],t))+')'}return mix(a,b,t)}
function cloud(x,y,s){g.fillStyle='rgba(255,255,255,.92)';x=Math.round(x);y=Math.round(y);g.fillRect(x,y,14*s,3*s);g.fillRect(x+3*s,y-2*s,8*s,3*s);g.fillRect(x+7*s,y-3*s,5*s,2*s);g.fillStyle='rgba(200,220,240,.7)';g.fillRect(x,y+3*s-1,14*s,1)}

function render(){
  var h=hourNow(),night=nightAmt(h),dusk=duskAmt(h);
  g.setTransform(K,0,0,K,0,0);g.imageSmoothingEnabled=false;
  drawSky(h,night);
  g.drawImage(hillC,-Math.round(camX*.35),0);
  g.drawImage(worldC,-Math.round(camX),0);
  // y 排序物件
  var list=[];
  list.push({y:HOUSE.y,f:function(){drawHouse(g,camX,night>.4)}});
  list.push({y:FOOD.y,f:function(){drawBowl(g,FOOD,camX,'food')}});
  list.push({y:WATER.y,f:function(){drawBowl(g,WATER,camX,'water')}});
  list.push({y:TREE.y,f:function(){drawTree(g,camX)}});
  list.push({y:LAMP.y,f:function(){drawLamp(g,camX,night>.4)}});
  if(xmasSeason)list.push({y:XTREE.y,f:function(){drawXTree(g,camX,timeS)}});
  list.push({y:dog.y,f:function(){drawDog(g)}});
  if(ball.state!=='none')list.push({y:ball.y+(ball.state==='carried'?1:0),f:function(){drawBall(g)}});
  if(treat)list.push({y:treat.y,f:function(){drawTreat(g)}});
  list.sort(function(a,b){return a.y-b.y});
  list.forEach(function(o){o.f()});
  // 聖誕燈串（圍籬）
  if(xmasSeason){var cols=['#ff4d5a','#ffd166','#4cc9f0','#7ee081'];for(var x=0;x<WW;x+=3){var X=Math.round(x-camX);if(X<-4||X>W+4)continue;var Y=yh-17+Math.round(Math.sin(x*.12)*3);px(g,X,Y,1,1,'#2e3340');if(x%12===0){var on=((Math.floor(timeS*1.8)+x/12)%2===0);px(g,X,Y+1,2,2,on?cols[(x/12)%4]:'#5a5f6a')}}}
  drawBfs(g);
  drawParts(g);
  // 氣泡
  if(dog.emote&&dog.headPt){var ex=Math.round(dog.headPt[0]-camX),ey=Math.round(dog.headPt[1])-6;if(Math.floor(timeS*2)%4!==3)emoteIcon(g,dog.emote.k,ex,ey)}
  // 夜色與暮色
  if(night>0.01){g.fillStyle='rgba(8,14,46,'+(0.5*night)+')';g.fillRect(0,0,W,H)}
  if(dusk>0.01){g.fillStyle='rgba(255,140,60,'+(0.16*dusk)+')';g.fillRect(0,0,W,H)}
  // 燈光
  if(night>.3){g.globalCompositeOperation='lighter';
    glow(LAMP.x-camX,LAMP.y-40,34,'255,214,120',.35*night);
    glow(HOUSE.x-camX,HOUSE.y-8,24,'255,200,110',.28*night);
    if(xmasSeason)glow(XTREE.x-camX,XTREE.y-30,36,'255,180,120',.2*night);
    g.globalCompositeOperation='source-over'}
  // 雪
  if(xmasSeason){g.fillStyle='#ffffff';flakes.forEach(function(f){g.globalAlpha=f.a;g.fillRect(Math.round(f.x),Math.round(f.y),f.s,f.s)});g.globalAlpha=1}
}
function glow(x,y,r,rgb,a){var gr=g.createRadialGradient(x,y,0,x,y,r);gr.addColorStop(0,'rgba('+rgb+','+a+')');gr.addColorStop(1,'rgba('+rgb+',0)');g.fillStyle=gr;g.fillRect(x-r,y-r,r*2,r*2)}

/* ---------- 主迴圈 ---------- */
function update(dt){
  timeS+=dt;var h=hourNow();
  st.water=clamp(st.water-dt*0.03,0,100);st.fun=clamp(st.fun-dt*0.02,0,100);
  if(dog.state!=='sleep')st.energy=clamp(st.energy-dt*0.012,0,100);
  updateDog(dt);updTail(dt);updPose(dt);updateBall(dt);updateTreat(dt);
  if(dog.emote){dog.emote.t-=dt;if(dog.emote.t<=0)dog.emote=null}
  dog.x=clamp(dog.x,12,WW-12);dog.y=clamp(dog.y,yMin,yMax);
  // 粒子
  for(var i=parts.length-1;i>=0;i--){var p=parts[i];p.t+=dt;if(p.t>=p.life){parts.splice(i,1);continue}p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.kind==='heart')p.vy+=6*dt;if(p.kind==='dot')p.vy+=70*dt}
  // 蝴蝶
  bfs.forEach(function(b){b.a+=rnd(-1,1)*dt*3;b.x+=Math.cos(b.a)*14*dt;b.y+=Math.sin(b.a)*8*dt;if(b.x<10||b.x>WW-10)b.a=Math.PI-b.a;b.y=clamp(b.y,yh-6,yMax-14)});
  // 雪
  if(xmasSeason)flakes.forEach(function(f){f.y+=f.v*dt;f.x+=Math.sin(timeS+f.ph)*4*dt;if(f.y>H){f.y=-2;f.x=Math.random()*W}});
  // 鏡頭
  var tx=clamp(dog.x-W/2,0,Math.max(0,WW-W));camX+=(tx-camX)*Math.min(1,dt*3.2);
  if(Math.abs(camX-tx)<.2)camX=tx;
  // 提示更新
  hudTick+=dt;if(hudTick>.25){hudTick=0;updHud()}
  if(Math.floor(timeS)!==update.lastSec){update.lastSec=Math.floor(timeS)}
}
var hudTick=0,last=performance.now();
function frame(t){var dt=Math.min(.05,(t-last)/1000);last=t;update(dt);render();requestAnimationFrame(frame)}

/* ---------- 輸入 ---------- */
function toWorld(e){var r=cv.getBoundingClientRect();return {x:(e.clientX-r.left)/r.width*W+camX,y:(e.clientY-r.top)/r.height*H}}
var down=null,lastTapT=0,lastTapX=0;
cv.addEventListener('pointerdown',function(e){
  e.preventDefault();ac();var p=toWorld(e);down={x:p.x,y:p.y,t:performance.now(),moved:false};
  // 球
  if(ball.state==='ground'&&Math.abs(p.x-ball.x)<9&&Math.abs(p.y-(ball.y-3))<9){throwBall(clamp(camX+rnd(W*.1,W*.9),20,WW-20),rnd(yMin,yMax));down=null;return}
  // 狗
  if(Math.abs(p.x-dog.x)<24&&p.y>dog.y-34&&p.y<dog.y+6){pet(p.x,p.y);down=null;return}
  // 屋
  if(Math.abs(p.x-HOUSE.x)<28&&p.y>HOUSE.y-34&&p.y<HOUSE.y+4){sleepNow();down=null;return}
  if(Math.abs(p.x-FOOD.x)<12&&Math.abs(p.y-FOOD.y)<12){eatAt();down=null;return}
  if(Math.abs(p.x-WATER.x)<12&&Math.abs(p.y-WATER.y)<12){drinkAt();down=null;return}
  moveTo(p,performance.now()-lastTapT<350&&Math.abs(p.x-lastTapX)<20);lastTapT=performance.now();lastTapX=p.x;
});
cv.addEventListener('pointermove',function(e){if(!down)return;var p=toWorld(e);if(Math.hypot(p.x-down.x,p.y-down.y)>3)down.moved=true;if(down.moved&&dog.state==='move'&&!dog.chase){dog.goal.x=clamp(p.x,16,WW-16);dog.goal.y=clamp(p.y,yMin,yMax);dog.goal.then=null;dog.run=Math.hypot(p.x-dog.x,p.y-dog.y)>90}});
window.addEventListener('pointerup',function(){down=null});
function moveTo(p,dbl){
  if(dog.state==='sleep'){wake()}
  if(dog.state==='act'&&dog.act&&dog.act.name!=='sit'&&dog.act.t<dog.act.dur-.3){/* 讓牠做完 */}
  var d=Math.hypot(p.x-dog.x,p.y-dog.y);
  dog.chase=false;goTo(p.x,p.y,dbl||d>100,null);
  spawn({x:p.x,y:p.y,vx:0,vy:0,life:.5,t:0,kind:'dot',col:'#ffffff'});
}

/* ---------- HUD ---------- */
var $=function(i){return document.getElementById(i)};
function updHud(){
  ['food','water','energy','fun'].forEach(function(k){var v=Math.round(st[k]);var b=$('b-'+k);b.style.width=v+'%';b.parentNode.classList.toggle('low',v<28);b.parentNode.setAttribute('aria-valuenow',v)});
  $('lvl').textContent='默契 Lv '+st.lvl;var need=40+st.lvl*30;$('bondb').style.width=Math.round(st.bond/need*100)+'%';
  $('snd').textContent=st.sound?'音效 開':'音效 關';
  $('hatb').textContent=st.hat?'聖誕帽 戴':'聖誕帽 脫';
  $('sleepb').querySelector('span').textContent=(dog.state==='sleep')?'叫醒':'睡覺';
}
function bind(id,fn){$(id).addEventListener('click',function(e){e.preventDefault();ac();fn();$('tricks').classList.remove('on')})}
bind('foodb',pourFood);bind('waterb',pourWater);bind('ballb',function(){throwBall(clamp(dog.x+dog.face*rnd(60,150),20,WW-20),rnd(yMin,yMax))});
bind('treatb',giveTreat);bind('sleepb',sleepNow);
$('trickb').addEventListener('click',function(e){e.preventDefault();ac();$('tricks').classList.toggle('on')});
['sit','shake','roll','bow','bark'].forEach(function(k){$('t-'+k).addEventListener('click',function(e){e.preventDefault();ac();trick(k);$('tricks').classList.remove('on')})});
$('snd').addEventListener('click',function(){st.sound=!st.sound;if(st.sound)ac();updHud();save()});
$('hatb').addEventListener('click',function(){st.hat=!st.hat;updHud();SFX.pop();save()});
if(!xmasSeason)$('hatb').style.display='none';
window.addEventListener('resize',function(){layout();placeObjs();dog.y=clamp(dog.y,yMin,yMax)});

/* ---------- 啟動 ---------- */
layout();placeObjs();
dog.x=Math.round(WW*.5);dog.y=yMax-6;camX=clamp(dog.x-W/2,0,Math.max(0,WW-W));
for(var i=0;i<5;i++)clouds.push({x:Math.random()*400,y:rnd(6,yh*.5),s:1+Math.floor(Math.random()*2),v:rnd(1.5,4)});
for(var j=0;j<4;j++)bfs.push({x:rnd(80,WW-80),y:rnd(yh+10,yMax-20),a:rnd(0,6.28),ph:rnd(0,6),col:['#ff8fb1','#ffd166','#a2d2ff','#ffffff'][j%4]});
for(var q=0;q<40;q++)flakes.push({x:Math.random()*W,y:Math.random()*H,v:rnd(8,20),s:Math.random()<.3?2:1,a:rnd(.55,.95),ph:rnd(0,6)});
updHud();
if(!st.seen){st.seen=1;setTimeout(function(){toast('點一下地面，辛巴就會跑過去')},900)}
// 測試用
window.__simba={dog:dog,st:st,ball:ball,pet:pet,trick:trick,eatAt:eatAt,drinkAt:drinkAt,sleepNow:sleepNow,throwBall:throwBall,giveTreat:giveTreat,pourFood:pourFood,pourWater:pourWater,update:update,render:render,goTo:goTo,get cam(){return camX},DP:DP,wake:wake,setHour:function(h){Q.set('hour',h)}};
if(!Q.get('manual'))requestAnimationFrame(frame);
})();
</script>
</body></html>
