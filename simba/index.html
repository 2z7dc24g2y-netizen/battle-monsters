<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>辛巴的後院</title>
<style>
:root{--ink:#3a2412;--cream:#fff6e0;--amber:#e9a23b;--card:rgba(255,246,224,.93)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#1c2a52;font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;color:var(--ink);touch-action:none;user-select:none}
#c{position:fixed;inset:0;width:100vw;height:100vh;image-rendering:pixelated;image-rendering:crisp-edges;display:block}
.hud{position:fixed;left:10px;top:10px;display:flex;flex-direction:column;gap:6px;pointer-events:none}
.bars{background:var(--card);border-radius:14px;padding:8px 10px;display:grid;grid-template-columns:auto 84px;gap:4px 8px;align-items:center;font-size:12px;box-shadow:0 2px 0 rgba(58,36,18,.25)}
.bar{height:8px;border-radius:5px;background:rgba(58,36,18,.15);overflow:hidden}
.bar i{display:block;height:100%;border-radius:5px;transition:width .3s}
.bar.low i{animation:blink .8s infinite}
@keyframes blink{50%{opacity:.35}}
#b-food{background:#c9823a}#b-water{background:#3a9bff}#b-energy{background:#8a6cf0}#b-fun{background:#ff6f91}
.lv{background:var(--card);border-radius:14px;padding:6px 10px;font-size:12px;box-shadow:0 2px 0 rgba(58,36,18,.25)}
.lv .bar{margin-top:4px;width:110px}#bondb{background:#ff4d6d}
.top-r{position:fixed;right:10px;top:10px;display:flex;gap:6px}
.top-r button,.top-r a{font:inherit;font-size:12px;border:0;background:rgba(30,20,10,.55);color:#fff;border-radius:10px;padding:6px 10px;cursor:pointer;text-decoration:none}
.dock{position:fixed;left:0;right:0;bottom:calc(10px + env(safe-area-inset-bottom));display:flex;justify-content:center;gap:8px;padding:0 8px;flex-wrap:wrap}
.dock button{font:inherit;font-weight:700;font-size:14px;border:0;border-bottom:4px solid #b9741f;background:var(--amber);color:var(--ink);border-radius:14px;padding:10px 14px;min-width:62px;cursor:pointer;touch-action:manipulation}
.dock button:active{transform:translateY(2px);border-bottom-width:2px}
#tricks{position:fixed;left:50%;bottom:calc(72px + env(safe-area-inset-bottom));transform:translateX(-50%) scale(.9);opacity:0;pointer-events:none;display:flex;gap:8px;background:var(--card);padding:8px;border-radius:16px;transition:.15s}
#tricks.on{opacity:1;pointer-events:auto;transform:translateX(-50%) scale(1)}
#tricks button{font:inherit;font-weight:700;border:0;background:#fff;border-radius:10px;padding:8px 12px;border-bottom:3px solid #d9c9a8;color:var(--ink);cursor:pointer}
#toast{position:fixed;left:50%;top:18%;transform:translate(-50%,-10px);background:rgba(30,20,10,.78);color:#fff;padding:8px 16px;border-radius:20px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;white-space:nowrap}
#toast.on{opacity:1;transform:translate(-50%,0)}
button:focus-visible,a:focus-visible{outline:3px solid #fff;outline-offset:2px}
@media(max-width:560px){.dock{flex-wrap:nowrap;gap:5px}.dock button{flex:1;max-width:76px;min-width:0;padding:9px 2px;font-size:13px}.bars{grid-template-columns:auto 60px}.top-r{flex-direction:column;align-items:flex-end}}
@media(prefers-reduced-motion:reduce){.bar i,#toast,#tricks{transition:none}.bar.low i{animation:none}}
</style></head><body>
<canvas id="c" aria-label="辛巴的後院"></canvas>
<div class="hud">
 <div class="bars" role="group" aria-label="辛巴的狀態">
  <span>飽食</span><div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100"><i id="b-food"></i></div>
  <span>口渴</span><div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100"><i id="b-water"></i></div>
  <span>體力</span><div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100"><i id="b-energy"></i></div>
  <span>心情</span><div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100"><i id="b-fun"></i></div>
 </div>
 <div class="lv"><span id="lvl">默契 Lv 1</span><div class="bar"><i id="bondb" style="width:0"></i></div></div>
</div>
<div class="top-r"><button id="hatb" type="button">聖誕帽 戴</button><button id="snd" type="button">音效 開</button><a href="https://claude.ai/artifact/Ed9P9CtSvjzm6tNa5JuPtm" target="_top">辛巴王的遊戲大廳</a></div>
<div id="toast" role="status"></div>
<div id="tricks"><button id="t-sit" type="button">坐下</button><button id="t-shake" type="button">握手</button><button id="t-roll" type="button">轉圈</button><button id="t-bow" type="button">鞠躬</button><button id="t-bark" type="button">汪汪</button></div>
<div class="dock">
 <button id="foodb" type="button">倒飼料</button><button id="waterb" type="button">加水</button><button id="ballb" type="button">丟球</button><button id="treatb" type="button">給點心</button><button id="trickb" type="button">指令</button><button id="sleepb" type="button"><span>睡覺</span></button>
</div>

<script>(function(){
"use strict";

var cv=document.getElementById('c'),g=cv.getContext('2d');
var Q=new URLSearchParams(location.search);
var S=1,DPR=1,K=1,W=0,H=0,WW=520,yh=0,yMin=0,yMax=0;
function clamp(v,a,b){return v<a?a:v>b?b:v}
function lerp(a,b,t){return a+(b-a)*t}
function rnd(a,b){return a+Math.random()*(b-a)}
function hex(c){return [parseInt(c.slice(1,3),16),parseInt(c.slice(3,5),16),parseInt(c.slice(5,7),16)]}
function mix(c1,c2,t){var a=hex(c1),b=hex(c2);return 'rgb('+Math.round(lerp(a[0],b[0],t))+','+Math.round(lerp(a[1],b[1],t))+','+Math.round(lerp(a[2],b[2],t))+')'}

/* ---------- 存檔 ---------- */
var KEY='simba-yard-v1';
var st={food:78,water:78,energy:90,fun:70,bond:0,lvl:1,sound:true,hat:null,t:Date.now(),foodBowl:0.0,waterBowl:0.0,days:0,seen:0};
try{var sv=JSON.parse(localStorage.getItem(KEY)||'null');if(sv){for(var k in sv)st[k]=sv[k];
  var away=clamp((Date.now()-(sv.t||Date.now()))/1000,0,6*3600);
  st.food=Math.max(30,st.food-away*0.008);st.water=Math.max(30,st.water-away*0.011);st.fun=Math.max(30,st.fun-away*0.006);st.energy=Math.min(100,st.energy+away*0.01);
}}catch(e){}
var now=new Date(),mon=now.getMonth()+1,dayN=now.getDate();
var xmasSeason=(mon===12)||(mon===11&&dayN>=15)||(mon===1&&dayN<=5);
if(Q.get('xmas')==='1')xmasSeason=true;if(Q.get('xmas')==='0')xmasSeason=false;
if(st.hat===null)st.hat=xmasSeason;
function save(){st.t=Date.now();try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}}
setInterval(save,5000);window.addEventListener('pagehide',save);

/* ---------- 精靈 ---------- */
function mk(rows,w,h){var c=document.createElement('canvas');c.width=w;c.height=h;var x=c.getContext('2d');
  for(var y=0;y<rows.length;y++){var r=rows[y],i=0;while(i<r.length){var ch=r[i];if(ch==='.'||!PAL[ch]){i++;continue}var j=i;while(j+1<r.length&&r[j+1]===ch)j++;x.fillStyle=PAL[ch];x.fillRect(i,y,j-i+1,1);i=j+1}}
  return c}

/* ---------- 時間 ---------- */
function hourNow(){if(Q.get('hour')!==null)return parseFloat(Q.get('hour'));var d=new Date();return d.getHours()+d.getMinutes()/60}
var SKY=[[0,'#0b1230','#1c2a52'],[5,'#2a2f5e','#e58a6b'],[7,'#5aa6e8','#bfe4f7'],[12,'#4aa0ef','#b8e6ff'],[17,'#5a8fd8','#f2c28b'],[19,'#3a3466','#e0714f'],[20.5,'#141a3f','#2b3a6b'],[24,'#0b1230','#1c2a52']];
function skyAt(h){for(var i=0;i<SKY.length-1;i++){var a=SKY[i],b=SKY[i+1];if(h>=a[0]&&h<=b[0]){var t=(h-a[0])/(b[0]-a[0]);return [mix(a[1],b[1],t),mix(a[2],b[2],t)]}}return [SKY[0][1],SKY[0][2]]}
function nightAmt(h){if(h>=20.5||h<5)return 1;if(h>=19)return (h-19)/1.5;if(h<6.5)return 1-(h-5)/1.5;return 0}
function duskAmt(h){if(h>=16.5&&h<19.5)return 1-Math.abs(h-18)/1.5;if(h>=5&&h<7.5)return 1-Math.abs(h-6.2)/1.3;return 0}

/* ---------- 版面 ---------- */
var worldC=null,hillC=null;
function layout(){
  var w=window.innerWidth,h=window.innerHeight;
  S=w<560?3:(w<1000?4:5);DPR=Math.min(2,window.devicePixelRatio||1);K=S*DPR;
  W=Math.ceil(w/S);H=Math.ceil(h/S);cv.width=Math.round(w*DPR);cv.height=Math.round(h*DPR);
  yh=Math.round(H*0.42);yMin=yh+16;yMax=H-38;if(yMax<yMin+30)yMax=yMin+30;
  WW=Math.max(520,W+200);

function updateDog(dt){
  // 動作中

  if(dog.state==='act'){var a=dog.act;a.t+=dt;if(a.tick)a.tick(a,dt);if(dog.state==='act'&&a.t>=a.dur)endAct();return}

    var dx=gx-dog.x,dy=gy-dog.y,d=Math.hypot(dx,dy);

});
cv.addEventListener('pointermove',function(e){if(!down)return;var p=toWorld(e);if(Math.hypot(p.x-down.x,p.y-down.y)>3)down.moved=true;if(down.moved&&dog.state==='move'&&!dog.chase){dog.goal.x=clamp(p.x,16,WW-16);dog.goal.y=clamp(p.y,yMin,yMax);dog.goal.then=null;dog.run=Math.hypot(p.x-dog.x,p.y-dog.y)>90}});
window.addEventListener('pointerup',function(){down=null});
function moveTo(p,dbl){
  if(dog.state==='sleep'){wake()}
  if(dog.state==='act'&&dog.act&&dog.act.name!=='sit'&&dog.act.t<dog.act.dur-.3){/* 讓牠做完 */}
  var d=Math.hypot(p.x-dog.x,p.y-dog.y);
  dog.chase=false;goTo(p.x,p.y,dbl||d>100,null);
  spawn({x:p.x,y:p.y,vx:0,vy:0,life:.5,t:0,kind:'dot',col:'#ffffff'});
}

/* ---------- HUD ---------- */
var $=function(i){return document.getElementById(i)};
function updHud(){
  ['food','water','energy','fun'].forEach(function(k){var v=Math.round(st[k]);var b=$('b-'+k);b.style.width=v+'%';b.parentNode.classList.toggle('low',v<28);b.parentNode.setAttribute('aria-valuenow',v)});
  $('lvl').textContent='默契 Lv '+st.lvl;var need=40+st.lvl*30;$('bondb').style.width=Math.round(st.bond/need*100)+'%';
  $('snd').textContent=st.sound?'音效 開':'音效 關';
  $('hatb').textContent=st.hat?'聖誕帽 戴':'聖誕帽 脫';
  $('sleepb').querySelector('span').textContent=(dog.state==='sleep')?'叫醒':'睡覺';
}
function bind(id,fn){$(id).addEventListener('click',function(e){e.preventDefault();ac();fn();$('tricks').classList.remove('on')})}
bind('foodb',pourFood);bind('waterb',pourWater);bind('ballb',function(){throwBall(clamp(dog.x+dog.face*rnd(60,150),20,WW-20),rnd(yMin,yMax))});
bind('treatb',giveTreat);bind('sleepb',sleepNow);
$('trickb').addEventListener('click',function(e){e.preventDefault();ac();$('tricks').classList.toggle('on')});
['sit','shake','roll','bow','bark'].forEach(function(k){$('t-'+k).addEventListener('click',function(e){e.preventDefault();ac();trick(k);$('tricks').classList.remove('on')})});
$('snd').addEventListener('click',function(){st.sound=!st.sound;if(st.sound)ac();updHud();save()});
$('hatb').addEventListener('click',function(){st.hat=!st.hat;updHud();SFX.pop();save()});
if(!xmasSeason)$('hatb').style.display='none';
window.addEventListener('resize',function(){layout();placeObjs();dog.y=clamp(dog.y,yMin,yMax)});

/* ---------- 啟動 ---------- */
layout();placeObjs();
dog.x=Math.round(WW*.5);dog.y=yMax-6;camX=clamp(dog.x-W/2,0,Math.max(0,WW-W));
for(var i=0;i<5;i++)clouds.push({x:Math.random()*400,y:rnd(6,yh*.5),s:1+Math.floor(Math.random()*2),v:rnd(1.5,4)});
for(var j=0;j<4;j++)bfs.push({x:rnd(80,WW-80),y:rnd(yh+10,yMax-20),a:rnd(0,6.28),ph:rnd(0,6),col:['#ff8fb1','#ffd166','#a2d2ff','#ffffff'][j%4]});
for(var q=0;q<40;q++)flakes.push({x:Math.random()*W,y:Math.random()*H,v:rnd(8,20),s:Math.random()<.3?2:1,a:rnd(.55,.95),ph:rnd(0,6)});
updHud();
if(!st.seen){st.seen=1;setTimeout(function(){toast('點一下地面，辛巴就會跑過去')},900)}
// 測試用
window.__simba={dog:dog,st:st,ball:ball,pet:pet,trick:trick,eatAt:eatAt,drinkAt:drinkAt,sleepNow:sleepNow,throwBall:throwBall,giveTreat:giveTreat,pourFood:pourFood,pourWater:pourWater,update:update,render:render,goTo:goTo,get cam(){return camX},wake:wake,setHour:function(h){Q.set('hour',h)}};
if(!Q.get('manual'))requestAnimationFrame(frame);
})();
</script>
