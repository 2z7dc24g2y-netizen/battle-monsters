<!doctype html>
<html lang="zh-Hant">
<head>
<base target="_parent">
<meta charset="utf-8"><script src="split.js?v=3"></script>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>理化獸競技島</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&family=Fredoka:wght@500;600;700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" media="print" onload="this.media='all'"><noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&family=Fredoka:wght@500;600;700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap"></noscript>
<style>
/* 版面：上方頂列（返回航海圖、島名、經驗能量）→ 一張手繪風的島嶼插畫（競技場、培育中心、能量站、碼頭，自己的理化獸在島上散步）→ 三張入口卡。
   競技場、培育中心、能量站都是從下方滑上來的全螢幕面板，網址 #arena #nursery #energy 可以直接打開。 */
:root{
  --paper:#fffaf3; --paper-2:#f5eee2; --paper-3:#ece2d1; --ink:#2f2a26; --ink-soft:#6f6359; --line:#e3d5c0;
  --accent:#e0583a; --accent-d:#a83a22; --gold:#f2b63c; --gold-d:#b07d14; --ok:#3f9a55; --bad:#d4483a;
  --sea-1:#8fd0dc; --sea-2:#5fb0c2; --sea-3:#3f8fa6;
  --f-display:"Huninn","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-num:"Fredoka","Noto Sans TC",system-ui,sans-serif;
  --shadow:0 10px 30px rgba(40,50,60,.16),0 1px 0 rgba(40,50,60,.06);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--sea-3);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
a{color:inherit}
h1,h2,h3{font-family:var(--f-display);font-weight:400;margin:0;line-height:1.15;text-wrap:balance}
[hidden]{display:none!important}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

/* ---- 3D 場景與島嶼介面（對齊其他島：紙色圓角面板、左上島名、右上按鈕） ---- */
html,body{height:100%;overflow:hidden}
body{background:#86b8c2}
#stage{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#stage:active{cursor:grabbing}
#labels{position:fixed;inset:0;pointer-events:none;z-index:2}
.lbl{position:absolute;left:0;top:0;display:flex;align-items:center;gap:6px;padding:6px 13px 6px 6px;border:0;border-radius:99px;background:var(--paper);box-shadow:var(--shadow);font-size:14px;font-weight:700;white-space:nowrap;pointer-events:auto;cursor:pointer;transform:translate(-50%,-100%);transition:opacity .25s}
.lbl i{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;color:#fff;font-style:normal;font-family:var(--f-num);font-size:12px}
.lbl small{font-weight:500;color:var(--ink-soft);font-size:12px}
.lbl::after{content:"";position:absolute;left:50%;top:100%;width:2px;height:14px;background:rgba(255,250,243,.9);transform:translateX(-50%)}
.lbl.mon{padding:3px 9px;font-size:11.5px;gap:4px;background:rgba(255,250,243,.88);pointer-events:none}
.lbl.mon::after{display:none}
.lbl.mon i{width:14px;height:14px;font-size:9px;border-radius:4px}
.brand{position:fixed;z-index:5;top:calc(env(safe-area-inset-top,0px) + 14px);left:max(14px,env(safe-area-inset-left,0px));display:flex;align-items:center;gap:12px;padding:10px 16px 10px 12px;background:rgba(255,250,243,.94);border-radius:22px;box-shadow:var(--shadow);max-width:calc(100% - 130px)}
.big{font-family:var(--f-display);font-size:40px;line-height:.9;color:var(--accent)}
.t1{font-weight:900;font-size:17px;letter-spacing:.08em;white-space:nowrap}
.t2{margin-top:3px;font-size:11px;font-weight:700;letter-spacing:.12em;color:var(--accent);white-space:nowrap}
@media (max-width:520px){.t2 span{display:none}.big{font-size:32px}.t1{font-size:15px}}
.side{position:fixed;z-index:5;top:calc(env(safe-area-inset-top,0px) + 14px);right:max(14px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:10px}
.sbtn{display:flex;align-items:center;gap:6px;justify-content:center;min-width:76px;height:46px;padding:0 14px;border:0;border-radius:16px;background:rgba(255,250,243,.94);box-shadow:var(--shadow);font-size:15px;font-weight:500;cursor:pointer;text-decoration:none;color:var(--ink)}
.sbtn svg{width:16px;height:16px}
.echip{background:linear-gradient(#fff3cf,#ffe39a);font-weight:700}
.echip .ico{width:24px;height:24px}.echip b{font-family:var(--f-num);font-size:18px}
.dock{position:fixed;z-index:4;left:0;right:0;bottom:0;padding:0 max(12px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.dock>*{pointer-events:auto;width:min(100%,860px)}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.card{all:unset;box-sizing:border-box;cursor:pointer;background:rgba(255,250,243,.96);border-radius:18px;padding:10px 12px;display:flex;gap:10px;align-items:center;box-shadow:var(--shadow);transition:transform .15s}
.card:hover{transform:translateY(-3px)}
.card:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.card .ic{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;flex:none}
.card h3{font-size:18px}
.card .meta{display:block;font-family:var(--f-num);font-weight:600;font-size:12.5px;color:var(--ink-soft);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card>span:last-child{min-width:0}
@media (max-width:560px){.card{flex-direction:column;text-align:center;padding:8px 6px;gap:4px}.card .ic{width:38px;height:38px}.card h3{font-size:15px}.card .meta{font-size:11px}}
.bubble{display:flex;gap:10px;align-items:center;background:rgba(255,250,243,.96);border-radius:16px;padding:6px 8px 6px 10px;font-size:14.5px;font-weight:700;box-shadow:var(--shadow)}
.bubble img{width:40px;height:40px;object-fit:contain;flex:none;image-rendering:pixelated}
.bubble .go{margin-left:auto}
.hint{position:fixed;z-index:3;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 86px);font-size:12px;background:rgba(255,250,243,.9);padding:6px 14px;border-radius:99px;pointer-events:none;white-space:nowrap;box-shadow:var(--shadow);transition:opacity .6s}
@media (max-width:520px){.hint{top:auto;bottom:calc(env(safe-area-inset-bottom,0px) + 190px)}}
#boot{position:fixed;inset:0;z-index:200;display:grid;place-items:center;background:radial-gradient(circle at 50% 40%,#bfe0dc,#86b8c2 70%);transition:opacity .7s}
#boot.off{opacity:0;pointer-events:none}
.bt-card{width:min(320px,calc(100vw - 48px));text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px}
.bt-hex{width:84px;height:94px;display:grid;place-items:center;background:var(--accent);color:#fff;font-family:var(--f-display);font-size:42px;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%)}
.bt-name{font-weight:900;font-size:22px;letter-spacing:.1em}
.bt-bar{width:180px;height:6px;border-radius:9px;background:rgba(255,255,255,.6);overflow:hidden}.bt-bar i{display:block;height:100%;width:40%;background:var(--accent);border-radius:9px;animation:btb 1s ease-in-out infinite}
@keyframes btb{0%{transform:translateX(-100%)}100%{transform:translateX(250%)}}
.bt-tip{font-size:13px;color:var(--ink-soft)}
.howto{background:#fff;border:2px dashed var(--line);border-radius:16px;padding:12px 16px;font-size:14px;color:var(--ink-soft)}.howto b{color:var(--ink)}
.nogl{position:fixed;inset:0;display:grid;place-items:center;padding:24px;text-align:center;color:var(--ink)}
/* 相剋圖 */
.cyc{display:flex;gap:14px;align-items:center;background:#fff;border:2px solid var(--line);border-radius:18px;padding:10px 14px}
.cyc svg{width:150px;height:150px;flex:none}
.cyc ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px;font-size:13.5px}
.cyc li b{font-weight:900}
@media (max-width:520px){.cyc{flex-direction:column}.cyc svg{width:180px;height:180px}}
.tipl{display:flex;flex-direction:column;gap:8px}
.tipc{display:flex;align-items:center;gap:10px;background:#fff;border:2px solid var(--line);border-radius:14px;padding:8px 12px}
.tipc.hot{border-color:var(--gold)}
.tipc>div{flex:1;min-width:0}.tipc b{display:block;font-size:15px}.tipc span{font-size:13px;color:var(--ink-soft)}
/* ---- 面板 ---- */
.back{display:inline-flex;align-items:center;gap:4px;text-decoration:none;font-weight:700;font-size:14px;color:var(--ink-soft);border-radius:99px;padding:6px 12px 6px 8px;background:var(--paper-2);min-height:40px;white-space:nowrap}
.panel{position:fixed;inset:0;z-index:30;background:var(--paper);display:flex;flex-direction:column;transform:translateY(100%);transition:transform .38s cubic-bezier(.2,.9,.3,1);visibility:hidden}
.panel.open{transform:none;visibility:visible}
.ph{display:flex;align-items:center;gap:10px;padding:calc(8px + env(safe-area-inset-top,0px)) max(14px,env(safe-area-inset-right,0px)) 10px max(14px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line);background:var(--paper)}
.ph h2{font-size:clamp(22px,5vw,30px);flex:1}
.pb{flex:1;overflow-y:auto;padding:16px max(14px,env(safe-area-inset-right,0px)) calc(30px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px))}
.pb-in{max-width:960px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.btn{--b:var(--accent);--bd:var(--accent-d);border:0;border-radius:12px;padding:8px 16px;font-weight:700;color:#fff;background:var(--b);box-shadow:0 4px 0 var(--bd);cursor:pointer;min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;text-decoration:none}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--bd)}
.btn:disabled,.btn[aria-disabled="true"]{opacity:.4;cursor:not-allowed;transform:none;box-shadow:0 4px 0 var(--bd)}
.btn.gold{--b:var(--gold);--bd:var(--gold-d);color:#3a2207}
.btn.ghost{--b:var(--paper-2);--bd:var(--paper-3);color:var(--ink);border:2px solid var(--line)}
.btn.sm{min-height:38px;padding:5px 12px;font-size:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.muted{color:var(--ink-soft)}.small{font-size:14px}

/* 競技場關卡 */
.ladder{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.stg{background:#fff;border:2px solid var(--line);border-radius:18px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;position:relative;overflow:hidden}
.stg::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--c)}
.stg.next{border-color:var(--accent);box-shadow:0 0 0 3px rgba(224,88,58,.18)}
.stg.lock{opacity:.55}
.stg .hd{display:flex;align-items:center;gap:10px}
.stg .no{width:40px;height:40px;border-radius:12px;background:var(--c);color:#fff;display:grid;place-items:center;font-family:var(--f-num);font-weight:700;font-size:18px;flex:none}
.stg .nm{flex:1;min-width:0}
.stg .nm b{font-family:var(--f-display);font-weight:400;font-size:19px;display:block;line-height:1.2}
.stg .nm span{font-size:13px;color:var(--ink-soft)}
.foes{display:flex;gap:6px;align-items:flex-end}
.foe{display:flex;flex-direction:column;align-items:center;font-size:11px;font-family:var(--f-num);font-weight:600;color:var(--ink-soft)}
.foe img{width:48px;height:48px;object-fit:contain}
.stg .ft{display:flex;align-items:center;justify-content:space-between;gap:8px}
.stars{display:flex;gap:1px}
.tag{font-size:12px;font-weight:700;border-radius:99px;padding:1px 9px;background:var(--paper-2);color:var(--ink-soft);white-space:nowrap}
.tag.hot{background:#fde3dc;color:var(--accent-d)}
.summary{display:flex;gap:10px;flex-wrap:wrap}
.sbox{background:var(--paper-2);border-radius:14px;padding:8px 14px;min-width:110px}
.sbox b{font-family:var(--f-num);font-size:24px;display:block;line-height:1.1}
.sbox span{font-size:13px;color:var(--ink-soft)}

/* 培育中心 */
.pool{display:flex;align-items:center;gap:12px;background:linear-gradient(135deg,#fff6db,#ffe9b0);border-radius:18px;padding:12px 16px}
.pool .ico{width:48px;height:48px;flex:none}
.pool b{font-family:var(--f-num);font-size:30px;line-height:1}
.slots{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:820px){.slots{grid-template-columns:minmax(0,1fr)}}
.mcard{background:#fff;border:2px solid var(--line);border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:10px;position:relative}
.mcard .art{position:relative;height:160px;border-radius:14px;display:flex;align-items:flex-end;justify-content:center;overflow:hidden;background:radial-gradient(ellipse 60% 22% at 50% 88%,rgba(0,0,0,.12),transparent 70%),linear-gradient(var(--tint),#fff)}
.mcard .art img{height:84%;width:auto;max-width:86%;object-fit:contain;animation:breath 2.6s ease-in-out infinite;transform-origin:50% 100%;margin-bottom:6%}
.mcard .art .lv{position:absolute;top:8px;left:8px;background:rgba(255,255,255,.9);border-radius:99px;padding:1px 10px;font-family:var(--f-num);font-weight:700}
.mcard .art .el{position:absolute;top:8px;right:8px;color:#fff;border-radius:99px;padding:1px 10px;font-weight:700;font-size:13px}
.mcard h3{font-size:24px}
.mcard .sub{font-size:13px;color:var(--ink-soft)}
.xpb{height:12px;background:var(--paper-3);border-radius:99px;overflow:hidden;position:relative}
.xpb i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,#f2b63c,#ffd56b);border-radius:99px;transition:width .5s cubic-bezier(.2,.9,.3,1)}
.xpt{display:flex;justify-content:space-between;font-size:13px;color:var(--ink-soft);font-family:var(--f-num)}
.stats{display:grid;grid-template-columns:auto 1fr auto;gap:3px 8px;align-items:center;font-size:13px}
.stats .bar{height:7px;background:var(--paper-3);border-radius:99px;overflow:hidden}
.stats .bar i{display:block;height:100%;border-radius:99px}
.stats span:first-child{color:var(--ink-soft)}
.skills{font-size:13px;display:flex;flex-direction:column;gap:3px}
.skills b{font-weight:700}
.empty{all:unset;box-sizing:border-box;cursor:pointer;border:3px dashed var(--line);border-radius:20px;min-height:220px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--ink-soft);font-weight:700;background:var(--paper)}
.empty:hover{border-color:var(--accent);color:var(--accent)}
.empty svg{width:64px;height:64px}
.rel{all:unset;cursor:pointer;font-size:12px;color:var(--ink-soft);text-decoration:underline;align-self:flex-end}
.pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.pk{all:unset;box-sizing:border-box;cursor:pointer;background:#fff;color:var(--ink);border:2px solid var(--line);border-radius:16px;padding:10px;display:flex;flex-direction:column;gap:4px;align-items:center;text-align:center}
.pk:hover,.pk:focus-visible{border-color:var(--c);box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 30%,transparent)}
.pk img{height:90px;object-fit:contain}
.pk b{font-family:var(--f-display);font-weight:400;font-size:20px}
.fx .pk p{margin:0;font-size:13px;color:var(--ink-soft);text-align:left}
.pk .el{color:#fff;border-radius:99px;padding:0 10px;font-size:12px;font-weight:700}

/* 能量站 */
.src{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:640px){.src{grid-template-columns:minmax(0,1fr)}}
.sc{background:#fff;border:2px solid var(--line);border-radius:16px;padding:12px 14px;display:grid;grid-template-columns:48px 1fr auto;gap:12px;align-items:center}
.sc .ic{width:48px;height:48px;border-radius:12px;display:grid;place-items:center}
.sc b{font-size:17px}
.sc p{margin:0;font-size:13px;color:var(--ink-soft)}
.sc .v{text-align:right;font-family:var(--f-num)}
.sc .v b{font-size:22px;color:var(--gold-d);display:block}
.sc .v span{font-size:12px;color:var(--ink-soft)}
.isles{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.isles a{display:flex;align-items:center;gap:8px;text-decoration:none;background:#fff;border:2px solid var(--line);border-radius:12px;padding:6px 10px;font-size:13px;font-weight:700}
.isles a i{width:24px;height:24px;border-radius:7px;color:#fff;display:grid;place-items:center;font-style:normal;font-family:var(--f-num);font-size:12px;flex:none}
.isles a em{margin-left:auto;font-style:normal;font-family:var(--f-num);color:var(--ink-soft)}

/* 動畫特效 */
.fx{position:fixed;inset:0;z-index:60;display:grid;place-items:center;background:rgba(20,16,30,.78);opacity:0;transition:opacity .3s;pointer-events:none}
.fx.on{opacity:1;pointer-events:auto}
.fx .box{display:flex;flex-direction:column;align-items:center;gap:12px;color:#fff;text-align:center;padding:20px}
.fx .stagebox{position:relative;isolation:isolate;width:min(70vw,280px);aspect-ratio:1;display:grid;place-items:end center}
.fx .stagebox img{position:absolute;bottom:6%;height:84%;left:50%;transform:translateX(-50%);object-fit:contain}
.fx .rays{position:absolute;inset:-30%;pointer-events:none;z-index:-1;background:repeating-conic-gradient(rgba(255,230,160,.25) 0 10deg,transparent 10deg 20deg);border-radius:50%;animation:spin 8s linear infinite;mask:radial-gradient(circle,#000 30%,transparent 70%);-webkit-mask:radial-gradient(circle,#000 30%,transparent 70%)}
@keyframes spin{to{transform:rotate(360deg)}}
.fx h2{font-size:clamp(26px,6vw,40px);color:#ffe28a}
.fx p{margin:0;color:#f2e9da}
.sil{filter:brightness(0) invert(1)}
.flashw{position:fixed;inset:0;background:#fff;z-index:61;pointer-events:none;animation:fw .6s forwards}
@keyframes fw{from{opacity:1}to{opacity:0}}
.egg{width:46%;position:absolute;bottom:6%;left:50%;transform:translateX(-50%)}
.egg.shake{animation:eshake .4s ease-in-out infinite}
@keyframes eshake{25%{transform:translateX(-50%) rotate(-8deg)}75%{transform:translateX(-50%) rotate(8deg)}}
.lvpop{position:fixed;z-index:62;pointer-events:none;font-family:var(--f-num);font-weight:700;font-size:26px;color:#fff;-webkit-text-stroke:4px var(--gold-d);paint-order:stroke;transform:translate(-50%,-50%);animation:lvp 1.3s forwards}
@keyframes lvp{0%{transform:translate(-50%,-20%) scale(.5);opacity:0}20%{transform:translate(-50%,-60%) scale(1.15);opacity:1}100%{transform:translate(-50%,-160%);opacity:0}}
.spark{position:fixed;z-index:62;width:12px;height:12px;border-radius:50%;background:radial-gradient(circle,#fff,#ffd56b 50%,#f2b63c);box-shadow:0 0 10px #ffd56b;pointer-events:none}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,140%);visibility:hidden;background:var(--ink);color:#fff;border-radius:14px;padding:10px 18px;font-weight:700;z-index:70;transition:transform .3s;max-width:92vw;text-align:center}
.toast.show{transform:translate(-50%,0);visibility:visible}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-iteration-count:1!important;transition-duration:.01s!important}}
html,body{background:transparent!important}
.panel .ph .back{cursor:pointer}

<script>
(function(){

  g.gain.setValueAtTime(0,c.currentTime+t0);g.gain.linearRampToValueAtTime(v||.08,c.currentTime+t0+.01);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+t0+d);o.connect(g);g.connect(c.destination);o.start(c.currentTime+t0);o.stop(c.currentTime+t0+d+.05)}

/* ---------- 首頁 ---------- */

function starSvg(on,sz){return '<svg viewBox="0 0 24 24" width="'+(sz||20)+'" height="'+(sz||20)+'" aria-hidden="true"><path d="M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.3l-5.9 3.3 1.3-6.6L2.5 9.4l6.6-.8z" fill="'+(on?'#f2b63c':'#ece2d1')+'" stroke="'+(on?'#b07d14':'#d9ccb6')+'" stroke-width="1.4" stroke-linejoin="round"/></svg>'}

<script>/* 木系是精靈：圖片比其他系小一號（底部對齊） */(function(){if(!window.STAND)return;var W=[STAND.wood1,STAND.wood2,STAND.wood3];var st=document.createElement('style');st.textContent='img.el-wood{scale:.8;transform-origin:50% 100%}';document.head.appendChild(st);function mark(r){if(!r||!r.querySelectorAll)return;r.querySelectorAll('img').forEach(function(i){if(!i.classList.contains('el-wood')&&W.indexOf(i.getAttribute('src'))>=0&&!i.closest('.spr'))i.classList.add('el-wood')})}new MutationObserver(function(ms){ms.forEach(function(m){m.addedNodes.forEach(function(n){if(n.nodeType===1)mark(n.tagName==='IMG'?n.parentNode:n)})})}).observe(document.body,{childList:true,subtree:true});mark(document)})();</script>
