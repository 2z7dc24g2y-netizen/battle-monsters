<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><script src="split.js?v=3"></script><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>理化獸競技場｜理化獸競技島</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&family=Fredoka:wght@500;600;700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" media="print" onload="this.media='all'"><noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&family=Fredoka:wght@500;600;700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap"></noscript>
<style>
/* Layout: 商業 RPG 戰場 — 夜紫金邊的遊戲面板、黃昏競技場、上方行動順序列、下方指令面板。整頁固定不捲動。單一主題（深色面板＋明亮舞台）。 */
:root{
  --panel:#1e1528; --panel-2:#2b2039; --panel-3:#3a2c4d; --line:#5b4775; --gold:#f2c14e; --gold-2:#ffde85;
  --text:#f7efe2; --sub:#c3b5a6; --dim:#8f8297;
  --blue:#4c9ae8; --blue-d:#2a5f99; --red:#e8644a; --red-d:#9e3524; --ok:#5cc97a; --bad:#ff6b5a; --warn:#ffc04d;
  --fire:#ff7a3d; --water:#47a3f0; --wood:#5fbf5a; --earth:#c79a6a; --elec:#f2c522;
  --f-display:"Huninn","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-num:"Fredoka","Noto Sans TC",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:#120c19;color:var(--text);font-family:var(--f-body);font-size:16px;line-height:1.45;overflow:hidden;-webkit-tap-highlight-color:transparent}
button,input{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);font-weight:400;margin:0;text-wrap:balance}
[hidden]{display:none!important}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.game{position:fixed;inset:0;display:flex;flex-direction:column;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}

/* ===== 記分列 ===== */
.hud{flex:none;display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:10px;align-items:center;padding:6px max(12px,env(safe-area-inset-left,0px));
  background:linear-gradient(#2a1d38,#1a1224);border-bottom:2px solid var(--gold)}
.team{display:flex;flex-direction:column;gap:3px;min-width:0}
.team.B{align-items:flex-end;text-align:right}
.tn{display:flex;gap:8px;align-items:baseline}
.team.B .tn{flex-direction:row-reverse}
.tn{min-width:0;max-width:100%}.tn b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:var(--f-display);font-weight:400;font-size:clamp(16px,2vw,26px);line-height:1.1}
.team.A b{color:#9cd0ff}.team.B b{color:#ffb09e}
.tn small{font-family:var(--f-num);color:var(--sub);font-size:13px}
.tbar{width:min(100%,380px);height:12px;background:#0d0912;border:2px solid #4a3a5e;border-radius:99px;overflow:hidden;position:relative}
.tbar span{position:absolute;top:0;bottom:0;transition:width .5s}
.team.A .tbar span{left:0;background:linear-gradient(90deg,#3d7fd0,#7cc2ff)}
.team.B .tbar span{right:0;background:linear-gradient(270deg,#d24a32,#ff9c80)}
.mid{display:flex;gap:6px;align-items:center}
.round{font-family:var(--f-num);font-weight:700;background:linear-gradient(var(--gold-2),var(--gold));color:#3a2207;border-radius:10px;padding:2px 14px;white-space:nowrap;box-shadow:0 2px 0 #a8791d}
.ibtn{border:2px solid #5b4775;background:#2b2039;color:var(--text);border-radius:10px;padding:3px 10px;cursor:pointer;font-size:13px;font-weight:700;white-space:nowrap;min-height:32px}
.ibtn[aria-pressed="false"]{opacity:.55;text-decoration:line-through}

/* ===== 戰場 ===== */
.stage{position:relative;flex:1 1 auto;min-height:150px;overflow:hidden;
  background:
    radial-gradient(ellipse 55% 20% at 50% 74%,rgba(255,240,180,.35),transparent 70%),
    linear-gradient(180deg,#ffb26b 0%,#ff8f6b 20%,#d0708a 38%,#7a5d93 46%,#5c8a4a 46.2%,#7aad5c 62%,#5d8f45 100%)}
.hills{position:absolute;left:0;right:0;top:35%;height:12%;background:
  radial-gradient(ellipse 18% 70% at 12% 100%,#4f3d6b 98%,transparent 100%),radial-gradient(ellipse 22% 90% at 38% 100%,#5a4676 98%,transparent 100%),
  radial-gradient(ellipse 20% 80% at 66% 100%,#4f3d6b 98%,transparent 100%),radial-gradient(ellipse 18% 70% at 90% 100%,#5a4676 98%,transparent 100%)}
.sun{position:absolute;left:50%;top:12%;width:15vmin;height:15vmin;transform:translateX(-50%);border-radius:50%;background:radial-gradient(circle,#fff4c9,#ffd27a 60%,rgba(255,210,122,0) 72%)}
.cloud{position:absolute;height:5vmin;border-radius:99px;background:rgba(255,240,230,.55);filter:blur(1px);animation:drift linear infinite}
.cloud::before{content:"";position:absolute;left:20%;top:-60%;width:45%;height:120%;border-radius:50%;background:inherit}
@keyframes drift{from{transform:translateX(-30vw)}to{transform:translateX(130vw)}}
.ground-line{position:absolute;left:50%;top:47%;bottom:0;width:4px;transform:translateX(-50%);background:linear-gradient(rgba(255,255,255,0),rgba(255,255,255,.4));pointer-events:none}
.stage.shake{animation:shake .42s}
@keyframes shake{20%{transform:translate(-7px,3px)}40%{transform:translate(7px,-3px)}60%{transform:translate(-4px,2px)}80%{transform:translate(3px,-1px)}}
.flash{position:absolute;inset:0;pointer-events:none;animation:flash .5s forwards;z-index:20}
@keyframes flash{from{opacity:.7}to{opacity:0}}

/* 行動順序 */
.order{position:absolute;top:8px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:4px;background:rgba(20,13,28,.72);border:2px solid rgba(242,193,78,.6);border-radius:14px;padding:4px 10px;z-index:15;max-width:calc(100% - 16px);overflow:hidden}
.order .lbl{font-size:11px;color:var(--gold-2);font-weight:900;margin-right:4px;white-space:nowrap}
.order .o{width:34px;height:34px;border-radius:50%;background:#2b2039;border:2px solid;display:grid;place-items:center;flex:none;overflow:hidden;transition:transform .3s}
.order .o img{width:120%;height:120%;object-fit:contain}
.order .o.A{border-color:#7cc2ff}.order .o.B{border-color:#ff9c80}
.order .o.now{width:44px;height:44px;box-shadow:0 0 0 3px var(--gold),0 0 12px var(--gold)}
.order .o.done{opacity:.3}
.order .sep{width:2px;height:24px;background:rgba(255,255,255,.25);margin:0 4px}

/* 怪獸 */
.mon{position:absolute;width:var(--u,120px);transform:translate(-50%,-100%);display:flex;flex-direction:column;align-items:center;transition:left .5s,top .5s;z-index:2;background:none;border:0;padding:0;cursor:default}
.mon .body{position:relative;width:100%;aspect-ratio:1;display:flex;align-items:flex-end;justify-content:center}
.mon .body .spr{width:calc(var(--sc,1)*100%);display:flex;justify-content:center;align-items:flex-end;transform-origin:50% 100%;animation:breath 2.6s ease-in-out infinite;animation-delay:var(--d,0s)}
.mon .body img{width:100%;height:auto;max-height:100%;object-fit:contain;filter:drop-shadow(0 3px 0 rgba(0,0,0,.2))}
@keyframes breath{50%{transform:scale(1.03,.97)}}
.mon.anim .shadow{display:none}
.mon .body canvas{width:150%;height:150%;position:absolute;left:-25%;bottom:-6%}.mon.el-wood .body canvas{scale:.8;transform-origin:50% 100%}
.mon.A .body img{transform:scaleX(-1)}
.mon .shadow{position:absolute;bottom:-6%;left:15%;right:15%;height:16%;border-radius:50%;background:rgba(30,20,10,.3);z-index:-1}
.plate{width:110%;background:rgba(24,16,34,.85);border:2px solid;border-radius:10px;padding:2px 6px 4px;margin-bottom:4px;box-shadow:0 2px 8px rgba(0,0,0,.35);display:flex;flex-direction:column;gap:2px}
.mon.A .plate{border-color:#7cc2ff}.mon.B .plate{border-color:#ff9c80}
.mon.near .plate{position:absolute;top:100%;left:-5%;margin:8px 0 0}
.plate .nm{font-size:clamp(10px,1.05vw,14px);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.2;display:flex;gap:4px;justify-content:space-between;color:var(--text)}
.plate .nm .el{width:14px;height:14px;border-radius:4px;display:inline-grid;place-items:center;font-size:10px;color:#fff;font-weight:900;flex:none}
.hp{position:relative;height:9px;background:#0d0912;border-radius:99px;overflow:hidden}
.hp .chip{position:absolute;inset:0 auto 0 0;background:#fff3c4;transition:width .7s .35s}
.hp .fill{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,#4fbf6d,#9be38f);transition:width .25s}
.hp.low .fill{background:linear-gradient(90deg,#e0503c,#ffb15c)}
.gauge{display:flex;gap:2px}
.gauge i{flex:1;height:5px;border-radius:3px;background:#3a2c4d}
.gauge i.on{background:linear-gradient(90deg,#ffd76a,#f29a2e)}
.gauge.full i{animation:glow .7s ease-in-out infinite alternate}
@keyframes glow{to{box-shadow:0 0 6px 2px rgba(255,200,80,.9)}}
.tags{position:absolute;top:0;right:-4px;display:flex;flex-direction:column;gap:2px;z-index:3}
.tags span{font-size:11px;font-weight:900;color:#fff;border-radius:6px;padding:0 5px;box-shadow:0 1px 3px rgba(0,0,0,.4)}
.mon.acting .body::before{content:"";position:absolute;left:8%;right:8%;bottom:-9%;height:22%;border-radius:50%;border:3px solid var(--gold);box-shadow:0 0 14px var(--gold),inset 0 0 10px var(--gold);animation:ring 1s infinite}
@keyframes ring{50%{transform:scale(1.15);opacity:.7}}
.mon.acting .plate{box-shadow:0 0 0 2px var(--gold),0 0 14px rgba(242,193,78,.7)}
.mon.target{cursor:pointer}
.mon.target .plate{box-shadow:0 0 0 3px var(--bad);animation:pulse .9s infinite}
.mon.target::after{content:"選我";position:absolute;top:-30px;left:50%;transform:translateX(-50%);background:var(--bad);color:#fff;font-weight:900;font-size:13px;border-radius:8px;padding:1px 10px;white-space:nowrap;animation:bob .7s infinite alternate;z-index:5}
.mon.near.target::after{top:-24px}
@keyframes pulse{50%{box-shadow:0 0 0 7px rgba(255,107,90,.45)}}
@keyframes bob{to{transform:translate(-50%,-6px)}}
.mon.dead .body{animation:fall .7s forwards}
.mon.dead .plate{opacity:.45}
@keyframes fall{to{transform:rotate(-14deg) translateY(10%);opacity:.28;filter:grayscale(1)}}
.mon.B.dead .body{animation-name:fallB}
@keyframes fallB{to{transform:rotate(14deg) translateY(10%);opacity:.28;filter:grayscale(1)}}
.mon.setupmon{cursor:pointer}
.lungeA .body{animation:lungeA .42s}.lungeB .body{animation:lungeB .42s}
@keyframes lungeA{40%{transform:translateX(30%) scale(1.06)}}
@keyframes lungeB{40%{transform:translateX(-30%) scale(1.06)}}
.hitA .body{animation:hitA .38s}.hitB .body{animation:hitB .38s}
@keyframes hitA{15%{transform:translateX(-10%);filter:brightness(2.4) saturate(.2)}55%{transform:translateX(4%)}}
@keyframes hitB{15%{transform:translateX(10%);filter:brightness(2.4) saturate(.2)}55%{transform:translateX(-4%)}}
.float{position:absolute;left:50%;top:22%;transform:translate(-50%,0);pointer-events:none;z-index:30;display:flex;flex-direction:column;align-items:center;line-height:1}
.float b{font-family:var(--f-num);font-weight:700;font-size:clamp(24px,3vw,42px);-webkit-text-stroke:3px #2a1430;paint-order:stroke;color:#fff}
.float small{font-family:var(--f-display);font-size:clamp(13px,1.4vw,18px);-webkit-text-stroke:3px #2a1430;paint-order:stroke;margin-bottom:2px}
.float.dmg{animation:dmgpop 1.1s cubic-bezier(.2,1.4,.4,1) forwards}
.float.dmg.big b{color:#ffd24d;font-size:clamp(30px,3.8vw,54px)}
.float.heal{animation:healup 1.5s ease-out forwards}
.float.heal b{color:#8ef59a}
.float.block{top:62%}.float.block b{font-size:clamp(13px,1.4vw,18px)!important}
.float.block b{color:#9fd3ff;font-size:clamp(16px,1.8vw,24px)}
@keyframes dmgpop{0%{transform:translate(-50%,10px) scale(.4)}20%{transform:translate(-50%,-14px) scale(1.25)}35%{transform:translate(-50%,-10px) scale(1)}80%{opacity:1}100%{transform:translate(-50%,-34px);opacity:0}}
@keyframes healup{0%{transform:translate(-50%,0);opacity:0}20%{opacity:1}100%{transform:translate(-50%,-50px);opacity:0}}
.pt{position:absolute;pointer-events:none;z-index:26}
.shot{position:absolute;width:20px;height:20px;border-radius:50%;z-index:25;pointer-events:none;transform:translate(-50%,-50%);background:#fff;box-shadow:0 0 12px 6px currentColor,0 0 30px 10px currentColor}
.bolt{position:absolute;z-index:27;pointer-events:none;width:60px;transform:translateX(-50%)}
.slot{position:absolute;width:calc(var(--u,120px)*.95);height:calc(var(--u,120px)*.32);transform:translate(-50%,-50%);border-radius:50%;border:3px dashed rgba(255,255,255,.85);background:rgba(255,255,255,.12);cursor:pointer;color:#fff;font-weight:900;font-size:clamp(9px,calc(var(--u,120px)*.11),13px);white-space:nowrap;text-shadow:0 1px 2px rgba(0,0,0,.5);display:grid;place-items:center;z-index:1}
.slot:hover,.slot.ready{background:rgba(255,255,255,.35)}
.slot.ready{border-color:var(--gold);animation:pulse .9s infinite}
.rowlbl{position:absolute;transform:translate(-50%,-100%);font-family:var(--f-display);font-size:clamp(11px,1.2vw,15px);color:rgba(255,255,255,.9);text-shadow:0 1px 3px rgba(0,0,0,.5);pointer-events:none}
.banner{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;z-index:40}
.banner b{font-family:var(--f-display);font-weight:400;font-size:clamp(30px,6vw,80px);color:#fff;padding:6px 40px;border-radius:16px;text-shadow:0 3px 0 rgba(0,0,0,.35);animation:ban 1.2s ease-out forwards;box-shadow:0 10px 40px rgba(0,0,0,.4);border:3px solid rgba(255,255,255,.7)}
@keyframes ban{0%{transform:scale(.3) rotate(-4deg);opacity:0}18%{transform:scale(1.1);opacity:1}75%{transform:scale(1);opacity:1}100%{opacity:0}}
.kotext{position:absolute;z-index:35;pointer-events:none;font-family:var(--f-display);font-size:clamp(22px,3vw,40px);color:#ffe36b;-webkit-text-stroke:4px #6b1a10;paint-order:stroke;transform:translate(-50%,-50%);animation:ko 1.2s forwards}
@keyframes ko{0%{transform:translate(-50%,-50%) scale(2.2);opacity:0}20%{transform:translate(-50%,-50%) scale(1);opacity:1}80%{opacity:1}100%{transform:translate(-50%,-90%);opacity:0}}


/* 屬性特效 */
.fxl{position:absolute;pointer-events:none;z-index:24}
.gring{position:absolute;pointer-events:none;z-index:1;border-radius:50%;transform:translate(-50%,-50%);border:4px solid}
.mon.burn .body{animation:burn .7s steps(6)}
@keyframes burn{0%,100%{filter:none}20%,60%{filter:sepia(1) saturate(4) hue-rotate(-25deg) brightness(1.3)}40%,80%{filter:sepia(.6) saturate(3) hue-rotate(-15deg) brightness(1.1)}}
.mon.wet .body{animation:wet .8s}
@keyframes wet{30%{filter:saturate(.6) brightness(1.1) hue-rotate(160deg)}}
.mon.zap .body{animation:zap .6s steps(2) 2}
@keyframes zap{50%{filter:brightness(2.2) contrast(1.4) saturate(0)}}
.mon.grow .body{animation:grow .8s}
@keyframes grow{40%{filter:saturate(1.6) hue-rotate(40deg) brightness(1.15)}}
.mon.quake .body{animation:quake .5s}
@keyframes quake{20%{transform:translateY(-6%)}40%{transform:translateY(2%)}60%{transform:translateY(-3%)}}
.stage.flicker::after{content:"";position:absolute;inset:0;z-index:23;pointer-events:none;background:#0d0820;animation:flick .5s steps(2) 2}
@keyframes flick{50%{opacity:0}}
.ultfx{position:absolute;inset:0;pointer-events:none;z-index:22;overflow:hidden}

/* 大招切入 */
.cutin{position:absolute;inset:0;z-index:45;pointer-events:none;overflow:hidden}
.cutin .shade{position:absolute;inset:0;background:rgba(10,5,18,.55);animation:fadeio 1.25s forwards}
.cutin .band{position:absolute;left:-10%;right:-10%;top:28%;height:44%;transform:skewY(-6deg);animation:band 1.25s cubic-bezier(.2,.9,.3,1) forwards;display:flex;align-items:center;gap:3%;padding:0 14%;overflow:hidden}
.cutin .band::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,rgba(255,255,255,.12) 0 2px,transparent 2px 22px);animation:lines .4s linear infinite}
.cutin img,.cutin canvas{height:120%;transform:skewY(6deg);filter:drop-shadow(0 6px 0 rgba(0,0,0,.3));animation:slidein 1.25s cubic-bezier(.2,.9,.3,1) forwards;position:relative}
.cutin .t{transform:skewY(6deg);display:flex;flex-direction:column;position:relative}
.cutin .t small{font-size:clamp(14px,1.8vw,22px);color:rgba(255,255,255,.85);font-weight:700}
.cutin .t b{font-family:var(--f-display);font-weight:400;font-size:clamp(34px,6vw,84px);color:#fff;-webkit-text-stroke:4px rgba(0,0,0,.35);paint-order:stroke;line-height:1.05}
@keyframes band{0%{transform:skewY(-6deg) translateX(-100%)}20%{transform:skewY(-6deg) translateX(0)}80%{transform:skewY(-6deg) translateX(0);opacity:1}100%{transform:skewY(-6deg) translateX(30%);opacity:0}}
@keyframes slidein{0%{transform:skewY(6deg) translateX(-60%)}25%{transform:skewY(6deg) translateX(0)}100%{transform:skewY(6deg) translateX(8%)}}
@keyframes lines{to{background-position:24px 0}}
@keyframes fadeio{0%{opacity:0}15%{opacity:1}80%{opacity:1}100%{opacity:0}}

/* VS 開場 */
.vs{position:absolute;inset:0;z-index:50;display:grid;grid-template-columns:1fr 1fr;pointer-events:none}
.vs .h{display:flex;align-items:center;justify-content:center;gap:2%;padding:4%;position:relative}
.vs .h.A{background:linear-gradient(110deg,#1d4f8f,#3d7fd0);animation:vsA 2.1s cubic-bezier(.2,.9,.3,1) forwards;clip-path:polygon(0 0,100% 0,88% 100%,0 100%)}
.vs .h.B{background:linear-gradient(250deg,#8f2a1d,#d24a32);animation:vsB 2.1s cubic-bezier(.2,.9,.3,1) forwards;clip-path:polygon(12% 0,100% 0,100% 100%,0 100%)}
.vs .h img{height:min(22vh,26%);max-width:18%;object-fit:contain;filter:drop-shadow(0 4px 0 rgba(0,0,0,.3))}
.vs .h.A img{transform:scaleX(-1)}
.vs .h .tt{position:absolute;bottom:8%;font-family:var(--f-display);font-size:clamp(22px,3.5vw,48px);color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.3)}
.vs .x{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-family:var(--f-num);font-weight:700;font-size:clamp(60px,12vw,170px);color:var(--gold-2);-webkit-text-stroke:6px #3a2207;paint-order:stroke;animation:vsx 2.1s forwards}
@keyframes vsA{0%{transform:translateX(-100%)}18%{transform:translateX(0)}82%{transform:translateX(0);opacity:1}100%{transform:translateX(-100%);opacity:0}}
@keyframes vsB{0%{transform:translateX(100%)}18%{transform:translateX(0)}82%{transform:translateX(0);opacity:1}100%{transform:translateX(100%);opacity:0}}
@keyframes vsx{0%,15%{transform:translate(-50%,-50%) scale(3);opacity:0}28%{transform:translate(-50%,-50%) scale(1);opacity:1}82%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) scale(.6)}}

/* 結算 */
.result{position:fixed;inset:0;z-index:48;display:grid;place-items:center;background:radial-gradient(circle,rgba(20,12,30,.55),rgba(10,6,16,.85));padding:12px}
.rcard{background:linear-gradient(var(--panel-2),var(--panel));border:3px solid var(--gold);border-radius:20px;padding:16px 20px;width:min(100%,720px);max-height:100%;overflow:auto;display:flex;flex-direction:column;gap:10px;align-items:center;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.6);animation:rin .5s cubic-bezier(.2,1.4,.4,1)}
@keyframes rin{from{transform:scale(.6);opacity:0}}
.rcard h2{font-size:clamp(30px,5vw,58px);line-height:1.1}
.mvp{display:flex;gap:14px;align-items:center;background:rgba(242,193,78,.12);border:2px solid rgba(242,193,78,.5);border-radius:16px;padding:8px 16px;text-align:left}
.mvp img{width:clamp(70px,10vw,110px);height:auto}
.mvp .tag{background:linear-gradient(var(--gold-2),var(--gold));color:#3a2207;font-weight:900;border-radius:8px;padding:0 8px;font-size:13px}
.statgrid{display:grid;grid-template-columns:auto 1fr 1fr;gap:4px 14px;font-size:14px;width:min(100%,460px)}
.statgrid .h{font-weight:900}
.statgrid .A{color:#9cd0ff}.statgrid .B{color:#ffb09e}
.statgrid span{text-align:center}.statgrid span:first-child,.statgrid .k{text-align:left;color:var(--sub)}

async function startBattle(){

  if(window.BWX){Object.keys(S.units).forEach(function(k){BWX.apply(S.units[k],S.wx)});BWX.scene($('#stage'),S.wx)}
  renderStage();$('#console').innerHTML='<h2 style="text-align:center;color:var(--gold-2)">準備開戰！</h2>'+(window.BWX?'<p style="text-align:center">'+esc(BWX.line(S.wx))+'</p>':'');

  await vsIntro();Snd.start();
  loop();

function newOrder(){S.order=Object.keys(S.units).map(function(k){return S.units[k]}).filter(function(u){return u.alive}).sort(function(a,b){return b.spd-a.spd||Math.random()-.5}).map(function(u){return u.uid});S.turn=0}

  var o=$('#order');o.hidden=false;
  var html='<span class="lbl">行動順序</span>';
  S.order.forEach(function(id,i){var u=S.units[id];if(!u.alive&&i>=S.turn)return;html+='<span class="o '+u.side+(i===S.turn-1?' now':i<S.turn-1?' done':'')+'" title="'+esc(nm(u))+'">'+face(u)+'</span>'});
  o.innerHTML=html;
}
async function loop(){
  newOrder();
  await banner('第 1 輪','#2b2039');
  while(!S.over){
    if(S.turn>=S.order.length){
      S.round++;if(S.round>MAXR)return finish(null);
      Object.keys(S.units).forEach(function(k){var u=S.units[k];if(u.shield){u.shield=false;refresh(u)}});
      newOrder();$('#round').textContent='第 '+S.round+' / '+MAXR+' 輪';await banner('第 '+S.round+' 輪'+(S.round===MAXR?'（最後一輪）':''),'#2b2039');
    }
    $('#round').textContent='第 '+S.round+' / '+MAXR+' 輪';
    var u=S.units[S.order[S.turn++]];if(!u||!u.alive)continue;
    renderOrder();
    await takeTurn(u);
    var w=winner();if(w)return finish(w);
  }
}
function winner(){var a=alive('A').length,b=alive('B').length;if(!a&&!b)return 'draw';if(!b)return 'A';if(!a)return 'B';return null}

function frontRow(side){for(var i=0;i<3;i++){var r=ROWS[i],us=alive(side).filter(function(u){return u.row===r});if(us.length)return us}return []}
function chooseAction(u){
  return new Promise(function(resolve){
    var e=EL[u.el],c=$('#console'),canUlt=u.gauge>=3,cpu=isCpu(u.side),foe=u.side==='A'?'B':'A';
    var hitFn=null,stg=$('#stage');

    var pick=function(type){
      Snd.fx('click');
      var kind=type==='normal'?e.range:e.ult.kind,need=type==='normal'||kind==='row';
      if(!need){resolve({type:type});return}

        if(best&&bd<=lim){ev.preventDefault();ev.stopPropagation();clear();resolve({type:type,target:best})}};stg.addEventListener('click',hitFn,true)}

      '<button class="move" data-t="normal"><b>'+esc(e.normal)+'</b><span class="d">普攻・'+RANGE_TXT[e.range]+(e.passive?'<br>'+e.passive:'')+'</span></button>'+
      '<button class="move ult'+(canUlt?' ready':'')+'" data-t="ult" aria-disabled="'+!canUlt+'"><b>大招：'+esc(e.ult.name)+'</b><span class="d">'+esc(e.ult.desc)+'</span><span class="pips">'+[0,1,2].map(function(i){return '<i class="'+(i<u.gauge?'on':'')+'"></i>'}).join('')+'</span></button></div><div id="mtip" class="small muted"></div>';
    if(cpu){setTimeout(function(){pick(canUlt?'ult':'normal')},600);return}
    c.querySelectorAll('.move').forEach(function(b){b.onclick=function(){if(b.getAttribute('aria-disabled')==='true')return;pick(b.dataset.t)}});
  });

/* --- 十字攻防條 --- */
function barParams(stat,isAtk){var lo=isAtk?20:8,hi=isAtk?45:42,t=Math.max(0,Math.min(1,(stat-lo)/(hi-lo)));return{period:460+t*640,perfect:.10+t*.10,good:.30+t*.10}}
function crossBar(axis,opt){

    if(document.activeElement&&document.activeElement.blur)document.activeElement.blur();
    var c=$('#console');
    c.innerHTML='<div class="crossbox"><div class="clabel">'+opt.label+'</div><div class="cross"><div class="track h'+(axis==='h'?' on':'')+'" id="th"></div><div class="track v'+(axis==='v'?' on':'')+'" id="tv"></div><div class="ball'+(axis==='v'?' def':'')+'" id="ball"></div></div>'+
      '<div class="res" id="res"></div><div class="small muted">'+(opt.cpu?'電腦操作中…':'看準時機，點畫面任何地方或按空白鍵')+'</div></div>';

    var ball=$('#ball'),cross=c.querySelector('.cross'),t0=performance.now(),stopped=false,x=0,ph=Math.random()*Math.PI*2;
    var frame=function(now){if(stopped)return;x=Math.sin(ph+(now-t0)/p.period*Math.PI);var W=cross.clientWidth,H=cross.clientHeight;
      if(axis==='h'){ball.style.left=(W/2+x*(W/2-20))+'px';ball.style.top='50%'}else{ball.style.top=(H/2+x*(H/2-20))+'px';ball.style.left='50%'}requestAnimationFrame(frame)};
    requestAnimationFrame(frame);

      if(stopped)return;stopped=true;window.removeEventListener('keydown',key);window.removeEventListener('pointerdown',tap);

      var r=$('#res');r.className='res '+z;r.textContent=(axis==='h'?{perfect:'PERFECT！100%',good:'GOOD 70%',miss:'偏了 40%'}:{perfect:'完美防守！擋 70%',good:'擋下 40%',miss:'沒擋到'})[z];
      if(opt.side){S.stats[opt.side].presses++;if(z==='perfect')S.stats[opt.side].perfect++}
      setTimeout(function(){resolve({zone:z})},480);

    var tap=function(e){if(e.target.closest('.hud'))return;e.preventDefault();stop()};
    if(opt.cpu){
      var roll=Math.random(),target=roll<S.cpuK+opt.skill*.35?0:roll<.75?p.perfect+.02+Math.random()*(p.good-p.perfect-.04):p.good+.05,wait=600+Math.random()*500;
      var chk=function(){if(stopped)return;if(performance.now()-t0>wait&&Math.abs(Math.abs(x)-target)<.05)stop();else requestAnimationFrame(chk)};requestAnimationFrame(chk);
    } else {setTimeout(function(){if(!stopped){window.addEventListener('pointerdown',tap);window.addEventListener('keydown',key)}},120)}
  });

var ATK={perfect:1,good:.7,miss:.4},BLOCK={perfect:.7,good:.4,miss:0};
function attackPress(u,label){return crossBar('h',{label:label,p:barParams(EL[u.el].atk,true),cpu:isCpu(u.side),skill:Math.min(1,(EL[u.el].atk-20)/25),side:u.side})}
async function defensePress(targets){

function elemMult(a,d){return EL[a.el].beats===d.el?ADV:EL[d.el].beats===a.el?DIS:1}
function damage(a,t,mult,az,blk){
  var b=t.shield?SHIELD_B:blk,em=elemMult(a,t);
  var crit=!!(a.crit&&Math.random()*100<a.crit),raw=DMG*a.atk*mult*ATK[az]*em*(1-t.def/220)*(.95+Math.random()*.1)*(crit?1.5:1);
  var dmg=Math.max(1,Math.round(raw*(1-b)));
  var real=Math.min(dmg,t.hp);t.hp-=real;a.dmg+=real;S.stats[a.side].dmg+=real;
  /* 吸血：打到對手回一點自己的血 */
  if(a.steal&&real>0&&a.alive&&a.hp<a.max){var sh=Math.min(a.max-a.hp,Math.max(1,Math.round(real*a.steal/100)));a.hp+=sh;a.heal+=sh;setTimeout(function(){floatTxt(a,'+'+sh,'heal',{t:'吸血',c:'#ff8fb0'});refresh(a)},260)}
  /* 反擊：完美防守時把部分傷害彈回去 */
  if(t.counter&&b>=.7&&t.alive&&a.alive&&t.hp>0){var cd=Math.max(1,Math.round(raw*t.counter/100)),cr=Math.min(cd,a.hp);a.hp-=cr;t.dmg+=cr;S.stats[t.side].dmg+=cr;

    setTimeout(function(){floatTxt(a,'-'+cd,'dmg',{t:'反擊！',c:'#ffb35c'});act(a,'hurt');if(died)setTimeout(function(){Snd.fx('ko');koText(a)},250);refresh(a)},420)}
  act(t,'hurt');particles(t,EL[a.el].fx,az==='perfect'?18:10);elemHit(a,t,az==='perfect'&&b<.4);
  var label=crit?{t:'暴擊！',c:'#ff6a3d'}:em>1?{t:'克制！',c:'#ffd24d'}:em<1?{t:'抵抗',c:'#9fb4c8'}:az==='perfect'?{t:'完美！',c:'#8ef59a'}:null;
  floatTxt(t,'-'+dmg,'dmg'+(az==='perfect'&&b<.4?' big':''),label);

  if(t.hp<=0){t.hp=0;t.alive=false;setTimeout(function(){Snd.fx('ko');koText(t)},250);var p=players[t.uid];if(p)p.play('hurt',{loop:false,then:null})}
  refresh(t);
}

/* 大招特效（ultfx.js）：命中那一格才扣血、補血、上盾；沒有載入時用原本的特效 */

async function perform(u,a){
  var e=EL[u.el],foe=u.side==='A'?'B':'A',who=sideName(u.side)+'・'+esc(nm(u));
  if(a.type==='ult'){u.gauge=0;refresh(u);await cutin(u)}
  var kind=a.type==='normal'?e.range:e.ult.kind,mult=a.type==='normal'?1:e.ult.mult*(u.ultB?1+u.ultB/100:1),anim=a.type==='ult'?'skill':'attack';
  if(kind==='shield'&&window.UltFX){var al=alive(u.side);act(u,'skill');$('#console').innerHTML='<div class="chead">'+whoHtml(u,'岩盾壁壘發動')+'</div><h2 style="text-align:center;color:var(--gold-2)">全隊這一輪受到岩盾保護！</h2>';
    await ultFx(u,al,function(i){var t=al[i];t.shield=true;refresh(t);Snd.fx('block')});await sleep(300);return}
  if(kind==='shield'){elemUlt(u,[]);alive(u.side).forEach(function(t){t.shield=true;refresh(t);particles(t,'rock',8);crack(t);groundRing(t,'#c79a6a',2)});act(u,'skill');Snd.fx('block');flash('#c79a6a');
    $('#console').innerHTML='<div class="chead">'+whoHtml(u,'岩盾壁壘發動')+'</div><h2 style="text-align:center;color:var(--gold-2)">全隊這一輪受到岩盾保護！</h2>';await sleep(1100);return}
  if(kind==='heal'){
    var r=await attackPress(u,who+'・光合作用：按越準補越多');var pct={perfect:.45,good:.34,miss:.24}[r.zone];act(u,'skill');Snd.fx('heal');

  if(kind==='chain'){
    var total=0;
    if(!window.UltFX)await elemUlt(u,[]);
    for(var i=0;i<3;i++){var pool=alive(foe);if(!pool.length)break;var t=pool[rnd(pool.length)];
      var ra=await attackPress(u,who+'・連鎖閃電 第 '+(i+1)+' 擊 → '+esc(nm(t)));var rd=await defensePress([t]);
      act(u,anim);var before=t.hp;
      if(window.UltFX){await ultFx(u,[t],function(){damage(u,t,mult,ra.zone,BLOCK[rd.zone])});total+=before-t.hp;await sleep(150);continue}
      lightning(t);flash('#fff6a0');damage(u,t,mult,ra.zone,BLOCK[rd.zone]);total+=before-t.hp;await sleep(450)}
    $('#console').innerHTML='<div class="chead">'+whoHtml(u,'連鎖閃電')+'</div><h2 style="text-align:center;color:var(--gold-2)">三連擊合計 <span class="num">'+total+'</span> 傷害！</h2>';await sleep(900);
    return;
  }
  var targets=kind==='all'?alive(foe):kind==='row'?alive(foe).filter(function(x){return x.row===a.target.row}):[a.target];
  var label=who+'・'+(a.type==='ult'?e.ult.name:e.normal)+' → '+(kind==='all'?'對方全體':kind==='row'?ROW_NAME[a.target.row]+'全部':esc(nm(a.target)));
  var r1=await attackPress(u,label),r2=await defensePress(targets);
  act(u,anim);
  if(a.type==='ult'&&window.UltFX){if(players[u.uid])await sleep(500);
    await ultFx(u,targets,function(i){damage(u,targets[i],mult,r1.zone,BLOCK[r2.zone]);if(kind==='row'&&targets[i].alive){targets[i].slow=true;refresh(targets[i])}});await sleep(500);return}
  if(players[u.uid])await sleep(a.type==='ult'?700:420);
  if(a.type==='ult')await elemUlt(u,targets);
  if(e.range!=='melee'||a.type==='ult'){await Promise.all(targets.map(function(t){return elemShot(u,t)}))}else await sleep(220);
  if(kind==='all'||kind==='row')flash(e.color);
  await sleep(60); // 命中停頓
  if(a.type==='normal'&&kind==='row'&&targets.length>1)mult=.5;
  targets.forEach(function(t){damage(u,t,mult,r1.zone,BLOCK[r2.zone])});
  if(a.type==='ult'&&kind==='row')targets.forEach(function(t){if(t.alive){t.slow=true;refresh(t)}});
  if(a.type==='normal'&&u.el==='wood'){var al=alive(u.side).filter(function(x){return x!==u}).sort(function(x,y){return x.hp/x.max-y.hp/y.max})[0];if(al&&al.hp<al.max)setTimeout(function(){heal(u,al,WOOD_P)},350)}
  await sleep(650);
}

reset();
cloudSync(P,function(){reset()});
})();
</script>

<script>/* 木系是精靈：圖片比其他系小一號（底部對齊） */(function(){if(!window.STAND)return;var W=[STAND.wood1,STAND.wood2,STAND.wood3];var st=document.createElement('style');st.textContent='img.el-wood{scale:.8;transform-origin:50% 100%}';document.head.appendChild(st);function mark(r){if(!r||!r.querySelectorAll)return;r.querySelectorAll('img').forEach(function(i){if(!i.classList.contains('el-wood')&&W.indexOf(i.getAttribute('src'))>=0&&!i.closest('.spr'))i.classList.add('el-wood')})}new MutationObserver(function(ms){ms.forEach(function(m){m.addedNodes.forEach(function(n){if(n.nodeType===1)mark(n.tagName==='IMG'?n.parentNode:n)})})}).observe(document.body,{childList:true,subtree:true});mark(document)})();</script>
