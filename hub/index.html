<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>辛巴王的遊戲大廳</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style id="hub-style">
:root{
  --bg:#f2f2f7;--card:#fff;--card2:#f2f2f7;--fill:rgba(118,118,128,.12);--fill2:rgba(120,120,128,.16);
  --label:#000;--label2:rgba(60,60,67,.6);--label3:rgba(60,60,67,.3);--sep:rgba(60,60,67,.18);
  --blue:#007aff;--red:#ff3b30;--green:#34c759;--orange:#ff9500;--bar:rgba(249,249,249,.82);--shadow:0 10px 30px rgba(0,0,0,.12);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#000;--card:#1c1c1e;--card2:#2c2c2e;--fill:rgba(118,118,128,.24);--fill2:rgba(120,120,128,.32);
  --label:#fff;--label2:rgba(235,235,245,.6);--label3:rgba(235,235,245,.3);--sep:rgba(84,84,88,.6);
  --blue:#0a84ff;--red:#ff453a;--green:#30d158;--orange:#ff9f0a;--bar:rgba(22,22,24,.8);--shadow:0 10px 30px rgba(0,0,0,.6);
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--label);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang TC","Noto Sans TC","Helvetica Neue",sans-serif;-webkit-font-smoothing:antialiased;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
a{color:inherit;text-decoration:none}
.page{max-width:760px;margin:0 auto;padding:0 0 120px}

/* nav bar */
.nav{position:sticky;top:0;z-index:30;height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;
  background:transparent;transition:background .2s,border-color .2s;border-bottom:.5px solid transparent}
.nav.solid{background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-bottom-color:var(--sep)}
.nav .mid{position:absolute;left:50%;transform:translateX(-50%);font-weight:600;font-size:17px;opacity:0;transition:opacity .2s}
.nav.solid .mid{opacity:1}
.navbtn{color:var(--blue);font-size:17px;display:flex;align-items:center;gap:4px;min-height:44px}
.navbtn.b{font-weight:600}
.navright{display:flex;gap:18px;align-items:center}
.plus{font-size:28px;font-weight:300;line-height:1}

.head{padding:2px 20px 8px}
.date{font-size:13px;font-weight:600;color:var(--label2);text-transform:uppercase;letter-spacing:.02em}
.big{font-size:34px;font-weight:700;letter-spacing:.01em;line-height:1.2;margin:2px 0 0}

.searchwrap{padding:6px 16px 10px}
.search{display:flex;align-items:center;gap:6px;background:var(--fill);border-radius:10px;height:36px;padding:0 8px;color:var(--label2)}
.search svg{flex:none}
.search input{flex:1;background:transparent;border:0;outline:0;font-size:17px;color:var(--label);min-width:0}
.search input::placeholder{color:var(--label2)}

.pills{display:flex;gap:8px;overflow-x:auto;padding:2px 16px 6px;scrollbar-width:none}
.pills::-webkit-scrollbar{display:none}
.pill{flex:none;height:32px;padding:0 14px;border-radius:16px;background:var(--fill);font-size:15px;font-weight:500;color:var(--label)}
.pill.on{background:var(--blue);color:#fff;font-weight:600}

.sechead{display:flex;align-items:baseline;justify-content:space-between;padding:22px 20px 8px}
.sechead h2{margin:0;font-size:22px;font-weight:700}
.sechead span{color:var(--label2);font-size:15px}

/* featured carousel */
.carousel{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 20px 10px;scrollbar-width:none;scroll-padding:0 20px}
.carousel::-webkit-scrollbar{display:none}
.today{flex:none;width:min(82vw,330px);height:210px;border-radius:20px;scroll-snap-align:start;position:relative;overflow:hidden;color:#fff;box-shadow:var(--shadow);display:block;transition:transform .2s}
.today:active{transform:scale(.97)}
.today .emo{position:absolute;right:16px;top:12px;font-size:84px;font-weight:900;color:rgba(255,255,255,.22);letter-spacing:-.04em;line-height:1}
.today .txt{position:absolute;left:0;right:0;bottom:0;padding:16px 18px;background:linear-gradient(transparent,rgba(0,0,0,.45))}
.today .k{font-size:12px;font-weight:700;opacity:.8;text-transform:uppercase;letter-spacing:.04em}
.today .t{font-size:24px;font-weight:800;line-height:1.15;margin-top:2px}
.today .d{font-size:13px;opacity:.88;margin-top:4px;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}

/* inset grouped list */
.group{margin:0 16px;background:var(--card);border-radius:12px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:10px 16px;min-height:80px;position:relative;background:var(--card);touch-action:pan-y}
a.row:active,.row.tap:active{background:var(--fill)}
.row+.row::before{content:"";position:absolute;top:0;right:0;left:88px;border-top:.5px solid var(--sep)}
.icon{flex:none;width:60px;height:60px;border-radius:13.5px;display:flex;align-items:center;justify-content:center;font-size:27px;color:#fff;font-weight:800;letter-spacing:-.02em;text-shadow:0 1px 2px rgba(0,0,0,.18);
  box-shadow:inset 0 0 0 .5px rgba(0,0,0,.08)}
.info{flex:1;min-width:0}
.info .t{font-size:17px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.info .d{font-size:13px;color:var(--label2);margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.35}
.info .badge{display:inline-block;font-size:11px;font-weight:600;color:var(--orange);margin-left:6px;vertical-align:2px}
.get{flex:none;height:30px;min-width:72px;padding:0 14px;border-radius:15px;background:var(--fill);color:var(--blue);font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center}

/* edit row */
.minus{flex:none;width:22px;height:22px;border-radius:50%;background:var(--red);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px;line-height:1}
.minus i{display:block;width:10px;height:2px;background:#fff;border-radius:1px}
.handle{flex:none;width:30px;height:44px;display:flex;flex-direction:column;justify-content:center;gap:4px;align-items:center;cursor:grab;touch-action:none}
.handle i{display:block;width:18px;height:2px;border-radius:1px;background:var(--label3)}
.row.dragging{z-index:5;box-shadow:0 8px 24px rgba(0,0,0,.25);border-radius:12px;transform:scale(1.02)}
.row.hid .icon,.row.hid .info{opacity:.4}
.delbtn{flex:none;align-self:stretch;margin:-10px -16px -10px 0;width:0;overflow:hidden;background:var(--red);color:#fff;font-size:15px;font-weight:600;transition:width .2s;display:flex;align-items:center;justify-content:center;white-space:nowrap}
.row.confirmdel .delbtn{width:80px}
.row.confirmdel .handle{display:none}
.star{flex:none;color:var(--orange);font-size:13px}

.note{color:var(--label2);font-size:13px;padding:8px 32px 0;line-height:1.4}
.empty{text-align:center;color:var(--label2);padding:60px 20px;font-size:15px}
.foot{text-align:center;color:var(--label3);font-size:12px;margin-top:34px}

/* bottom toolbar (edit mode) */
.toolbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);
  border-top:.5px solid var(--sep);padding:10px 20px calc(10px + env(safe-area-inset-bottom));display:flex;align-items:center;justify-content:space-between}
.toolbar .navbtn{min-height:30px}
.toolbar .status{font-size:12px;color:var(--label2)}
.toolbar .status.dirty{color:var(--orange);font-weight:600}
.navbtn:disabled{color:var(--label3)}

/* sheet */
.dim{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.4);display:flex;align-items:flex-end;justify-content:center;animation:fade .25s}
.sheet{width:100%;max-width:560px;max-height:94vh;background:var(--bg);border-radius:12px 12px 0 0;overflow:auto;animation:up .32s cubic-bezier(.2,.9,.3,1);padding-bottom:calc(24px + env(safe-area-inset-bottom))}
@media(min-width:640px){.dim{align-items:center}.sheet{border-radius:14px}}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.grab{width:36px;height:5px;border-radius:3px;background:var(--label3);margin:6px auto 0}
.sheetnav{display:flex;align-items:center;justify-content:space-between;padding:0 16px;height:50px;position:relative}
.sheetnav .mid{position:absolute;left:50%;transform:translateX(-50%);font-weight:600;font-size:17px}
.prev{display:flex;flex-direction:column;align-items:center;padding:10px 0 18px;gap:8px}
.prev .icon{width:84px;height:84px;font-size:36px;border-radius:19px}
.icon.two{font-size:21px}
.icon svg,.dicon svg{width:84%;height:84%;display:block;filter:drop-shadow(0 1px 1px rgba(0,0,0,.18))}
.today .pxart{position:absolute;right:14px;top:14px;width:118px;height:118px;filter:drop-shadow(0 6px 10px rgba(0,0,0,.3))}
.today .pxart svg{width:100%;height:100%;display:block}.prev .icon.two{font-size:28px}.dicon.two{font-size:40px}
/* detail page */
.dhead{display:flex;gap:16px;padding:8px 20px 18px;align-items:flex-start}
.dicon{flex:none;width:118px;height:118px;border-radius:26px;display:flex;align-items:center;justify-content:center;font-size:54px;font-weight:800;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.2);box-shadow:inset 0 0 0 .5px rgba(0,0,0,.08)}
.dmeta{flex:1;min-width:0;display:flex;flex-direction:column;min-height:118px}
.dmeta h1{margin:0;font-size:22px;font-weight:700;line-height:1.25}
.dmeta .c{color:var(--label2);font-size:15px;margin-top:3px}
.dmeta .acts{margin-top:auto;display:flex;align-items:center;gap:10px}
.openbtn{height:30px;padding:0 20px;border-radius:15px;background:var(--blue);color:#fff;font-weight:700;font-size:15px;display:inline-flex;align-items:center}
.dstats{display:flex;margin:0 20px;border-top:.5px solid var(--sep);border-bottom:.5px solid var(--sep);padding:10px 0}
.dstats div{flex:1;text-align:center;font-size:11px;color:var(--label2);text-transform:uppercase}
.dstats div+div{border-left:.5px solid var(--sep)}
.dstats b{display:block;font-size:17px;color:var(--label2);font-weight:700;margin-top:3px;text-transform:none}
.dsec{padding:22px 20px 0}
.dsec h3{margin:0 0 8px;font-size:22px;font-weight:700}
.dsec p{margin:0;font-size:16px;line-height:1.65;color:var(--label)}
.lede{font-size:17px!important;line-height:1.6!important}
.flist{margin:0;padding:0;list-style:none;background:var(--card);border-radius:12px;overflow:hidden}
.flist li{position:relative;padding:12px 16px 12px 40px;font-size:15.5px;line-height:1.5}
.flist li+li::before{content:"";position:absolute;top:0;right:0;left:40px;border-top:.5px solid var(--sep)}
.flist li::after{content:"";position:absolute;left:18px;top:20px;width:7px;height:7px;border-radius:50%;background:var(--blue)}
.steps{margin:0;padding:0;list-style:none;counter-reset:st}
.steps li{counter-increment:st;position:relative;padding:4px 0 14px 44px;font-size:15.5px;line-height:1.5;min-height:30px}
.steps li::before{content:counter(st);position:absolute;left:0;top:0;width:30px;height:30px;border-radius:50%;background:var(--fill);color:var(--blue);font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center}
.steps li:not(:last-child)::after{content:"";position:absolute;left:14.5px;top:34px;bottom:2px;width:1px;background:var(--sep)}
.info2{margin:0;background:var(--card);border-radius:12px;overflow:hidden}
.info2 div{display:flex;justify-content:space-between;padding:12px 16px;font-size:15px;position:relative;gap:16px}
.info2 div+div::before{content:"";position:absolute;top:0;right:0;left:16px;border-top:.5px solid var(--sep)}
.info2 span{color:var(--label2);flex:none}
.info2 a{color:var(--blue);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slide{animation:slidein .32s cubic-bezier(.2,.9,.3,1)}
@keyframes slidein{from{transform:translateX(30%);opacity:.4}to{transform:none;opacity:1}}
.back{color:var(--blue);font-size:17px;display:flex;align-items:center;gap:2px;min-height:44px}
.back svg{margin-left:-6px}
.frow.tall{align-items:flex-start}.frow.tall label{padding-top:11px}
.ghint{font-size:13px;color:var(--label2);padding:6px 32px 0}
/* screenshots */
.gallery{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 20px 6px;scrollbar-width:none;scroll-padding:0 20px}
.gallery::-webkit-scrollbar{display:none}
.gallery img{flex:none;height:320px;max-width:86vw;object-fit:cover;border-radius:18px;scroll-snap-align:start;border:.5px solid var(--sep);background:var(--card2);cursor:zoom-in}
.gallery.land img{height:200px}
.shots-edit{display:flex;gap:10px;overflow-x:auto;padding:12px 16px;scrollbar-width:none;align-items:center}
.shots-edit::-webkit-scrollbar{display:none}
.shot{position:relative;flex:none;padding:6px 6px 0 0}
.shot img{display:block;height:110px;border-radius:10px;border:.5px solid var(--sep)}
.shot .x{position:absolute;top:0;right:0;width:24px;height:24px;border-radius:50%;background:var(--red);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 2px var(--card)}
.shot .x i{display:block;width:10px;height:2px;background:#fff;border-radius:1px}
.shot .l{position:absolute;bottom:4px;left:4px;font-size:10px;background:rgba(0,0,0,.55);color:#fff;padding:1px 6px;border-radius:6px}
.addshot{flex:none;width:84px;height:110px;margin-top:6px;border-radius:10px;border:1.5px dashed var(--label3);color:var(--blue);font-size:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer}
.addshot b{font-size:26px;font-weight:300;line-height:1}
.addshot input{display:none}
.today.photo .emo{display:none}
.today.photo .txt{background:linear-gradient(transparent,rgba(0,0,0,.75))}
.viewer{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.92);display:flex;align-items:center;justify-content:center;animation:fade .2s}
.viewer img{max-width:96vw;max-height:90vh;border-radius:12px}
.viewer .close{position:absolute;top:14px;right:16px;color:#fff;font-size:17px;font-weight:600;padding:8px}
.glabel{font-size:13px;color:var(--label2);padding:18px 32px 6px;text-transform:uppercase}
.fgroup{margin:0 16px;background:var(--card);border-radius:12px;overflow:hidden}
.frow{display:flex;align-items:center;min-height:44px;padding:0 16px;position:relative;gap:12px}
.frow+.frow::before{content:"";position:absolute;top:0;right:0;left:16px;border-top:.5px solid var(--sep)}
.frow label{flex:none;width:80px;font-size:17px}
.frow input,.frow textarea{flex:1;min-width:0;border:0;outline:0;background:transparent;font-size:17px;padding:11px 0;color:var(--label)}
.frow textarea{resize:none;line-height:1.35}
.frow input::placeholder,.frow textarea::placeholder{color:var(--label3)}
.frow .grow{flex:1;font-size:17px}
.swrow{display:flex;gap:10px;padding:12px 16px;flex-wrap:wrap}
.sw{width:30px;height:30px;border-radius:50%;box-shadow:0 0 0 2px var(--card)}
.sw.on{box-shadow:0 0 0 2px var(--card),0 0 0 4px var(--label2)}
.catopts{display:flex;gap:8px;overflow-x:auto;padding:10px 16px;scrollbar-width:none}
.catopts::-webkit-scrollbar{display:none}
.catopts .pill{height:30px;font-size:14px}
/* switch */
.switch{position:relative;width:51px;height:31px;flex:none}
.switch input{opacity:0;position:absolute;inset:0;margin:0;cursor:pointer;z-index:1}
.switch span{position:absolute;inset:0;border-radius:16px;background:var(--fill2);transition:background .2s}
.switch span::after{content:"";position:absolute;left:2px;top:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.15),0 1px 1px rgba(0,0,0,.16);transition:transform .2s}
.switch input:checked+span{background:var(--green)}
.switch input:checked+span::after{transform:translateX(20px)}
.redrow{color:var(--red);justify-content:center;font-size:17px;width:100%}
.bluerow{color:var(--blue);font-size:17px}

/* alert */
.alert{width:270px;background:var(--bar);-webkit-backdrop-filter:blur(30px);backdrop-filter:blur(30px);border-radius:14px;overflow:hidden;text-align:center;align-self:center;animation:pop .2s}
@keyframes pop{from{transform:scale(1.15);opacity:0}to{transform:none;opacity:1}}
.alert .a-t{font-weight:600;font-size:17px;padding:19px 16px 2px}
.alert .a-m{font-size:13px;padding:0 16px 19px;color:var(--label)}
.alert .a-b{display:flex;border-top:.5px solid var(--sep)}
.alert .a-b button{flex:1;height:44px;color:var(--blue);font-size:17px}
.alert .a-b button+button{border-left:.5px solid var(--sep)}
.alert .a-b .b{font-weight:600}
.alert .a-b .r{color:var(--red)}

/* HUD */
.hud{position:fixed;left:50%;top:42%;transform:translate(-50%,-50%);z-index:70;min-width:150px;padding:18px 22px;border-radius:14px;text-align:center;
  background:var(--bar);-webkit-backdrop-filter:blur(30px);backdrop-filter:blur(30px);box-shadow:var(--shadow);font-size:15px;font-weight:600;animation:pop .2s;pointer-events:none}
.hud .ck{display:flex;justify-content:center;margin-bottom:6px;color:var(--label)}

/* 聖誕裝飾 */
.lights{display:block;width:100%;height:22px;margin-top:-4px}
.lights .la{animation:twk 2.4s ease-in-out infinite}
.lights .lb{animation:twk 2.4s ease-in-out infinite;animation-delay:1.2s}
@keyframes twk{0%,100%{opacity:1}50%{opacity:.35}}
.scene{display:block;width:288px;max-width:calc(100% - 32px);height:auto;margin:6px 16px 4px auto;shape-rendering:crispEdges}
.snow{position:fixed;inset:0;z-index:25;pointer-events:none;overflow:hidden}
.snow i{position:absolute;top:-8px;background:#fff;box-shadow:0 0 0 1px rgba(110,150,190,.55);animation:snowfall linear infinite}
@keyframes snowfall{0%{transform:translate3d(0,-10px,0)}50%{transform:translate3d(14px,52vh,0)}100%{transform:translate3d(-6px,106vh,0)}}

/* 辛巴住在大廳 */
.simba-yard{position:fixed;left:0;right:0;bottom:0;height:150px;z-index:20;pointer-events:none}
.simba-cv{position:absolute;left:0;bottom:0;display:block;pointer-events:none}
.simba-hit{position:absolute;pointer-events:auto;background:transparent;border-radius:30px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.simba-hit:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.simba-go{position:absolute;right:12px;bottom:28px;pointer-events:auto;font-size:13px;font-weight:600;color:#fff;background:rgba(30,20,10,.62);padding:7px 12px;border-radius:14px;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.simba-go:active{transform:scale(.96)}
@media (prefers-reduced-motion:reduce){.snow{display:none}.lights .la,.lights .lb{animation:none}}
.icon img,.dicon img{width:84%;height:84%;object-fit:contain;display:block}.pxart img{width:100%;height:100%;object-fit:contain;display:block}
</style>
</head>

<div id="root"></div>
<script id="hub-data" type="application/json">{"version":2,"categories":["校園人生","劇情冒險","動作街機","派對問答","養成陪伴","理化學習","運動體育","模擬經營","工具"],"games":[{"id":"g28","title":"專案工廠","url":"https://claude.ai/artifact/5duJPztR9UVYEwVMdjNDt2","cat":"模擬經營","icon":"工","color":"#8e8e93","desc":"像素工廠 RPG：選擇專案規模，評估哪些部門可以略過，在夜間廠區派工、驗收、退件、出貨。","motive":"我平常用一套 12 個部門的工作流和 AI 做專案。第一版做成「專案大樓」，但玩起來不夠像遊戲。我想要更像最近很紅的半導體遊戲、工廠模擬那種感覺：看著產線運轉，親手決定派工和品管。","make":"從《專案大樓》重做而來。主角是專案負責人，管理 12 個部門，每個部門會給出一段 Prompt，可以交給其他 AI 或 Claude 去做。視覺朝商業遊戲的水準打磨。","features":"選擇專案規模，系統依需求評估可略過的部門\n夜間像素廠區，各部門就是一條條產線\n派工、驗收、退件、出貨的完整流程\n每個部門提供可直接使用的 Prompt","howto":"選擇專案和規模\n看系統建議，決定哪些部門要開工\n依序派工，把 Prompt 交給 AI 產出\n驗收成果，不合格就退件，全部通過就出貨","pin":false},{"id":"g01","title":"今天也要平安下班","url":"https://claude.ai/artifact/AWwoUVfR7KFTQd7ateyNfb","cat":"校園人生","icon":"平安","color":"#5856d6","desc":"一位國中老師的生存日常，荒謬、好笑，也有點心酸。系列入口，收著老師題材的幾款遊戲。","motive":"教書這麼多年，最常聽到同事說的一句話是「今天也要平安下班」。這句話聽起來像玩笑，背後卻是現場老師的真實處境：一個處理不好的衝突、一通情緒激動的家長電話，都可能把一個認真的老師送進校事會議。我想用黑色喜劇的方式把這些荒謬攤開來，不是為了抱怨，而是向所有還在認真教書的老師致敬，也想說一件事：家長、老師、學生之間需要的是溝通與合作，是「共好」，而不是拿制度互相傷害。","make":"一開始是一款可以在校園地圖上四處走動的 roguelike，和 Claude 在對話中一版一版調整出來。後來內容越長越多，就把這個網址改成系列的入口頁，把主線玩法獨立成《笑鼠會議》，再加上輔導老師視角的《輔導室：今天也不能倒下》。整個系列都是單一 HTML 網頁，直接用 Claude Artifact 發佈。","features":"系列入口：一個網址就能進入老師題材的各款遊戲\n黑色幽默包裝真實的校園處境，笑完會想一想\n從導師與輔導老師不同角色看同一間學校","howto":"打開後在入口選擇想玩的遊戲\n《笑鼠會議》：扮演導師撐過一天又一天\n《輔導室》：扮演輔導老師，從早上八點撐到下午五點","pin":true},{"id":"g02","title":"笑鼠會議","url":"https://claude.ai/artifact/19FYNLVNApGcEUS7i4A8pW","cat":"校園人生","icon":"笑鼠","color":"#ff2d55","desc":"黑色幽默的教師生存遊戲：在校園裡跑來跑去處理一件件案子，想辦法不要被送進「笑鼠會議」。","motive":"「笑鼠會議」是校事會議的諧音。這款是《今天也要平安下班》主線的大改版，我希望它不只是老師之間的苦笑，而是一款真的好玩、能拿出去給一般玩家玩的遊戲。所以遊戲預設英文、不點名任何地方，讓不同背景的人都能代入一位努力想做對事情的老師。","make":"從《今天也要平安下班》的 roguelike 原型拆出來重做。案件內容經過多輪審查與刪修（曾一次整理出 41 件刪除案例逐一勾選要不要留），也試做過像素版與第一人稱版本，玩過之後決定回到原本的風格繼續打磨。介面刻意不使用表情符號，目標是一路打磨到有商業遊戲的水準。也曾根據實況主「死掉重來很挫折」的回饋，規劃無限命、三條命、惡夢三種難度。","features":"可以自由走動的校園地圖，事件就發生在你走到的地方\n每天都有不同的學生、家長與行政狀況，處理方式會影響後果\n黑色喜劇的語氣，荒謬裡藏著真實的教育現場\n依玩家回饋設計難度，新手和硬派玩家都能玩","howto":"在校園中移動，找到正在發生的事件\n選擇你的處理方式：介入、溝通、通報或先觀察\n撐過今天的課表與突發狀況，平安下班就進入下一天\n處理失當累積太多，就會被送進笑鼠會議","pin":false},{"id":"g03","title":"老師有法度","url":"https://claude.ai/artifact/5nuQeCJ9jfJYPGotPn9DJj","cat":"校園人生","icon":"法","color":"#007aff","desc":"教師輔導與管教學生模擬器：拿著《輔導管教辦法》給的武器卡，在法律紅綠燈下處理真實的校園情境。","motive":"副標題是「教師輔導與管教學生模擬器」，開場寫著：「離職不殉職，僅以此遊戲，紀念早逝的生命！」很多老師遇到狀況，第一個反應是交給學務處或輔導室，因為不知道自己依法能做什麼、做了會不會出事。其實《輔導管教辦法》給了老師不少正當的工具。我想把這些工具變成老師手上的「武器」，讓老師能主動、合法、有效地引導學生，也保護自己。","make":"前身叫《教室危機處理室》，後來改名《老師有法度》。決定不接 AI、可離線遊玩，所有情境與判斷都寫在遊戲裡。畫面走台灣校園漫畫風，角色與場景圖用 ChatGPT 依提示詞生成後再整合進來，發佈為 Claude Artifact。","features":"武器卡玩法：每張卡是一項依法可用的輔導管教措施\n法律紅綠燈：每個做法都會即時亮燈，告訴你合不合法\n多位專家觀點分析同一個情境，看見不同的處理角度\n話術檢查：你對學生、家長說的話會不會出問題\n題材涵蓋電子煙與毒品、霸凌（含網路霸凌）、跨班衝突，以及亞斯、自閉、過動、情障、憂鬱等特殊需求學生的處理流程","howto":"選一個情境進入，先讀懂事件經過\n從手上的武器卡挑出你要採取的措施\n看紅綠燈與專家分析，修正你的做法\n完成情境後回顧：哪一步做對、哪一步可以更好","pin":true},{"id":"g04","title":"輔導室：今天也不能倒下","url":"https://claude.ai/artifact/WfuvFPHcU2RzPgNmfuEBrX","cat":"校園人生","icon":"輔","color":"#00c7be","desc":"像素 RPG：扮演國中輔導老師，從早上八點撐到下午五點，在業務、個案與突發事件之間找到自己的平衡。","motive":"輔導老師常被外界想像成「陪學生聊天」，實際上每天被大量的行政業務和上級交辦淹沒，好不容易排好的計畫又不斷被緊急個案打斷。我想讓玩家體會這種處境，也想說幾件事：要學會說不、學會和同事合作；一隻狗、幾句同事間的閒聊，這些小小的快樂能撐住一個人；工作做不完不會死，不完美也沒關係。","make":"用我自己寫的主提示詞開始，先做出能玩的版本，覺得好玩再擴充內容。之後一路往真正的 RPG 推進：加入音樂與音效、讓 NPC 走進走出而不是憑空出現、加入可使用的道具等等。單一 HTML，以 Claude Artifact 發佈。","features":"八點到五點的一天，時間會一直往前走\nNPC 會走進輔導室、也會離開，場景是活的\n可以用的道具：書、水、抽屜和冰箱裡的點心飲料\n坐下或躺下恢復體力，真的手機和桌上電話會響\n在電腦上打字做紀錄，還有清楚的主線任務箭頭\n隨機發生的學生事件，以及和同事的大量對話","howto":"跟著主線箭頭處理今天排定的工作\n有學生或電話進來時，決定現在處理還是先排後面\n體力和心情變低時，喝水、吃點心、坐下來休息\n撐到下午五點，看看今天做完了什麼、放過了什麼","pin":false},{"id":"g06","title":"記得回家","url":"https://claude.ai/artifact/Q8RcK2KidbQdMxDFfeNPjW","cat":"劇情冒險","icon":"家","color":"#a2845e","desc":"像素敘事 RPG，取材自我自己家裡的故事：一段想去理解爸爸的旅程。","motive":"這是最私人的一款。我想透過做這個遊戲，去理解、去認識爸爸那一路經歷過的事情。很多話當年沒有機會問，很多處境當時也看不懂；把它做成一個可以走進去的世界，是我能用的方式。","make":"和 Claude 一起把家裡的經歷轉成像素 RPG，美術另外整理了一份提示詞清單交給 ChatGPT 生成。我很堅持一件事：它不能只是一張張文字卡片，也不能是一部純看故事的小電影，玩家要真的走進那個年代、那個家，自己去發現。","features":"取材自真實的家庭經歷\n像素風的場景與人物\n以探索和互動推進故事，而不是一路點文字卡","howto":"在場景中移動，和人物說話、查看物品\n跟著線索把故事一段段拼起來\n走到最後，記得回家","pin":true},{"id":"g07","title":"異變法則","url":"https://claude.ai/artifact/N1tgiim5zjirQizWM3ogbC","cat":"動作街機","icon":"異","color":"#5856d6","desc":"世界失控，你來改寫規則！翻轉重力閃避障礙，用時間裂隙與空間複寫撐過越來越瘋狂的關卡。","motive":"大部分跑酷遊戲的規則是固定的，我想做一款反過來的：世界的規則會失控，玩家要靠改寫規則來活下去。重力可以翻轉、時間可以裂開、空間可以複寫，每一種能力都是一種解題方式。","make":"原本是一個半成品頁面，請 Claude 修好後擴充成真正可玩的遊戲。因為主要在手機上玩，刻意把遊戲畫面放到最大、物件做得清楚，把說明文字減到最少。另外做了一張 Facebook 推薦圖來宣傳。","features":"重力反轉：一點就上下顛倒，在天花板和地板之間切換\n時間裂隙、空間複寫等能力，讓同一個障礙有不同解法\n手機優先：大畫面、清楚的物件、單手可玩\n節奏越來越快，考驗反應也考驗判斷","howto":"點擊畫面翻轉重力，閃過迎面而來的障礙\n能力準備好時，在關鍵時刻使用來改寫規則\n撐得越久分數越高，挑戰自己的紀錄","pin":true},{"id":"g08","title":"貪食蛇：危機食刻","url":"https://claude.ai/artifact/THShSBEoRUYk2E6Gsjtzeo","cat":"動作街機","icon":"蛇","color":"#34c759","desc":"霓虹街機風的貪食蛇：黃金獵食、能量核心、會先預告的危機封鎖，三種操作、三種難度。","motive":"貪食蛇是很多人第一款玩到的電子遊戲。我想把它做成在手機上也好操作、又有新鮮挑戰的版本，同時拿它來實際跑一次我的「部門工作流」，看看一款小遊戲從需求到發布要經過哪些步驟。","make":"依照我的部門工作流逐步產出：需求分析、企劃、視覺美術、核心邏輯、介面開發、測試除錯、整合發布。限制是單一 HTML、手機優先、沒有後端，也能部署到 Google Apps Script。實際在手機上玩時發現畫面上的方向鍵很難按，所以再加做了滑動與轉彎兩種操作。","features":"三種操作：滑動、左右轉彎、方向鍵，選你順手的\n黃金獵食與能量核心，讓吃東西不只是變長\n危機封鎖會先預告，給你反應時間\n三種難度，最高分記在本機","howto":"選擇操作方式與難度\n控制蛇去吃食物、搶黃金獵物\n看到封鎖預告時提早繞開\n撞到牆或自己就結束，挑戰最高分","pin":false},{"id":"g09","title":"貪食蛇：立方世界","url":"https://claude.ai/artifact/4ywaLBn5jxSpyiN2Q7Wyc8","cat":"動作街機","icon":"方","color":"#30b0c7","desc":"在立方體表面爬行的貪食蛇：限時倒數、連擊倍率、藏在背面的黃金星，還有會追你的紅色獵手。","motive":"做完平面的《危機食刻》，又剛好在做魔術方塊的 CUBE LAB，就想：如果蛇爬的不是一張平面，而是一顆方塊的六個面呢？轉個彎就翻到另一面，看不到的背面藏著寶物，也藏著危險。","make":"以《危機食刻》為基礎，和 Claude 做成 3D 立方體表面的試玩原型，單一網頁，發佈為 Claude Artifact。","features":"蛇在立方體六個面上移動，越過邊緣就翻到下一面\n限時倒數加上連擊倍率，吃得越快分數越高\n黃金星藏在背面，要繞過去才拿得到\n紅色獵手會追著你跑，用身體把它圍住就能抓到","howto":"控制蛇在方塊表面移動，鏡頭會跟著翻面\n在倒數結束前盡量吃、維持連擊\n找出藏在背面的黃金星\n被紅色獵手追時，反過來用身體把它圍起來","pin":false},{"id":"g10","title":"銀河雷射防禦戰","url":"https://claude.ai/artifact/EKJAEkeEpxee9JAzMU8vRy","cat":"動作街機","icon":"雷","color":"#ff9500","desc":"太空雷射射擊：守住銀河防線，擊落一波波來襲的目標。","motive":"我想要一款上手快、節奏明快的射擊遊戲，讓學生下課幾分鐘就能來一局，也能互相比分數。","make":"和 Claude 對話做成單一網頁的街機射擊遊戲，深色太空風格介面，發佈為 Claude Artifact。","features":"街機風格的太空射擊\n一波比一波強的敵人\n短時間一局，適合下課玩","howto":"移動砲台瞄準來襲目標\n發射雷射擊落它們，不要讓防線被突破\n撐得越久分數越高","pin":false},{"id":"g12","title":"問A答B搶答大作戰","url":"https://claude.ai/artifact/UTsmaTE8HRfra6EcFxMDfB","cat":"派對問答","icon":"反","color":"#ffcc00","desc":"洋洋 vs 安安！反著答的搶答遊戲：每一題都要選錯的那個答案，1.5 秒內決定。","motive":"小朋友玩搶答，最直覺的反應就是選對的答案。如果規定「要選錯的」呢？大腦得先想出正確答案、再壓抑它、再選另一個，這比答對還難，也更好笑。我想做一款大人小孩都能一起玩、一起笑的遊戲。","make":"用我的部門工作流規劃：題庫 100 題、難度設定在五歲小孩，每局隨機 20 題。角色是原創的 Q 版洋洋和安安。答題時間試過 3 秒、1 秒，最後定在 1.5 秒，剛好是「來得及想、又來不及想清楚」的長度。","features":"反向規則：每題都要選錯的答案\n每局從 100 題中隨機抽 20 題，每次玩都不一樣\n每題只有 1.5 秒，越想越容易答「對」\n原創 Q 版角色洋洋和安安","howto":"選擇你要當洋洋還是安安\n題目出現後，在 1.5 秒內選出錯的那個答案\n選到正確答案反而扣分\n20 題結束後看看誰比較會「答錯」","pin":true},{"id":"g52","title":"辛巴的後院","url":"https://claude.ai/artifact/CGARorzduDZ9UAdmwNZf54","cat":"養成陪伴","icon":"巴","color":"#fbe7b5","desc":"辛巴王本人的黃金獵犬辛巴：在後院走路、奔跑、吃飯、喝水、睡覺、接球，還會翻肚子給你摸。","motive":"辛巴是我的黃金獵犬，也是「辛巴王」這個名字的由來。我想讓牠住進網頁裡，隨時打開都能陪牠玩一下。","make":"和 Claude 一起做遊戲系統，辛巴的各種動作由 ChatGPT 依提示詞畫成像素動畫，再整合進後院。","features":"走路、奔跑、吃飯、喝水、睡覺都有專屬動畫\n倒飼料、加水、丟球、給點心\n坐下、握手、轉圈、鞠躬、汪汪、跳跳、翻肚七種指令\n日夜跟著真實時間變化，進度存在手機裡","howto":"點地面，辛巴就會走過去，點遠一點牠會用跑的\n用下方按鈕餵牠、陪牠玩\n連摸牠四下，牠會翻肚子給你摸\n晚上牠會自己回狗屋旁睡覺","pin":true},{"id":"g13","title":"孵化吧！理化獸","url":"https://claude.ai/artifact/1wzFLu2w7xFQAwK7tpRxhn","cat":"養成陪伴","icon":"獸","color":"#ff3b30","desc":"班級版的理化怪獸養成：每天答題孵蛋、練功、進化，再和同學組隊上白板對戰。","motive":"理化要練題，但「每天寫十題」對學生來說只是作業。如果每一題都是在餵養自己的怪獸呢？我想讓學生為了自己的理化獸主動回家練習，再把練出來的實力帶到課堂上的白板對戰，讓全班一起熱血起來。","make":"以我的出題系統與歷屆會考題庫為核心，和 Claude 一步步設計：先定對戰系統，再定每隻理化獸的能力與定位。火屬性改成我自己設計的炎鷹獸像素角色（火羽雛、炎翼鳥、炎鷹獸三階進化，六個動作的動畫），其他角色與場景美術由 ChatGPT 依提示詞繪製後整合。學校伺服器版本後來改為《對戰吧！理化獸》，用 Firebase 加 GitHub 發佈。","features":"每天 10 題訓練，答對累積經驗值，孵化並進化你的理化獸\n土、水、電、火、木五種屬性互相剋制，各有坦克、平衡、速攻、範圍、治療的定位\n日式陣形 RPG 對戰：前排、中排、後排各司其職，3v3 或 5v5\n十字計時條：橫向球決定攻擊力道，縱向球決定防禦，正中間最強\n答對題目會充能，集滿三格放出必殺技\n老師可以在電子白板上點選學生開戰，全班一起看","howto":"用班級代碼、座號登入，領取你的理化獸\n每天完成 10 題訓練，讓牠成長、進化\n對戰時選目標與招式，抓準十字計時條的時機\n答題充能，在關鍵回合放出必殺技","pin":true},{"id":"g14","title":"口袋史萊姆","url":"https://claude.ai/artifact/D8zfQSyrTHNci2CgPi3Qi7","cat":"養成陪伴","icon":"史","color":"#34c759","desc":"放在手機裡養的小史萊姆，會陪著你、隨著你的照顧慢慢改變。","motive":"我一直想做一個「數位生命」：一隻像素史萊姆，有自己的個性和記憶，會隨著主人的樣子長大、變形。口袋史萊姆是這個想法的輕量版，讓牠先住進手機裡，隨時打開就能看到牠。","make":"和 Claude 對話做成單一網頁，像素風格，發佈為 Claude Artifact。","features":"像素風的小史萊姆\n打開手機就能照顧、互動\n會隨著你的照顧產生變化","howto":"打開遊戲和你的史萊姆打招呼\n照顧牠、和牠互動\n常常回來看看，觀察牠的變化","pin":false},{"id":"g15","title":"狗狗與我的一生","url":"https://claude.ai/artifact/QkNnUA1MhQiqKxKdrC1ric","cat":"養成陪伴","icon":"狗","color":"#a2845e","desc":"養狗人生模擬器：從 25 歲養第一隻狗開始，工作、戀愛、家庭與一隻狗的一生交織在一起。","motive":"我自己是在 25、26 歲養了第一隻狗。養狗之後才發現，人生的每個選擇，忙工作、談戀愛、搬家、出國，狗狗都會感覺到。牠的一輩子只有十幾年，卻是我們人生的一段。我想做一款溫暖的人生模擬，讓玩家在選擇怎麼過日子的同時，記得家裡有一隻在等你的狗。","make":"要求是單一 HTML、沒有後端與資料庫、手機優先，可部署到 Google Apps Script。第一版玩起來太像寫作業，於是加入「安靜的月份」減少每月決策；之後陸續加入選擇犬種、犬種專屬事件、大型犬老得比較快、十歲後的老化徵兆、依情境變化的背景音樂、更多職業、快速模式，以及狗狗離開後一路到主人 80 歲的尾聲。薪資也依台灣基本工資重新校正過。","features":"自選犬種，大型犬與小型犬有不同的壽命與事件\n每月一回合，有時有選擇、有時就靜靜過去\n工作與家庭自由取捨，但狗狗對被留下來很敏感\n骰子系統讓人生充滿意外\n多種結局、人生時間軸，以及狗狗離開後的尾聲\n快速模式可以直接快轉看結局","howto":"選擇你的狗狗品種，從 25 歲開始一起生活\n每個月依情況做選擇：工作、休閒、陪伴、照顧\n注意狗狗的運動、休息與陪伴需求\n走完牠的一生，再看你接下來的人生","pin":false},{"id":"g17","title":"對戰吧！理化獸","url":"https://2z7dc24g2y-netizen.github.io/battle-monsters/","cat":"理化學習","icon":"對","color":"#ff2d55","desc":"班級版的理化獸對戰：用班級代碼登入，帶著練出來的理化獸上白板，和同學一起對戰。","motive":"理化要練題，對戰才有動力。我想讓學生帶著自己練出來的理化獸，在課堂上正面交鋒，讓全班一起熱血起來。","make":"《孵化吧！理化獸》的學校伺服器版本，改名為《對戰吧！理化獸》，用 Firebase 加 GitHub 發佈。","features":"土、水、電、火、木五種屬性互相剋制\n日式陣形 RPG 對戰：前排、中排、後排各司其職，3v3 或 5v5\n十字計時條：橫向球決定攻擊力道，縱向球決定防禦\n老師可以在電子白板上點選學生開戰，全班一起看","howto":"用班級代碼、座號登入，帶上你的理化獸\n對戰時選目標與招式，抓準十字計時條的時機\n答題充能，在關鍵回合放出必殺技","pin":false},{"id":"g18","title":"自然科學島","url":"https://claude.ai/artifact/9YwGx1opFNJZb9D6PVed4h","cat":"理化學習","icon":"島","color":"#30b0c7","desc":"把 108 課綱國中自然變成一整片 3D 群島：每座島是一個學習主題，每棟建築是一個單元。","motive":"課本的章節是一條直線，但學生腦中的知識應該是一張地圖。我受到 HEART 政策島那種把內容做成島嶼的做法啟發，想把整套國中自然課綱做成可以逛、可以玩的群島。學生點開一座島，看到的不是一頁頁講義，而是建築、小實驗、島民和蓋章任務。","make":"從 A 主題「物質組成島」開始，一座島一個頁面，由總地圖串起來，目前規劃 15 座主題島。每座島先寫好規劃文件再動工，內容用詞嚴格依照我上課教的版本（例如用「標準化石」，用韌皮部、木質部而不用超綱的篩管、導管）。遊戲內完全不使用表情符號。","features":"15 座主題島，每座對應一個課綱學習主題\n每個單元都有核心概念介紹和可以動手的小實驗\n每單元 5 題常考的重要例題\n集章任務：自己動手蓋，蓋歪就歪，集滿換獎勵\n島上有音樂、音效，進度紀錄跨版本保留\n每座島都有理化獸挑戰，連到理化獸競技場","howto":"在總地圖點一座島登陸\n逛建築、讀核心概念、玩小實驗\n回答例題、蓋章收集\n集滿章取得獎勵，再前往下一座島","pin":true},{"id":"g20","title":"自然會考秘笈・魔法實驗版","url":"https://claude.ai/artifact/5ZsWReaeoJQFn4A87mfsFr","cat":"理化學習","icon":"秘","color":"#af52de","desc":"給九年級的會考自然複習秘笈，魔法書版本：翻開每一頁都有可以動手玩的實驗台。","motive":"考前的會考複習講義通常又厚又硬。我做了一本《自然會考秘笈》（是秘笈，不是密集），又想給它一個更有趣的版本：像一本魔法書，重點不只用讀的，還能在實驗台上親手操作，看見概念真正在發生。","make":"以我整理的 106 到 115 年歷屆會考分析為基礎，先做出一般版秘笈，再和 Claude 做成魔法書風格、內建互動實驗台的版本，發佈為 Claude Artifact。","features":"會考自然重點整理，依歷屆考題分析\n魔法書風格的翻頁閱讀\n每個重點旁邊都有可以操作的實驗台\n考前快速複習也適合","howto":"打開魔法書，選擇想複習的單元\n先讀重點，再到實驗台動手操作\n把操作結果和重點對照起來\n一個單元一個單元地翻完","pin":false},{"id":"g21","title":"CUBE LAB 魔術方塊實驗室","url":"https://claude.ai/artifact/Wy3md24QQ21xo6xGZiMzQg","cat":"理化學習","icon":"魔","color":"#ff3b30","desc":"魔術方塊互動學習平台：像真的方塊一樣滑動轉層，從新手學院學會復原，再到數學實驗室看懂背後的秘密。","motive":"魔術方塊是很多學生的第一個「解謎」，但多數人卡在不知道從哪裡開始。我想做一個從玩、到學會、到理解數學的完整路徑：先讓你自由轉，再一步一步教你復原，最後告訴你為什麼這些公式會有效。","make":"用我的部門工作流規劃，限制是單一 HTML、手機優先、不需網路。最重要的一點是操作要像真的方塊：手指在某一層上滑，那一層就轉過去。另外也寫了一份《以視覺化公式理解魔術方塊的秘密》文件。","features":"自由轉動：在方塊上滑動就轉層，一鍵打亂\n新手學院：一步一步帶你復原第一顆方塊\n數學實驗室：用視覺化的方式理解公式\n不需網路，手機上就能練習","howto":"自由模式先熟悉轉動手感\n進入新手學院，跟著步驟練習復原\n學會之後到數學實驗室看公式原理\n挑戰自己打亂、自己復原","pin":false},{"id":"g23","title":"AR 投手模擬訓練","url":"https://claude.ai/artifact/SpriqVtMF5LejxTpVGZBe1","cat":"運動體育","icon":"投","color":"#34c759","desc":"把手機放在本壘板，畫面裡 18.44 公尺外的發球機朝你投球。抓準時機揮棒，看擊球落點。","motive":"我班上的學生是棒球隊。打擊練習需要發球機、場地和人力，但「看球、抓時機」這件事，其實可以隨時練。我想讓他們拿起手機就能練打擊的時機感，順便感受球速、距離與時間之間的物理關係。","make":"單一 HTML，可部署到 Google Apps Script。原本畫面上是一個人形投手，但看起來很怪，就改成發球機。之後加入打擊物理：揮棒時機與棒速決定擊球初速、仰角與方向，並在俯視球場上畫出落點，也比對實際模擬球速和設定球速是否一致。後來還加了全壘打大賽小遊戲。結果非常成功，學生完全被吸住。","features":"手機鏡頭搭配發球機，從本壘板的角度看球飛過來\n可以調整球速與球種\n揮棒時機加上棒速，決定擊球初速、仰角與方向\n俯視球場動畫顯示球的落點\n內建全壘打大賽","howto":"把手機放在本壘板的位置，打開鏡頭\n設定球速和球種\n看球從發球機飛來，在對的時機點擊揮棒\n看時機回饋和落點，調整下一球","pin":false},{"id":"g25","title":"外野接高飛球","url":"https://claude.ai/artifact/7QuNKnQGJAFK9Z2XujRTnk","cat":"運動體育","icon":"飛","color":"#00c7be","desc":"從外野手的視角看本壘打出的高飛球：判斷落點、跑過去、接住它。可以改變重力加速度。","motive":"教自由落體時，課本上的公式對棒球隊的學生來說很抽象，但「判斷高飛球落點」是他們每天都在做的事。我想讓他們用最熟悉的守備動作，感受重力加速度怎麼決定一顆球的軌跡。","make":"原本是掛在「自由落體實驗台」裡的小遊戲，後來獨立成一頁。玩過後調整了好幾次：要看得到打者擊球、外野手站近一點、加入更多守備提示（不然太難），也試過把球固定在畫面某個區域方便追。","features":"外野手第一人稱視角，看著球從本壘飛來\n可以自訂重力加速度 g，比較不同重力下的球路\n擊球動畫與守備提示，判斷更直覺\n把物理課的自由落體變成實戰守備","howto":"看打者擊球，球飛向外野\n判斷落點，移動到球的下方\n在球落下的瞬間接住它\n調整 g 再玩一次，感受球路的改變","pin":false},{"id":"g26","title":"投籃物理場","url":"https://claude.ai/artifact/1y9YGUjEvfNSbxvyKnpes1","cat":"運動體育","icon":"籃","color":"#ff9500","desc":"用物理算出完美拋物線：調整出手角度和力道，讓籃球空心入網，全班一起拚排行榜。","motive":"我們班有了籃球隊，剛好正在教直線運動和自由落體。比起在教室做實驗，我更想讓籃球隊的學生直接在投籃裡感受物理：出手角度和速度怎麼決定一顆球會不會進。","make":"和 Claude 做成網頁版的投籃模擬遊戲，不需要實體器材，並加入全班共用的排行榜，讓大家互相較量。","features":"拋體運動的真實軌跡\n調整出手角度與力道\n全班共用排行榜\n把直線運動、自由落體的觀念用在投籃上","howto":"選好出手角度\n控制力道後出手\n觀察軌跡，修正下一球\n命中後登上班級排行榜","pin":false},{"id":"g29","title":"專案辦公室","url":"https://claude.ai/artifact/KKuvLN5zN9acu5FhS2s4eU","cat":"模擬經營","icon":"辦","color":"#ff9500","desc":"12 個部門變成 12 位同事，和你在同一間辦公室工作：看座位、找人開會、看產品在哪裡做出來。","motive":"工廠版本讓我看到流程，但少了「人」。真實的專案是和一群同事一起完成的，每個人有自己的個性和習慣。我想把 12 個部門變成 12 位有個性的同事，大家共用一間辦公室。","make":"和《專案工廠》分開做的新版本。不做 3D，參考了 puma.taipei 那種柔和的低多邊形等角視角：奶油色與橘色、編號標籤、從底部滑出的卡片。辦公室不跑專案也能進去逛。","features":"12 位同事，各有設計好的外型與個性\n辦公室配置、座位、會議空間、產品製作區\n柔和的等角視角低多邊形風格\n不開專案也能自由參觀、認識同事","howto":"進入辦公室，點同事認識他們\n開始一個專案，召集需要的同事開會\n跟著流程在各個區域推進工作\n看產品在辦公室裡一步步做出來","pin":false},{"id":"g30","title":"午後沙發 Sofa Bar","url":"https://claude.ai/artifact/HpGzye1WUhfrNKhHYukPjb","cat":"模擬經營","icon":"沙","color":"#a2845e","desc":"咖啡店吧台手模擬器：從 12 款人氣飲品開始，跟著步驟做出每一杯，可以訓練新人、可以複習，也可以純粹玩。","motive":"我自己很喜歡精品咖啡，從手沖、義式到烘豆都在玩。吧台工作看起來簡單，其實每一杯的步驟、份量、順序都有講究。我想做一款給咖啡愛好者的模擬器，既能當店員訓練教材，也能當遊戲玩。","make":"飲品規格參考星巴克和台灣獨立咖啡店的做法。我先請 Claude 寫圖片提示詞，在 ChatGPT 生成、滿意之後才開始做遊戲。只發佈為 Claude Artifact，目標打磨到商業遊戲的水準，之後再加入季節限定與低咖啡因飲品。","features":"12 款咖啡店人氣飲品\n家教式一步步引導，直覺的畫面操作\n 企業大亨","url":"https://claude.ai/artifact/PxXkjYQw1pHiF262Vmch8n","cat":"模擬經營","icon":"企","color":"#ffcc00","desc":"積木工地風的 Prompt 練習遊戲：每層部門接力產出規格與程式，AI 監工驗收，把大樓蓋進全班的城市。","motive":"很多人用 AI 只會丟一句話，然後覺得結果不好。其實好的作品需要分工：先定需求、再寫規格、再做出來、再驗收。我想把這套流程變成一棟要一層層蓋上去的大樓，讓學生在玩的過程中學會怎麼把一件事拆給 AI 做。","make":"原本是我做的一個 HTML 頁面，請 Claude 修正、優化，再改造成遊戲，發佈為 Claude Artifact，也打算分享到 Facebook 給更多人用。","features":"四個部門接力：每層樓產出一份規格或程式\n在工地現場直接試跑你的成果\nAI 監工幫你驗收，告訴你哪裡要改\n完成的大樓蓋進全班共同的城市","howto":"決定要蓋的專案\n一層層到各部門，用 Prompt 產出內容\n在工地試跑、交給 AI 監工驗收\n通過後大樓完工，加入全班城市","pin":false},{"id":"g19","title":"科技島：未知的召喚","url":"https://claude.ai/artifact/1NSK418L3B2XLY26gMQovR","cat":"理化學習","icon":"科","color":"#5856d6","desc":"自然科學島系列的一座島：踏上科技島，回應一個未知的召喚。","motive":"自然科學島的每座島都有自己的主題與故事，我想讓學生登島時不是在「上課」，而是在探索一個有謎題的地方。","make":"和 Claude 對話製作的單一網頁，延續自然科學島的低多邊形島嶼風格，發佈為 Claude Artifact。","features":"自然科學島系列的獨立島嶼\n以探索和故事帶出學習內容\n延續群島的視覺風格","howto":"登上科技島，跟著召喚前進\n探索島上的地點與線索\n完成島上的挑戰","pin":false},{"id":"g22","title":"方塊樂譜","url":"https://claude.ai/artifact/7RxioJnJLq3pD86rBG4gtx","cat":"理化學習","icon":"譜","color":"#007aff","desc":"把魔術方塊的轉動紀錄彈成曲子：每一次轉動都是一個音。","motive":"做 CUBE LAB 時想到：一串轉動公式其實就是一段有節奏的序列，那它能不能變成音樂？如果每個轉法對應一個音，背熟的公式就成了一首熟悉的曲子。","make":"延伸自 CUBE LAB，和 Claude 做成單一網頁的小實驗，發佈為 Claude Artifact。","features":"每一種轉動對應一個音\n把公式或自己的轉動紀錄變成旋律\n用耳朵記公式，換一種方式學魔術方塊","howto":"轉動方塊或輸入一段轉動紀錄\n按播放，聽它彈成曲子\n試試不同公式，聽聽它們的旋律有什麼不同","pin":false},{"id":"g24","title":"瓶蓋棒球 全壘打大賽","url":"https://claude.ai/artifact/Cjzq9qAoNPYNc1RvV79sEV","cat":"運動體育","icon":"瓶","color":"#a2845e","desc":"台灣學生下課最愛的瓶蓋棒球，變成一場全壘打大賽。","motive":"AR 投手模擬在班上大成功，學生玩到停不下來。瓶蓋棒球是很多台灣學生在教室、走廊玩過的遊戲，瓶蓋飛行時那種飄忽的軌跡特別難打。我想把它也做成一款遊戲，讓大家比誰能把瓶蓋打得最遠。","make":"和 AR 投手模擬分開，做成獨立的單一 HTML 遊戲，可部署到 Google Apps Script。","features":"瓶蓋飄忽不定的飛行軌跡\n全壘打大賽賽制，比遠、比全壘打數\n上手簡單，適合班上互相較量","howto":"看瓶蓋飛過來，抓時機揮棒\n打得越遠越好，飛出全壘打牆就是全壘打\n打完一輪看總成績，挑戰同學的紀錄","pin":false},{"id":"g11","title":"抓內鬼：AI 潛伏者","url":"https://claude.ai/artifact/Ctkk6FqD9G8SEGRcCi8Kjj","cat":"派對問答","icon":"鬼","color":"#8e8e93","desc":"四個人裡藏著一個 <script id="hub-app">

function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function uid(){return "g"+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function lighten(hex,amt){var n=parseInt(hex.slice(1),16),r=n>>16,g=n>>8&255,b=n&255;
  r=Math.round(r+(255-r)*amt);g=Math.round(g+(255-g)*amt);b=Math.round(b+(255-b)*amt);return "rgb("+r+","+g+","+b+")"}
function darken(hex,amt){var n=parseInt(hex.slice(1),16),r=n>>16,g=n>>8&255,b=n&255;
  return "rgb("+Math.round(r*(1-amt))+","+Math.round(g*(1-amt))+","+Math.round(b*(1-amt))+")"}
function iconBg(c){c=/^#[0-9a-f]{6}$/i.test(c||"")?c:"#007aff";return "linear-gradient(180deg,"+lighten(c,.28)+","+c+")"}
function cardBg(c){c=/^#[0-9a-f]{6}$/i.test(c||"")?c:"#007aff";return "linear-gradient(150deg,"+lighten(c,.15)+" 0%,"+c+" 45%,"+darken(c,.45)+" 100%)"}
function catsInUse(){var s={};state.games.forEach(function(g){s[g.cat]=1});
  return state.categories.filter(function(c){return s[c]}).concat(Object.keys(s).filter(function(c){return state.categories.indexOf(c)<0}))}
function idx(id){for(var i=0;i<state.games.length;i++)if(state.games[i].id===id)return i;return -1}
function matches(g){
  if(!ui.edit&&g.hidden)return false;
  if(ui.cat!=="全部"&&g.cat!==ui.cat)return false;
  if(ui.q){var q=ui.q.toLowerCase();return (g.title+" "+g.desc+" "+g.cat).toLowerCase().indexOf(q)>=0}
  return true;

function rowHTML(g){
  var ic='<div class="icon'+iconCls2(g)+'" style="background:'+iconBg(g.color)+'">'+iconInner(g)+'</div>';
  if(ui.edit){
    var armed=ui.armed===g.id;
    return '<div class="row tap'+(g.hidden?' hid':'')+(armed?' confirmdel':'')+'" data-id="'+g.id+'" data-act="edit">'+
      '<button class="minus" data-act="arm" data-id="'+g.id+'" aria-label="刪除"><i></i></button>'+ic+
      '<div class="info"><div class="t">'+esc(g.title)+(g.pin?'<span class="badge">精選</span>':'')+(g.hidden?'<span class="badge" style="color:var(--label2)">已隱藏</span>':'')+'</div><div class="d">'+esc(g.cat)+'</div></div>'+
      '<div class="handle" data-handle="'+g.id+'"><i></i><i></i><i></i></div>'+
      '<button class="delbtn" data-act="del" data-id="'+g.id+'">刪除</button></div>';
  }
  return '<div class="row tap" data-act="detail" data-id="'+g.id+'">'+ic+
    '<div class="info"><div class="t">'+esc(g.title)+'</div><div class="d">'+esc(g.desc||g.cat)+'</div></div>'+
    '<a class="get" href="'+esc(g.url)+'" target="_blank" rel="noopener">開啟</a></div>';
}
function todayHTML(g){
  var sh=shots(g)[0];
  var bg=sh?'background:url(&quot;'+esc(sh)+'&quot;) center top/cover no-repeat,'+cardBg(g.color):'background:'+cardBg(g.color);
  return '<div class="today'+(sh?' photo':'')+'" data-act="detail" data-id="'+g.id+'" style="'+bg+';cursor:pointer">'+
    (hasPix(g)&&!sh?'<span class="pxart">'+pixSVG(g.id)+'</span>':'<span class="emo">'+esc(mark(g))+'</span>')+'<div class="txt"><div class="k">'+esc(g.cat)+'</div><div class="t">'+esc(g.title)+'</div><div class="d">'+esc(g.desc)+'</div></div></div>';
}

function detailHTML(g){
  var feats=nl(g.features),steps=nl(g.howto);
  var h='<div class="page slide">';
  h+='<div class="nav solid" id="nav"><button class="back" data-act="back">'+BACK_SVG+'遊戲大廳</button><div class="mid">'+esc(g.title)+'</div><div class="navright"><button class="navbtn" data-act="edit" data-id="'+g.id+'">編輯</button></div></div>';
  h+='<div class="dhead" style="padding-top:16px"><div class="dicon'+iconCls2(g)+'" style="background:'+iconBg(g.color)+'">'+iconInner(g)+'</div>'+
    '<div class="dmeta"><h1>'+esc(g.title)+'</h1><div class="c">'+esc(g.cat)+'</div><div class="acts"><a class="openbtn" href="'+esc(g.url)+'" target="_blank" rel="noopener">開啟</a></div></div></div>';
  h+='<div class="dstats"><div>分類<b>'+esc(g.cat)+'</b></div><div>作者<b>'+esc(g.author||'辛巴王')+'</b></div><div>平台<b>網頁</b></div></div>';
  var ss=shots(g);
  if(ss.length)h+='<div class="dsec" style="padding-left:0;padding-right:0"><h3 style="padding:0 20px">預覽</h3><div class="gallery">'+ss.map(function(u,n){return '<img src="'+esc(u)+'" alt="'+esc(g.title)+' 截圖 '+(n+1)+'" data-view="'+n+'" loading="lazy">'}).join("")+'</div></div>';
  if(g.desc)h+='<div class="dsec"><p class="lede">'+esc(g.desc)+'</p></div>';
  if(g.motive)h+='<div class="dsec"><h3>創作動機</h3><p>'+esc(g.motive)+'</p></div>';
  if(g.make)h+='<div class="dsec"><h3>製作方式</h3><p>'+esc(g.make)+'</p></div>';
  if(feats.length)h+='<div class="dsec"><h3>遊戲特色</h3><ul class="flist">'+feats.map(function(x){return '<li>'+esc(x)+'</li>'}).join("")+'</ul></div>';
  if(steps.length)h+='<div class="dsec"><h3>怎麼玩</h3><ol class="steps">'+steps.map(function(x){return '<li>'+esc(x)+'</li>'}).join("")+'</ol></div>';
  if(!ss.length)h+='<div class="note" style="padding:18px 20px 0">還沒有遊戲截圖。點右上角「編輯」就能從相簿加入。</div>';
  if(!g.motive&&!g.make&&!feats.length&&!steps.length)h+='<div class="note" style="padding:24px 20px">還沒有介紹內容。點右上角「編輯」補上創作動機、製作方式、特色與玩法。</div>';
  h+='<div class="dsec"><h3>資訊</h3><div class="info2"><div><span>作者</span>'+esc(g.author||'辛巴王')+'</div><div><span>分類</span>'+esc(g.cat)+'</div><div><span>連結</span><a href="'+esc(g.url)+'" target="_blank" rel="noopener">'+esc(g.url.replace(/^https?:\/\//,""))+'</a></div></div></div>';
  h+='<div class="foot">作者 '+esc(g.author||'辛巴王')+'</div></div>';
  return h;
}

function save(after){
  if(artifactApi&&canPublish!==false){
    hud("儲存中…",false);
    artifactApi.publish(buildDocument()).then(function(){ui.dirty=false;lastSaved=JSON.stringify(state);if(after)after();hud("已儲存")})
    .catch(function(err){var c=(err&&(err.code||err.name||err.message))||"";
      if(/conflict/i.test(c)){hud("別處剛更新過，請重新整理",false);return}
      canPublish=false;saveLocal(after)});
  }else saveLocal(after);
}
function saveLocal(after){
  try{localStorage.setItem(LS_KEY,JSON.stringify({savedFrom:raw.length,state:state}));ui.dirty=false;lastSaved=JSON.stringify(state);if(after)after();hud("已存在這台裝置")}
  catch(e){hud("無法儲存",false)}
}
function readForm(){var f=document.getElementById("gform");if(!f)return;var g=ui.editing;
  g.title=f.title.value;g.url=f.url.value;g.icon=f.icon.value;g.desc=f.desc.value;g.motive=f.motive.value;g.make=f.make.value;g.features=f.features.value;g.howto=f.howto.value;g.pin=f.pin.checked;g.hidden=f.hidden.checked;if(f.usepix)g.noPix=!f.usepix.checked;

  if(e.target.id==="q"){ui.q=e.target.value;if(!e.isComposing)render()}
  else if(e.target.id==="f-icon"){var p=document.querySelector(".prev .icon:not(.pix)");if(p){var v=e.target.value.trim()||"?";p.textContent=v;p.classList.toggle("two",v.length>1)}}
});

root.addEventListener("submit",function(e){
  e.preventDefault();
  var f=e.target,g=ui.editing;
  var title=f.title.value.trim(),url=f.url.value.trim();
  if(!title||!url)return;
  if(!/^https?:\/\//i.test(url))url="https://"+url;
  var cat=f.newcat.value.trim()||g.cat||"未分類";
  if(state.categories.indexOf(cat)<0)state.categories.push(cat);
  var data={title:title,url:url,cat:cat,icon:f.icon.value.trim()||title.slice(0,1),desc:f.desc.value.trim(),noPix:f.usepix?!f.usepix.checked:!!g.noPix,shots:shots(g),motive:f.motive.value.trim(),make:f.make.value.trim(),features:f.features.value.trim(),howto:f.howto.value.trim(),color:g.color,pin:f.pin.checked,hidden:f.hidden.checked};
  if(g.id)Object.assign(state.games[idx(g.id)],data);
  else{data.id=uid();state.games.unshift(data)}
  ui.modal=null;ui.editing=null;if(!ui.detail)ui.edit=true;touch();
  if(!ui.edit){save();return}
  hud(g.id?"已更新":"已加入");
});

root.addEventListener("click",function(e){
  if(dragJustEnded){dragJustEnded=false;return}
  var t;
  if((t=e.target.closest("[data-rmshot]"))){readForm();var arr=shots(ui.editing);arr.splice(+t.getAttribute("data-rmshot"),1);ui.editing.shots=arr;render();return}
  if(e.target.closest(".viewer")){ui.view=null;render();return}
  if((t=e.target.closest("[data-view]"))){ui.view=t.getAttribute("src");render();return}
  if(e.target.closest(".addshot"))return;
  if(e.target.name==="usepix"){readForm();render();return}
  if((t=e.target.closest("[data-color]"))){readForm();ui.editing.color=t.getAttribute("data-color");render();return}
  if((t=e.target.closest("[data-pickcat]"))){readForm();ui.editing.cat=t.getAttribute("data-pickcat");render();return}
  if((t=e.target.closest("[data-cat]"))){ui.cat=t.getAttribute("data-cat");ui.armed=null;render();return}
  if(e.target.closest("[data-handle]"))return;
  if(e.target.closest("a[href]"))return;
  var b=e.target.closest("[data-act]");
  if(!b){if(ui.armed){ui.armed=null;render()}return}
  if(b.classList.contains("dim")&&e.target!==b)return;
  var act=b.getAttribute("data-act"),id=b.getAttribute("data-id"),i=id?idx(id):-1;
  if(ui.armed&&act!=="del"&&act!=="arm"){ui.armed=null;render();return}
  switch(act){
    case "detail":openDetail(id);return;
    case "back":closeDetail();return;
    case "editmode":ui.edit=true;ui.detail=null;break;
    case "exit":
      if(ui.dirty){ui.alert={title:"尚未儲存變更",msg:"要先儲存再離開編輯嗎？",cancel:"不儲存",ok:"儲存",kind:"exit"}}
      else ui.edit=false;break;
    case "add":ui.editing={title:"",url:"",cat:ui.cat!=="全部"?ui.cat:(state.categories[0]||""),icon:"",desc:"",motive:"",make:"",features:"",howto:"",color:PALETTE[Math.floor(Math.random()*PALETTE.length)],pin:false,hidden:false};ui.modal="form";break;
    case "edit":ui.editing=Object.assign({},state.games[i]);ui.modal="form";break;
    case "close":ui.modal=null;ui.editing=null;break;
    case "arm":ui.armed=ui.armed===id?null:id;break;
    case "del":
      var gone=state.games.splice(i,1)[0];if(gone)state.trash.unshift(gone);
      ui.armed=null;ui.modal=null;ui.editing=null;touch();
      if(!ui.edit){ui.detail=null;save();return}
      hud("已移到回收桶");return;
    case "trash":ui.modal="trash";break;
    case "restore":for(var k=0;k<state.trash.length;k++)if(state.trash[k].id===id){state.games.unshift(state.trash.splice(k,1)[0]);break}touch();break;
    case "askempty":ui.alert={title:"清空回收桶？",msg:"裡面的遊戲會永久刪除，無法還原。",ok:"清空",danger:true,kind:"empty"};break;
    case "alertcancel":
      if(ui.alert&&ui.alert.kind==="exit"){state=JSON.parse(lastSaved);ui.dirty=false;ui.edit=false}
      ui.alert=null;break;
    case "alertok":
      var al=ui.alert;ui.alert=null;
      if(al.kind==="empty"){state.trash=[];touch()}
      if(al.kind==="exit"){save(function(){ui.edit=false});return}
      break;
    case "save":save();return;
  }
  render();
});

/* drag to reorder */
var drag=null,dragJustEnded=false;
root.addEventListener("pointerdown",function(e){
  var hdl=e.target.closest("[data-handle]");if(!hdl)return;
  e.preventDefault();
  var row=hdl.closest(".row"),list=row.parentNode;
  drag={row:row,list:list,startY:e.clientY,pid:e.pointerId,moved:false};
  row.classList.add("dragging");
  try{hdl.setPointerCapture(e.pointerId)}catch(_){}
});
root.addEventListener("pointermove",function(e){
  if(!drag||e.pointerId!==drag.pid)return;
  e.preventDefault();
  var row=drag.row,rows=[].slice.call(drag.list.children);
  var dy=e.clientY-drag.startY;
  row.style.transform="translateY("+dy+"px) scale(1.02)";
  var r=row.getBoundingClientRect(),mid=r.top+r.height/2,pos=rows.indexOf(row);
  var prev=rows[pos-1],next=rows[pos+1];
  if(prev){var pr=prev.getBoundingClientRect();if(mid<pr.top+pr.height/2){drag.list.insertBefore(row,prev);drag.startY-=pr.height;drag.moved=true;row.style.transform="translateY("+(e.clientY-drag.startY)+"px) scale(1.02)"}}
  if(next){var nr=next.getBoundingClientRect();if(mid>nr.top+nr.height/2){drag.list.insertBefore(next,row);drag.startY+=nr.height;drag.moved=true;row.style.transform="translateY("+(e.clientY-drag.startY)+"px) scale(1.02)"}}
});
function endDrag(e){
  if(!drag||(e&&e.pointerId!==drag.pid))return;
  var ids=[].map.call(drag.list.children,function(r){return r.getAttribute("data-id")});
  var moved=drag.moved;drag.row.classList.remove("dragging");drag.row.style.transform="";drag=null;
  if(!moved)return;
  dragJustEnded=true;setTimeout(function(){dragJustEnded=false},50);
  var slots=[];state.games.forEach(function(g,n){if(ids.indexOf(g.id)>=0)slots.push(n)});
  var byId={};state.games.forEach(function(g){byId[g.id]=g});
  slots.forEach(function(s,n){state.games[s]=byId[ids[n]]});
  touch();render();
}
root.addEventListener("pointerup",endDrag);
root.addEventListener("pointercancel",endDrag);

  if(m==="hop")return ["hop",Math.min(5,Math.floor(d.t*6))];

  var f=[0,1,3,1][Math.floor(t*3)%4];if(Math.floor(t*.5)%6===5&&Math.floor(t*3)%3===0)f=2;return ["idle",f];
}
function grass(){
  var y0=H-GR;g.fillStyle="#7cc35a";g.fillRect(0,y0,W,GR);g.fillStyle="#5fa847";g.fillRect(0,y0+GR-7,W,7);
  g.fillStyle="#9bd874";g.fillRect(0,y0,W,2);
  for(var x=0;x<W;x+=7){var s=(x*37)%11;g.fillStyle=s<5?"#68b24c":"#8fd06a";g.fillRect(x+(s%4),y0-2-(s%3),2,3+(s%3));}
  // 小聖誕樹
  var now=new Date(),mo=now.getMonth()+1,dd=now.getDate();
  if(mo===12||(mo===11&&dd>=15)||(mo===1&&dd<=5)){var tx=26,ty=y0+2;
    g.fillStyle="#6b4423";g.fillRect(tx-2,ty-6,5,6);
    [[0,9,12],[8,7,10],[15,5,8]].forEach(function(q){g.fillStyle="#2e8b4e";for(var r=0;r<q[2];r++){var w=Math.round(q[1]*(r+1)/q[2]);g.fillRect(tx-w,ty-6-q[0]-q[2]+r,w*2+1,1)}});
    g.fillStyle="#ffd166";g.fillRect(tx-1,ty-33,3,3);
    var cols=["#ff4d5a","#ffd166","#4cc9f0"],pp=[[-5,-12],[4,-16],[-2,-22],[3,-26],[-6,-18]];
    pp.forEach(function(p,i){g.fillStyle=((Math.floor(T*1.5)+i)%2)?cols[i%3]:"#355e43";g.fillRect(tx+p[0],ty+p[1],2,2)})}
}
var lastT=performance.now();
function loop(now){
  var dt=Math.min(.05,(now-lastT)/1000);lastT=now;
  var hidden=!!document.querySelector(".toolbar");
  wrap.style.display=hidden?"none":"";
  if(!hidden&&!document.hidden){
    T+=dt;d.t+=dt;
    if(d.mode==="walk"){var sp=d.run?130:42,dx=d.tx-d.x;if(Math.abs(dx)<=sp*dt){d.x=d.tx;var th=d.then;d.then=null;set("idle",2+Math.random()*3);if(th)th()}else{d.x+=Math.sign(dx)*sp*dt;d.dist+=sp*dt;d.face=dx>0?1:-1}}
    else if(d.t>=d.dur)think();
    if(d.mode==="belly"&&d.t>.6&&Math.random()<dt*2)heart(d.x+(Math.random()-.5)*30,H-GR-40);
    if(d.mode==="sleep"&&Math.random()<dt*.6)parts.push({k:"z",x:d.x+d.face*28,y:H-GR-38,vx:6,vy:-12,t:0,life:2});
    d.x=Math.max(minX(),Math.min(maxX(),d.x));
    g.setTransform(DPR,0,0,DPR,0,0);g.clearRect(0,0,W,H);grass();
    if(IMG.complete&&IMG.naturalWidth){var fr=A.meta[frameOf()[0]],f=fr[frameOf()[1]]||fr[0];
      var y=H-GR+7;g.fillStyle="rgba(40,70,30,.28)";g.beginPath();g.ellipse(d.x,y,34,4,0,0,7);g.fill();
      g.save();g.translate(Math.round(d.x),y);g.scale(d.face*S,S);g.imageSmoothingEnabled=true;g.imageSmoothingQuality="high";
      g.drawImage(IMG,f[0],f[1],f[2],f[3],-f[4],-f[5],f[2],f[3]);g.restore();
      var bw=f[2]*S,bh=f[3]*S,left=d.face>0?d.x-f[4]*S:d.x-(f[2]-f[4])*S;
      hit.style.left=Math.round(left)+"px";hit.style.top=Math.round(y-f[5]*S)+"px";hit.style.width=Math.round(bw)+"px";hit.style.height=Math.round(bh)+"px"}
    for(var i=parts.length-1;i>=0;i--){var p=parts[i];p.t+=dt;if(p.t>p.life){parts.splice(i,1);continue}p.x+=p.vx*dt;p.y+=p.vy*dt;
      g.globalAlpha=Math.max(0,1-p.t/p.life);
      if(p.k==="h"){g.fillStyle="#ff4d6d";var X=Math.round(p.x),Y=Math.round(p.y);g.fillRect(X-4,Y-2,3,3);g.fillRect(X+1,Y-2,3,3);g.fillRect(X-4,Y,8,3);g.fillRect(X-2,Y+3,4,2)}
      else{g.fillStyle="#fff";g.strokeStyle="#7a8aa0";g.font="700 12px sans-serif";g.lineWidth=2;g.strokeText("z",p.x,p.y);g.fillText("z",p.x,p.y)}
      g.globalAlpha=1}
  }
  requestAnimationFrame(loop);
}
if(night())set("sleep",30);else set("idle",2);
requestAnimationFrame(loop);
}catch(e){}
})();
